# Distribution metadata for the `mojolearn` package on PyPI.
#
# setup.py holds only the two facts PEP 621 cannot express: the wheel is not
# pure Python, and the macOS platform tag comes from the Mojo compile step
# rather than from the building machine. Nothing is stated in both files.

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
# 77 is the floor because the PEP 639 `license` expression and `license-files`
# below are only understood from that version.

[project]
name = "mojolearn"
# Must agree with python/mojolearn/_version.py. Not made dynamic, so that a
# version bump is a visible edit in both places rather than one.
version = "0.2.0"
description = "GPU machine learning in Mojo. Gradient boosting, random forests, extra trees, SVM, k-means, k-NN, DBSCAN, PCA, hierarchical and spectral clustering, GLMs, scoring metrics and a bit-identical FP32 matmul on Apple silicon, bit-identical across GPU vendors on request"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Andrew Hendel" }]
maintainers = [{ name = "Andrew Hendel" }]
keywords = [
    "machine learning",
    "gpu",
    "metal",
    "apple silicon",
    "mojo",
    "gradient boosting",
    "random forest",
    "extra trees",
    "clustering",
    "k-means",
    "nearest neighbors",
    "dbscan",
    "pca",
    "svm",
    "kernel density",
    "hierarchical clustering",
    "spectral clustering",
    "isolation forest",
    "time series",
    "metrics",
    "bitwise reproducibility",
]

# THE FLOOR IS 3.10 AND IT IS THE VERIFY LOOP THAT BACKS IT.
#
# This block read "THE FLOOR IS 3.12 AND IT IS MEASURED" and closed with "3.10
# and 3.11 are NOT claimed because they were not run, and a floor is a
# promise". Both sentences are now false and are deleted rather than softened.
# Measured 2026-08-24: python3.10 through python3.14 are ALL present on this
# machine (/opt/homebrew/bin), and packaging/macos/verify_wheel.sh:37 loops
# over all five by name. The paragraph thirty lines below always said the
# oldest verified numpy was 1.26.4 "on python3.10, running the full smoke
# fit", so the two halves of this file already disagreed.
#
# `requires-python = ">=3.10"` therefore matches both the classifier list and
# what the verify loop exercises, and it is what 0.1.0 already shipped.
#
# THE PROMISE IS ONLY AS GOOD AS THE RUN. verify_wheel.sh must come back green
# on python3.10 and python3.11 for this floor to be honest. If either reports
# SKIP or fails, the floor moves up to where the loop is green, in the same
# commit; it does not stay at 3.10 because a comment says so.
# The extension links NO libpython (`otool -L` shows only the two MAX runtime
# dylibs and libSystem), so it resolves CPython by name at runtime and one
# artifact can serve several interpreters. That is the mechanism; the floor is
# where it was actually tested. `packaging/macos/verify_wheel.sh` imports the
# built wheel under every python3.N on the build machine and runs a fit. All
# five of 3.10 through 3.14 are on this machine and in that loop as of
# 2026-08-24, which is what the floor above rests on. The sentence that stood
# here said 3.10 and 3.11 were NOT claimed because they had not been run; the
# block forty lines up had already corrected and dated that, so it is deleted
# rather than softened. A floor is a promise and it is only as good as the run.

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    # macOS on Apple silicon is the only platform with a wheel. The library
    # builds for Linux from the same source but no Linux wheel has ever been
    # produced, so no Linux classifier is claimed.
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    # Compiled by the Mojo toolchain against CPython, not the limited API.
    # No PyPy, no free-threaded build: max 26.5.0 depends on python-gil.
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Not claimed, and each is a decision rather than an oversight:
#   Environment :: GPU :: NVIDIA CUDA   no NVIDIA device has ever run this.
#   Typing :: Typed                     no py.typed marker, no stubs.
#   License :: ...                      PEP 639 forbids a license classifier
#                                       beside the `license` expression.

# numpy IS required, unlike mojotrees where it is optional. The boundary here
# takes raw buffer addresses out of `__array_interface__`, and every estimator
# returns arrays. There is no plain-sequence path to degrade to and pretending
# otherwise would be a claim with nothing behind it.
# 1.24 is a floor, not a measurement, and it is not a narrow one: numpy
# publishes no arm64 wheel for 1.21 or 1.23 on any interpreter this package
# supports (checked 2026-08-20 against py3.10 arm64, both refused with "no
# matching distribution"), so nothing older is installable on the only
# platform this wheel targets. The oldest actually verified is 1.26.4, on
# python3.10, running the full smoke fit. The boundary uses only
# `asarray`, `ascontiguousarray`, `empty`, `zeros`, `astype`, `.flags` and
# `__array_interface__`, all of which long predate any of these.
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/mojolearn/mojolearn"
Repository = "https://github.com/mojolearn/mojolearn"
Issues = "https://github.com/mojolearn/mojolearn/issues"

[project.scripts]
# Kept outside the mojolearn package deliberately: this command must work
# when importing a compiled extension is the thing a user needs to diagnose.
mojolearn = "mojolearn_diagnostics:main"

[tool.setuptools]
# Listed explicitly rather than discovered, so a new subpackage is a
# deliberate edit and not a silent addition to a published artifact.
packages = ["mojolearn"]
py-modules = ["mojolearn_diagnostics"]
include-package-data = false

[tool.setuptools.package-data]
# The extensions and the MAX runtime dylibs that
# packaging/macos/build_release_wheel.sh stages beside them. All are
# gitignored build outputs, so this describes a BUILT tree rather than a
# checkout. A wheel missing any of them is broken at import, and the
# clean-venv install in verify_wheel.sh is what catches that.
#
# THE `*.so` GLOB IS WHY build_release_wheel.sh MUST BUILD EVERY EXTENSION.
# It does not ship what is missing -- it ships whatever .so happens to be
# sitting in the working tree, however old. `_mojolearn.so` shipped that way
# once, predating eval_x/eval_y, and every user's fit raised "takes 6
# positional arguments but 8 were given". As of 2026-08-24 the extensions are
# TEN, not the five this comment used to name: `_mojolearn.so` (k-means,
# k-NN), `_mojolearn_gbdt.so` (gradient boosting), `_mojolearn_estimators.so`
# (DBSCAN, PCA, tSVD, OLS), `_mojolearn_rf.so` (random forest),
# `_mojolearn_trees.so` (extra trees), `_mojolearn_svm.so` (SVC),
# `_mojolearn_solver.so` (Lasso, ElasticNet, AgglomerativeClustering),
# `_mojolearn_metrics.so` (metrics, SpectralClustering), `_mojolearn_tsa.so`
# (Holt-Winters, KPSS) and `_mojolearn_linalg.so` (the identical GEMM). Each
# is built TWICE: the FAST set here and the IDENTICAL set under identical/,
# which _backend.py loads when MOJOLEARN_NUMERIC_MODE=identical. All twenty
# files are built by build_release_wheel.sh (EXT_NAMES is THE list), which
# refuses a stale file by mtime.
mojolearn = ["*.so", "identical/*.so", "deterministic/*.so", ".dylibs/*.dylib"]
