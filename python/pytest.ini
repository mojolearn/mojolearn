[pytest]
# tools/run_python_tests.py runs tests marked serial in one process after the
# parallel (pytest-xdist) pass: mark tests that cannot share the machine with
# other test processes (process-wide state, device ownership, fixed paths).
# mojolearn/tests/conftest.py applies the others: `slow` is deselected by
# MOJOLEARN_TEST_SLOW=0 (kept by default); each needs_* marker skips the test
# at collection, with the reason, when this environment cannot run it.
markers =
    serial: run in one process after the parallel pass
    slow: work that is long by nature; MOJOLEARN_TEST_SLOW=0 deselects it
    needs_fast_tier: needs a numeric_mode='fast' binary set (none in a development build)
    needs_identity_harness: needs mojolearn._identity_break (copied into the package by the wheel build)
    needs_numpy_free_python: needs MOJOLEARN_NUMPY_FREE_PYTHON naming an interpreter without NumPy
    needs_installed_package: needs mojolearn importable in a child without PYTHONPATH (installed or editable)
