# THE TRAINING-LOOP GATES, which had no task at all until 2026-09-03 --
# TRAINING_LOOP_PLAN.md section 12 item 7 is exactly this, and the 2026-08-28
# Apple and AMD legs drove the gate by path because there was nothing to name.
#
# `check-train-checkpoint` is WRITTEN AND HAS NEVER RUN, along with
# `training/checkpoint.mojo` and `training/CHECKPOINT_FORMAT.md`
# (DEVIATIONS 2050-2069). It is the FILE form of the resume that
# `train_step_check`'s clause (d) can only do inside one process. Its
# cross-vendor use is two legs and a `cmp`:
#   MOJOLEARN_TRAIN_STEPS=8 MOJOLEARN_TRAIN_CKPT_FILE=/tmp/<box>.ckptbin \
#     pixi run check-train-checkpoint
#   cmp -l /tmp/apple.ckptbin /tmp/amd.ckptbin
#   MOJOLEARN_CKPT_COMPARE_A=... MOJOLEARN_CKPT_COMPARE_B=... \
#     pixi run check-train-checkpoint
# **A leg that writes the file and never has it compared against another
# VENDOR'S is not a result.**
check-train-step = "mojo run -I . training/checks/train_step_check.mojo"
check-train-loop = "mojo run -I . training/checks/train_loop.mojo"
check-train-checkpoint = "mojo run -I . training/checks/checkpoint_check.mojo"
# The INDEPENDENT cross-check: torch float64 per-stage reference, the only
# comparison in this lane whose other side is not our own code. TWO STEPS --
# the dump is produced by the gate above, then compared:
#   MOJOLEARN_MAMBA_CORPUS_CASE=1 MOJOLEARN_MAMBA_CORPUS_DUMP=<dir> pixi run check-mamba-block
#   MOJOLEARN_MAMBA_CORPUS_DUMP=<dir> pixi run check-mamba-corpus
# Tolerance is NOT arbitrary: 1e-7/1e-6 is what plain torch FP32 achieves
# against the same float64 reference (tools/mamba_corpus_check.py --self-test),
# two orders tighter than that tool's 1e-5 default. Use base_b2_l4_d8, NOT the
# smaller b1_l1 case: at L=1 token-major and channel-major are the same bytes,
# so the smaller case cannot certify the reindexing at all.
check-mamba-corpus = "python tools/mamba_corpus_check.py mamba/corpus/base_b2_l4_d8 $MOJOLEARN_MAMBA_CORPUS_DUMP --rtol 1e-7 --atol 1e-6"
# The mamba2 and mamba3 corpus gates (contracts' section 8g;
# tools/mamba_corpus_check.py is family-agnostic -- it reads each case's own
# manifest.json/ref64, so the SAME tool serves all three families). Both use
# the B=2 L=4 case for the same reason mamba1 does: at L=1 token-major and
# channel-major are the same bytes, so the smaller case cannot certify the
# reindexing at all. Tolerances are the tool's defaults (1e-5/1e-6) until a
# `--self-test` calibration run lands per family, exactly how mamba1 earned
# its tighter 1e-7 -- that calibration is RUN OWED (README.md, "Tolerance
# calibration"), and tightening these lines is that run's deliverable.
# The mamba3 corpus FILES are RUN OWED too (gen_corpus.py --family mamba3);
# until they exist this task refuses on the missing manifest, which is the
# correct refusal, not a defect.
check-mamba2-corpus = "python tools/mamba_corpus_check.py mamba/corpus/mamba2/m2_base_b2_l4_d32 $MOJOLEARN_MAMBA_CORPUS_DUMP --rtol 1e-5 --atol 1e-6"
check-mamba3-corpus = "python tools/mamba_corpus_check.py mamba/corpus/mamba3/m3_base_b2_l4_d32 $MOJOLEARN_MAMBA_CORPUS_DUMP --rtol 1e-5 --atol 1e-6"
