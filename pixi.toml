# The PYTHON surface gate for `mojolearn.ARIMA` (fit/predict/forecast,
# `python/mojolearn/tests/test_arima_surface.py`). DEVIATION 796
# (arima/README.md, "Public estimator surface"): ONE TIER PER PROCESS --
# the Python side freezes its numeric tier at import, so unlike
# `check-arima` this task cannot cover both tiers in one run. Run it once
# plain (FAST: bitwise arms RECORDED, not asserted) and once under
# `MOJOLEARN_NUMERIC_MODE=identical` (bitwise arms ASSERTED), after
# `bash bindings/build_arima.sh` in each mode. RUN 2026-09-02 AND GREEN IN
# BOTH TIERS ON ONE APPLE M4, the task's own command line from `python/`,
# one process per tier -- 88 checks and 0 failed in each. The identical run
# printed the GREEN verdict (planted coefficients recovered, the canonical
# NaN before d, the AR(1) closed-form forecast, and one series the same
# BITS alone as inside a batch of six); the fast run printed "the fast arms
# passed, AND NO BIT WAS CHECKED", which is what a FAST run is worth.
# APPLE ONLY -- a second and third vendor through this surface is still
# OPEN. The ordered ledger is in arima/README.md.
check-arima-surface = "cd python && python3 -m mojolearn.tests.test_arima_surface"
# spectral: SOURCE ONLY, no gate and no sabotage has ever run. The five sabotage arms written
# 2026-08-23 have NEVER BEEN COMPILED, so a syntax error in them would break this build.
check-spectral = "mojo run -I . spectral/checks/spectral_check.mojo"
spectral-card = "mojo run -I . spectral/spectral_main.mojo"
check-umap = "mojo run -I . umap/checks/graph_check.mojo"
check-umap-identical = "mojo run -D MOJOLEARN_NUMERIC_IDENTICAL=1 -I . umap/checks/graph_check.mojo"
check-umap-spectral = "mojo run -I . umap/checks/spectral_init_check.mojo"
check-umap-optimizer = "mojo run -I . umap/checks/optimizer_check.mojo"
check-umap-estimator = "mojo run -I . umap/checks/estimator_check.mojo"
check-umap-curve = "mojo run -I . umap/checks/curve_check.mojo"
bench-umap-optimizer = "mojo run -I . umap/bench/optimizer_bench.mojo"
check-if = "mojo run -I . isolation_forest/checks/if_check.mojo"

# The depthwise IDENTITY TRACE: one hash record per stage of a fit, so a
# bitwise disagreement between two GPUs has an ADDRESS instead of only
# "the models differ".
#
# IT USES `core/identity_trace.mojo`, THE LOSSGUIDE LANE'S FACILITY, and
# does not re-implement it. This lane briefly had its own copy
# (the former stage-digest check, commit e5cef46) because both lanes built
# the same instrument inside the same hour without knowing; it is deleted.
# Theirs is a strict superset -- generic over DType, `create_sub_buffer` for
# a short read, raw dumps, tag-uniqueness enforcement, a format version, and
# `tools/identity_trace_diff.py`, which aligns two traces on tag SEQUENCES
# and classifies each differing cell (DENORMAL-vs-ZERO / SIGN / NAN-payload
# / ULP<=n / LARGE). That classification is the DIAGNOSIS; a hash is only
# the location.
#
# This probe writes three traces and answers two questions locally:
#   CONTROL       the same configuration twice. Run-to-run noise and machine
#                 dependence are indistinguishable without it, and under
#                 FAST on a backend with float threadgroup atomics the
#                 control is expected to FAIL.
#   LOCALIZATION  this device's core count vs 108 (an A100's). The core
#                 count is the only machine-dependent input the algorithm
#                 has, so this is the cross-GPU question asked in one
#                 process.
# It also leaves the two traces on disk and prints the `identity_trace_diff`
# command, which is the cross-MACHINE path.
#
# NOT A BENCHMARK and never to be one -- it drains and copies at every
# record. Not a gate either; `check-depthwise` claim 6 is. This is what you
# run when a gate has already gone red. On a new backend the order is
# `check-ieee-arith`, then `check-depthwise`, then this.
check-depthwise-trace = "mojo run -I . checks/depthwise_trace_probe.mojo"

# E2 IDENTITY CARDS FOR THE TRAINING PATHS PYTHON CANNOT REACH. The sweep
# driver (`tools/e2_matrix_fit.py`) emits a card per Python-reachable
# configuration; four paths have no Python surface -- DEPTHWISE and
# LOSSGUIDE growth (no `grow_policy` slot on `gbdt_fit`),
# `MultiClassOneVsAll` (refused by name in `ensemble.py`) and the
# feature-parallel searcher (no caller but its own check, archive/plans/UNWIRED.md) --
# and this probe emits theirs: `<out_dir>/<name>.card`, ONE fit per file,
# hashed fixtures that are pure functions of constants, machine-independent
# tags, and a record-count floor per card so an unwired trace cannot pass
# as agreement. The feature-parallel card is OUTPUT-LEVEL (splits +
# docBins; the searcher has no trace plumbing). Takes `<out_dir>` and an
# optional card-name filter; `tools/e2_mojo_cards.sh` runs it twice (the
# run-to-run control) and writes `e2_mojo_cards.json`. NOT A BENCHMARK.
e2-growth-cards = "mojo run -I . checks/e2_growth_cards.mojo"

[feature.bench.tasks]
# CatBoost's own Logloss leaf values at ten Newton iterations and at one,
# with the leaf-order mapping proved twice inside the generator and written
# into the fixture. Writes bench/oracle_logloss_leaves.txt.
logloss-leaf-oracle-gen = "python tools/catboost_logloss_leaf_oracle.py"
# Runs CatBoost itself. Writes bench/oracle.txt (read by `oracle`) and
# bench/oracle.json (the same content, for humans and for diffing).
# Runs CatBoost CPU for the nine losses ported 2026-08-21. Writes
# bench/oracle_losses.txt (read by `check-loss-oracle`).
loss-oracle-gen = "python tools/catboost_loss_oracle.py"
oracle-gen = "python tools/catboost_oracle.py > bench/oracle.json"

# The 5-bit and 6-bit one-byte fixtures. 24 folds lands in 16..32 and 48 in
# 33..64, which are the ranges `pointwise_hist2_one_byte_templ.cuh:179-183`
# gives those two accumulators; before these, neither had a differential
# against CatBoost at all (archive/reference/PORTING.md 130).
oracle24-gen = "ORACLE_BORDERS=24 ORACLE_OUT=bench/oracle24.txt python tools/catboost_oracle.py > bench/oracle24.json"
oracle48-gen = "ORACLE_BORDERS=48 ORACLE_OUT=bench/oracle48.txt python tools/catboost_oracle.py > bench/oracle48.json"

# Every fixture `oracle-sweep` reads. `bench/oracle_d4_f16.txt` must come out
# BYTE-IDENTICAL to `bench/oracle.txt` -- that identity is the check that the
# ORACLE_DEPTH / ORACLE_FEATS plumbing changed nothing at the defaults, and the
# `cmp` at the end is what enforces it.
oracle-sweep-gen = """
for d in 1 2 4 6 8; do for f in 8 16 32; do
  ORACLE_DEPTH=$d ORACLE_FEATS=$f ORACLE_OUT=bench/oracle_d${d}_f${f}.txt \
    python tools/catboost_oracle.py > bench/oracle_d${d}_f${f}.json
done; done
for b in 24 48 100 254; do
  ORACLE_DEPTH=8 ORACLE_BORDERS=$b ORACLE_OUT=bench/oracle_d8_b${b}.txt \
    python tools/catboost_oracle.py > bench/oracle_d8_b${b}.json
done
cmp bench/oracle.txt bench/oracle_d4_f16.txt
"""

# CatBoost's OWN MinEntropy borders for the CTR TARGET grid, at budgets 1,
# 2 and 3 over five target-shaped columns. Separate from
# `bench/minentropy_oracle.txt` because budget 1 is a different code path:
# `bins == 2` makes the DP's per-level loops run zero times and the answer
# comes entirely from the last match, whose tie-break is the opposite of
# theirs.
ctr-target-oracle-gen = "python tools/ctr_target_oracle.py > bench/ctr_target_oracle.txt"

# The root split recomputed in numpy from the oracle's own data, with no GPU
# and no Mojo in the question. Its L2 line reproduces CatBoost's L2 root split
# exactly, which is what makes its Cosine disagreement evidence.
score-probe = "python tools/score_probe.py"

# boost_from_average against CatBoost ITSELF: their get_scale_and_bias()
# bias vs the bias our python surface reports, bit for bit, on hashed
# fixtures -- every ported arm (RMSE/Logloss, weighted and not), BOTH
# sides of their data-dependent default (unset RMSE auto-true, unset
# Logloss stays zero -- Logloss is NOT on their adjust list, the misread
# behind the 2026-08-22 higgs report), and a weighted-vs-unweighted
# sabotage. Needs the rebuilt _mojolearn_gbdt.so; a GPU; seconds.
check-bfa-oracle = "python tools/bfa_oracle_check.py"

[feature.bench.dependencies]
python = ">=3.11"
numpy = "*"
# The incumbent we are porting. `tools/catboost_reference.py` calls it to
# produce the oracle values a check compares against, which is the only way a
# port gets an answer it did not compute itself.
catboost = ">=1.2"
# Only for its DATASET LOADERS. covtype is 581012 x 54 of real data, which is
# what a timing claim needs beside a synthetic one. Not used as an oracle for
# the tree port; CatBoost is the oracle there.
scikit-learn = "*"

# THE GPU BASELINE ARM, added 2026-08-20. Its own feature, NOT added to
# `bench`, and that separation is deliberate.
#
# `bench_sklearn.py` claimed in its docstring that scikit-learn has no GPU arm
# on this machine. Checking that claim needs pytorch, and pytorch is a large
# dependency that drags scipy and numpy solves with it. Adding it to `bench`
# would re-solve the environment every recorded timing in this repository was
# taken under, and a benchmark whose baseline moved is not a baseline.
#
# So `skgpu` is a SECOND environment. It resolves to the same sklearn 1.9.0,
# numpy 2.5.2 and scipy 1.18.0 that `bench` already has (verified 2026-08-20),
# which is what makes a number taken here comparable to one taken there. Those
# three are pinned exactly rather than left open for that reason: if a future
# solve moves them, the pin fails loudly instead of silently making the two
# environments incomparable.
[feature.skgpu.dependencies]
python = "3.14.*"
# Reaches Metal through torch's `mps` device. conda-forge's osx-arm64 build is
# tagged `cpu_generic` but MPS is compiled in regardless; verified on
# 2026-08-20 that `torch.backends.mps.is_available()` is True and a matmul
# runs on device. Do not infer the answer from the build string.
pytorch = ">=2.13"
# Required by the verbatim upstream selective-scan and SSD references used by
# the Mamba forward/gradient corpus. It stays in this PyTorch-only environment
# rather than expanding the core Mojo environment.
einops = ">=0.8"
# Pinned to `bench`, not floating. See the note above.
scikit-learn = "==1.9.0"
numpy = "==2.5.2"
scipy = "==1.18.0"

[feature.skgpu.tasks]
# scikit-learn CPU against scikit-learn MPS, same estimator both arms, so the
# ratio is the device and nothing else. Prints REFUSED lines for the four
# estimators that cannot reach the GPU at all, which is most of them.
sklearn-gpu = "python bench/bench_sklearn_gpu.py"

# Independent Mamba forward corpora and whole-block gradient oracles. Corpus
# tasks write only to a fresh temporary directory; refreshing committed binary
# fixtures remains an explicit, reviewed operation.
mamba-corpus-m1 = "work=$(mktemp -d); python mamba/corpus/gen_corpus.py --family mamba1 --verify --out $work"
mamba-corpus-m2 = "work=$(mktemp -d); python mamba/corpus/gen_corpus.py --family mamba2 --verify --out $work"
mamba-corpus-m3 = "work=$(mktemp -d); python mamba/corpus/gen_corpus.py --family mamba3 --verify --out $work"
mamba-grad-m1 = "work=/tmp/mojolearn-mamba1-grad; mkdir -p $work; find $work -maxdepth 1 -type f -delete; python tools/mamba_gradient_oracle.py --family mamba1 --out $work"
mamba-grad-m1-public = "oracle=/tmp/mojolearn-mamba1-grad; actual=/tmp/mojolearn-mamba1-actual; mkdir -p $oracle $actual; find $oracle -maxdepth 1 -type f -delete; find $actual -maxdepth 1 -type f -delete; python tools/mamba_gradient_oracle.py --family mamba1 --out $oracle; MOJOLEARN_MAMBA_GRAD_DUMP=$actual tools/with_identical_mode.sh mojo run -I . mamba/checks/mamba_backward_device_tail_dump.mojo; python tools/mamba_gradient_oracle.py --compare $oracle $actual --require-public-prefill"
mamba-grad-m2 = "work=/tmp/mojolearn-mamba2-grad; mkdir -p $work; find $work -maxdepth 1 -type f -delete; python tools/mamba_gradient_oracle.py --family mamba2 --out $work"
mamba-grad-m2-public = "oracle=/tmp/mojolearn-mamba2-grad; actual=/tmp/mojolearn-mamba2-actual; mkdir -p $oracle $actual; find $oracle -maxdepth 1 -type f -delete; find $actual -maxdepth 1 -type f -delete; python tools/mamba_gradient_oracle.py --family mamba2 --out $oracle; MOJOLEARN_MAMBA_GRAD_DUMP=$actual mojo run -I . mamba/checks/mamba2_backward_tail_dump.mojo; python tools/mamba_gradient_oracle.py --compare $oracle $actual --require-public-prefill"
mamba-grad-m2-l257 = "oracle=/tmp/mojolearn-mamba2-l257-grad; actual=/tmp/mojolearn-mamba2-l257-actual; mkdir -p $oracle $actual; find $oracle -maxdepth 1 -type f -delete; find $actual -maxdepth 1 -type f -delete; python tools/mamba_gradient_oracle.py --family mamba2 --case m2_base_b1_l257_d64 --out $oracle; MOJOLEARN_MAMBA2_GRAD_CASE=m2_base_b1_l257_d64 MOJOLEARN_MAMBA_GRAD_DUMP=$actual mojo run -I . mamba/checks/mamba2_backward_tail_dump.mojo; python tools/mamba_gradient_oracle.py --compare $oracle $actual --require-public-prefill"
mamba-grad-m3 = "work=/tmp/mojolearn-mamba3-grad; mkdir -p $work; find $work -maxdepth 1 -type f -delete; python tools/mamba_gradient_oracle.py --family mamba3 --out $work"
mamba-grad-m3-public = "oracle=/tmp/mojolearn-mamba3-grad; actual=/tmp/mojolearn-mamba3-actual; mkdir -p $oracle $actual; find $oracle -maxdepth 1 -type f -delete; find $actual -maxdepth 1 -type f -delete; python tools/mamba_gradient_oracle.py --family mamba3 --out $oracle; MOJOLEARN_MAMBA_GRAD_DUMP=$actual tools/with_identical_mode.sh mojo run -I . mamba/checks/mamba3_backward_tail_dump.mojo; python tools/mamba_gradient_oracle.py --compare $oracle $actual --require-public-prefill"

# Wheel building only. setuptools 77 is the floor for the PEP 639 `license`
# expression in python/pyproject.toml; `build` is the PEP 517 frontend.
# Separate from `bench` so a wheel build cannot perturb the environment every
# recorded timing was taken under.
[feature.pkg.dependencies]
python = "3.14.*"
setuptools = ">=77"
wheel = "*"
python-build = "*"
twine = "*"

# NVIDIA's gbm-bench harness (bench/external/), which needs pandas and
# LightGBM on top of what `bench` has. A SEPARATE feature, not additions to
# `bench`, for the same reason `skgpu` is: adding dependencies to `bench`
# would re-solve the environment every recorded timing was taken under.
# python is pinned to 3.14 because the prebuilt extension modules under
# python/mojolearn/ were built against it (verified importing under 3.14.7).
[feature.gbmbench.dependencies]
python = "3.14.*"
numpy = "*"
pandas = "*"
scikit-learn = "*"
catboost = ">=1.2"
lightgbm = "*"
tqdm = ">=4.70.0,<5"

[environments]
bench = ["bench"]
skgpu = ["skgpu"]
pkg = ["pkg"]
gbmbench = ["gbmbench"]
