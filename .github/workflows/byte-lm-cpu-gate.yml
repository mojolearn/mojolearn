# Byte LM CPU inference gate (DEVIATIONS 2610-2616, 2624) on GitHub's free standard
# runners: ARM64 Linux (Azure Cobalt 100), x86-64 Linux and Apple M1 macOS.
#
# What it proves on each runner, and nothing more: the CPU binding built ON
# THAT RUNNER reproduces the retained Metal/CUDA/HIP loss bytes for the byte LM
# checkpoint states in bench/results/resume/2026-09-07-root-byte-lm-three-vendor
# (tools/byte_lm_host_gate.py), and a build with the head fold reversed
# (DEVIATION 2612) fails the same comparison. No GPU is used or wanted.
#
# A green job is evidence for docs/BYTE_LM_CPU_INFERENCE.md's certified table
# only after its uploaded reports are read; the job summary is not the record.
#
# Hosted macOS has failed GPU binding builds with "Unknown GPU architecture
# detected" (wheel-ci.yml). This binding compiles no kernel, but it imports
# max.gpu.host through core/identity_trace.mojo, so that row is measured, not
# assumed; fail-fast is off so one runner cannot hide another.

name: Byte LM CPU gate

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "lane/cpu-inference"
      - "lane/cpu-inference-threads"
      - "lane/cpu-speed"
    paths:
      - "training/byte_lm_host.mojo"
      - "training/byte_lm_host_kernels.mojo"
      - "python/mojolearn/tests/test_byte_lm_host.py"
      - "bindings/_mojolearn_byte_lm_host.mojo"
      - "bindings/build_byte_lm_host.sh"
      - "python/mojolearn/_byte_lm_host.py"
      - "python/mojolearn/_backend.py"
      - "python/mojolearn/_buffer.py"
      - "tools/byte_lm_host_gate.py"
      - ".github/workflows/byte-lm-cpu-gate.yml"

permissions: {}

jobs:
  gate:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        # GitHub does not let a workflow choose Intel or AMD for x86-64; Azure
        # assigns the host. So x86-64 runs as several independent draws on two
        # images, each report records the CPU it got, and a vendor enters the
        # certified table only from a report that names it.
        include:
          - runner: ubuntu-24.04-arm
            slot: arm64
            label: ARM64 Linux (Azure Cobalt 100)
          - runner: macos-15
            slot: macos15
            label: Apple M1 macOS (hosted)
          - runner: ubuntu-24.04
            slot: x86-a
            label: x86-64 Linux draw a (24.04)
          - runner: ubuntu-24.04
            slot: x86-b
            label: x86-64 Linux draw b (24.04)
          - runner: ubuntu-24.04
            slot: x86-c
            label: x86-64 Linux draw c (24.04)
          - runner: ubuntu-22.04
            slot: x86-d
            label: x86-64 Linux draw d (22.04)
          - runner: ubuntu-22.04
            slot: x86-e
            label: x86-64 Linux draw e (22.04)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      MOJOLEARN_GATE_COMMIT: ${{ github.sha }}
      GATE_OUT: ${{ github.workspace }}/cpu-gate-out
    defaults:
      run:
        shell: bash
    steps:
      # bench/results is 2.6 GB; only the one capture the gate reads comes down.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/bench/results/*
            /bench/results/resume/
            !/bench/results/resume/*
            /bench/results/resume/2026-09-07-root-byte-lm-three-vendor/

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Runner facts
        run: |
          mkdir -p "$GATE_OUT"
          {
            uname -a
            python3 --version
            if [ "$(uname -s)" = Darwin ]; then
              sysctl -n machdep.cpu.brand_string
              sw_vers -productVersion
            else
              lscpu
              grep -m1 -E '^(flags|Features)' /proc/cpuinfo
            fi
          } 2>&1 | tee "$GATE_OUT/runner.txt"
          # The step shell is `bash -eo pipefail`, and ARM64 /proc/cpuinfo has no
          # `model name`, so every lookup here must tolerate no match.
          if [ "$(uname -s)" = Darwin ]; then
            cpu="$(sysctl -n machdep.cpu.brand_string || true)"
          else
            cpu="$( (grep -m1 -E '^model name' /proc/cpuinfo || true) | cut -d: -f2- | sed 's/^ //')"
            [ -n "$cpu" ] || cpu="$( (lscpu | grep -m1 'Model name' || true) | cut -d: -f2- | sed 's/^ *//')"
          fi
          echo "### ${{ matrix.slot }}: ${cpu:-unknown CPU} ($(uname -m))" >> "$GITHUB_STEP_SUMMARY"
          test -f bench/results/resume/2026-09-07-root-byte-lm-three-vendor/comparison.json

      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          run-install: true
          cache: false

      - name: Build the CPU binding (production)
        run: |
          set -o pipefail
          pixi run mojo --version | tee "$GATE_OUT/mojo_version.txt"
          sh bindings/build_byte_lm_host.sh 2>&1 | tee "$GATE_OUT/build_prod.log"

      - name: Gate, production build must reproduce every loss byte
        run: |
          set -o pipefail
          cp python/mojolearn/host/_mojolearn_byte_lm_host.so "$GATE_OUT/_mojolearn_byte_lm_host.prod.so"
          python3 tools/byte_lm_host_gate.py --steps every:8 \
            --report "$GATE_OUT/gate_prod.json" 2>&1 | tee "$GATE_OUT/gate_prod.log"

      - name: Build the sabotage binding (DEVIATION 2612)
        if: always()
        env:
          MOJOLEARN_BYTE_LM_HOST_OUTDIR: ${{ runner.temp }}/host-sab
          MOJOLEARN_BUILD_EXTRA_DEFINES: "-D MOJOLEARN_BYTE_LM_HOST_SABOTAGE=1"
        run: |
          set -o pipefail
          sh bindings/build_byte_lm_host.sh 2>&1 | tee "$GATE_OUT/build_sab.log"

      - name: Gate, sabotage build must be caught
        if: always()
        env:
          MOJOLEARN_BYTE_LM_HOST_ALLOW_SABOTAGE: "1"
          MOJOLEARN_BYTE_LM_HOST_BINARY: ${{ runner.temp }}/host-sab/_mojolearn_byte_lm_host.so
        run: |
          set -o pipefail
          python3 tools/byte_lm_host_gate.py --steps every:8 --expect-mismatch \
            --report "$GATE_OUT/gate_sab.json" 2>&1 | tee "$GATE_OUT/gate_sab.log"

      # Fake-binding plumbing tests (python/mojolearn/tests/test_byte_lm_host.py):
      # refusals, the threaded flag, the helper fallback and the CPU-only
      # selector. They prove wiring, never arithmetic, and need the production
      # binding built above so `import mojolearn` takes the CPU-only path.
      - name: Host plumbing tests
        if: always()
        run: |
          set -o pipefail
          python3 -m pip install --quiet numpy pytest
          cd python
          python3 -m pytest -q mojolearn/tests/test_byte_lm_host.py 2>&1 | tee "$GATE_OUT/pytest_host.log"

      # DEVIATION 2624's two Mojo checks, built with the binding's CPU target so
      # they test the codegen the gate ran: the host kernels against the
      # oracles by bits on shapes and planted values the captures never reach,
      # and the lane-wise exp and SiLU against the scalar seams on all 2^32
      # Float32 bit patterns (3 threads).
      - name: Kernel check, host kernels against the oracles by bits
        if: always()
        run: |
          set -o pipefail
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) cpu="--target-cpu x86-64-v3" ;;
            Darwin-arm64) cpu="--target-cpu apple-m1" ;;
            *) cpu="" ;;
          esac
          pixi run mojo build $cpu -D MOJOLEARN_NUMERIC_IDENTICAL=1 -I . \
            training/checks/byte_lm_host_kernels_check.mojo -o "$RUNNER_TEMP/kernels_check" \
            2>&1 | tee "$GATE_OUT/build_kernels_check.log"
          "$RUNNER_TEMP/kernels_check" 2>&1 | tee "$GATE_OUT/kernels_check.log"

      - name: Exhaustive check, lane-wise exp and SiLU on all 2^32 bit patterns
        if: always()
        run: |
          set -o pipefail
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) cpu="--target-cpu x86-64-v3" ;;
            Darwin-arm64) cpu="--target-cpu apple-m1" ;;
            *) cpu="" ;;
          esac
          pixi run mojo build $cpu -D MOJOLEARN_NUMERIC_IDENTICAL=1 -I . \
            training/checks/byte_lm_host_exp_check.mojo -o "$RUNNER_TEMP/exp_check" \
            2>&1 | tee "$GATE_OUT/build_exp_check.log"
          "$RUNNER_TEMP/exp_check" 2>&1 | tee "$GATE_OUT/exp_check.log"

      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: byte-lm-cpu-gate-${{ matrix.slot }}
          path: cpu-gate-out/
          if-no-files-found: warn
