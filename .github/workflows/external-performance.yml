name: External contribution checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions: {}

# Distinct event groups: metadata admission must not cancel the CPU run.
concurrency:
  group: external-${{ github.event_name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  admission:
    name: External metadata admission (GPU pending)
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      # ONLY the trusted base. No head checkout, head scripts, caches, artifact
      # execution, cloud credentials or writable token in this target event.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          submodules: false
      - name: Classify metadata and emit a disabled GPU request
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -I tools/external_contribution_gate.py plan
          --event "$GITHUB_EVENT_PATH" --output external-admission.json
          --request-output external-gpu-request.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: external-admission-${{ github.event.pull_request.head.sha }}
          path: |
            external-admission.json
            external-gpu-request.json
          if-no-files-found: error
          retention-days: 14

  hosted-cpu:
    name: External hosted CPU checks (no GPU certification)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
          submodules: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # This is the ONLY job that can execute candidate helpers. It has no
      # secrets, id-token permission, environment, cache or self-hosted runner.
      - name: Trusted-base checks against the candidate
        run: >-
          python3 -I trusted/tools/external_contribution_gate.py cpu
          --event "$GITHUB_EVENT_PATH" --trusted trusted --candidate candidate
          --output external-cpu.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: external-cpu-${{ github.event.pull_request.head.sha }}
          path: external-cpu.json
          if-no-files-found: error
          retention-days: 14
