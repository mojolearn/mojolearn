name: Release Linux build

# THE LINUX RELEASE SETS ON GITHUB'S FREE RUNNERS (2026-09-27; the merged
# layout and the host producer 2026-10-26). Dispatched by `pixi run release`
# (tools/release_github_build.py run), never by itself: only light-checks
# starts by itself (light-checks.yml refuses any other workflow with a push or
# schedule trigger).
#
# One run builds the named sets (cuda sm_89, the cuda sm_80 PTX slot, hip gfx942)
# of ONE source commit, with no GPU: Mojo compiles each set ahead of time from
# --target-accelerator alone, exactly as the RunPod CPU build box does
# (tools/release_linux_build.sh), in the same pinned image by digest, at the
# same path (/root/mojolearn), through the same route
# (tools/release_linux_cpu_box.sh), so the tree, the build proof and every
# binding-cache key are that route's. `host` in `sets` adds the retained-
# composition host producer (the source's tools/release_host_build.py).
#
#   plan      reads the SOURCE's own build lists (build_sets.sh) under the
#             release `modes`: per-binding, each set's builds split into
#             `shards` jobs by measured compile time; merged, ONE shard per
#             merged compile (a merged file is one `mojo build`; each
#             directory set holds several groups, bindings/merged_groups.json,
#             sized to fit a runner), each with the swap its planning peak
#             needs over the runner's 15 GiB
#   shard     one slice of one set per ubuntu-24.04 runner (4 vCPU, 16 GB),
#             `jobs` builds at a time; its compiled archives are its artifact
#   assemble  one per set: every shard's archives in the hot directory, then
#             the unchanged route for the whole set (each build a verified
#             cache hit); artifact release-<vendor>-<arch> is the build leg's
#             tree (<vendor>-<arch>/release-build/...) plus GHA/ (timings,
#             memory, swap, cache outcomes, uploads for the Mac to promote)
#   host      (sets has `host`) tools/release_host_build.py build in the same
#             image from a git checkout of the commit, its runtime donor this
#             run's first assembled set or the build the Mac passed as
#             host_donor_url; artifact host-build
#
# THE BINDING CACHE NEEDS NO SECRET. `map_url` is a presigned GET (hours) of a
# URL map the Mac minted with its own R2 credentials (tools/bincache.py
# plan_lines): presigned GETs of the cache partition and PUTs into disjoint
# inbox slots per job. It is never interpolated into a script: each job reads
# it from the event file, masks it and fetches the map into a 0600 file that
# no artifact carries; host_donor_url likewise. Empty map_url: no R2; each
# shard restores and saves its hot directory through actions/cache instead
# (archives named by their content key, placed only after they verify).
run-name: "release-linux-build ${{ inputs.sets }} @ ${{ inputs.commit }} [${{ inputs.tag }}]"

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "the frozen source commit (40 hex)"
        required: true
      sets:
        description: "space separated: sm_89 sm_80 gfx942 host (sm_80 is the PTX slot; sm_90a also accepted)"
        required: true
        default: "sm_89 sm_80 gfx942"
      shards:
        description: "per-binding layout: shard jobs per set (1..16); merged: one per compile"
        required: true
        default: "6"
      jobs:
        description: "builds at once per runner (MOJOLEARN_BUILD_JOBS, 1..4)"
        required: true
        default: "2"
      modes:
        description: "release modes (MOJOLEARN_RELEASE_MODES): identical, fast identical"
        required: true
        default: "identical"
      tag:
        description: "the dispatcher's tag, to find this run"
        required: false
        default: ""
      map_url:
        description: "presigned GET of the binding-cache URL map (empty: actions/cache only)"
        required: false
        default: ""
      host_donor_url:
        description: "presigned GET of a retained donor build for the host producer (empty: this run's first set)"
        required: false
        default: ""
      host_donor_sha256:
        description: "sha256 of that donor archive"
        required: false
        default: ""
      reuse_shards_run:
        description: "Retry assembly using this run's shard artifacts; refuse any compilation"
        required: false
        default: ""
      compile_groups:
        description: "Compile only: device, or exact merged shard entries; no assembly"
        required: false
        default: ""
      reuse_host_groups:
        description: "Host producer retains proven unchanged donor groups"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

env:
  IMAGE: rocm/dev-ubuntu-22.04@sha256:a3850e6638c6c390436ef1aacd72fd1359af36083ac823d5136818206998c484
  EXCLUDES: ":!bench/results :!mamba/corpus :!bench/oracle_* :!bench/minentropy_oracle.txt"

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      sets: ${{ steps.plan.outputs.sets }}
      has_devices: ${{ steps.plan.outputs.has_devices }}
      host: ${{ steps.plan.outputs.host }}
      host_donor: ${{ steps.plan.outputs.host_donor }}
      jobs_per_set: ${{ steps.plan.outputs.jobs_per_set }}
      assemble_swap_gib: ${{ steps.plan.outputs.assemble_swap_gib }}
      host_swap_gib: ${{ steps.plan.outputs.host_swap_gib }}
    steps:
      - name: Inputs
        env:
          IN_COMMIT: ${{ inputs.commit }}
          IN_SHARDS: ${{ inputs.shards }}
          IN_JOBS: ${{ inputs.jobs }}
          IN_MODES: ${{ inputs.modes }}
          IN_REUSE_RUN: ${{ inputs.reuse_shards_run }}
          IN_COMPILE_GROUPS: ${{ inputs.compile_groups }}
        run: |
          set -eu
          printf '%s' "$IN_COMMIT" | grep -Eq '^[0-9a-f]{40}$' || { echo "commit must be 40 hex"; exit 2; }
          printf '%s' "$IN_SHARDS" | grep -Eq '^([1-9]|1[0-6])$' || { echo "shards must be 1..16"; exit 2; }
          printf '%s' "$IN_JOBS" | grep -Eq '^[1-4]$' || { echo "jobs must be 1..4"; exit 2; }
          printf '%s' "$IN_MODES" | grep -Eq '^(identical|fast|fast identical|identical fast)$' || { echo "modes must be identical and/or fast"; exit 2; }
          [ -z "$IN_REUSE_RUN" ] || printf '%s' "$IN_REUSE_RUN" | grep -Eq '^[1-9][0-9]*$' || { echo "reuse_shards_run must be a run ID"; exit 2; }
          [ -z "$IN_REUSE_RUN" ] || [ -z "$IN_COMPILE_GROUPS" ] || { echo "choose retained assembly or selected compilation"; exit 2; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.commit }}
          path: src
          persist-credentials: false
      - name: Plan
        id: plan
        env:
          IN_SETS: ${{ inputs.sets }}
          IN_SHARDS: ${{ inputs.shards }}
          IN_MODES: ${{ inputs.modes }}
          IN_COMPILE_GROUPS: ${{ inputs.compile_groups }}
        run: |
          # pipefail: without it tee hides the planner's refusal, the plan job
          # passes with no matrix and the run fails with no job named (run 39840375353)
          set -euo pipefail
          donor=$(python3 -c 'import json, os; e = json.load(open(os.environ["GITHUB_EVENT_PATH"])); print("1" if (e.get("inputs") or {}).get("host_donor_url") else "")')
          python3 tooling/tools/release_github_build.py plan --src src --sets "$IN_SETS" --shards "$IN_SHARDS" \
            --modes "$IN_MODES" --compile-groups "$IN_COMPILE_GROUPS" ${donor:+--host-donor} --json plan.json --github-output "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plan
          path: plan.json
          retention-days: 7

  shard:
    needs: plan
    if: needs.plan.outputs.has_devices == 'true' && inputs.reuse_shards_run == ''
    runs-on: ubuntu-24.04
    # Compile-only migration jobs use the bounded one-hour lease. The full
    # release route retains its existing six-hour limit for merged compiles.
    timeout-minutes: ${{ inputs.compile_groups != '' && 60 || 360 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: "shard ${{ matrix.vendor }}-${{ matrix.arch }} ${{ matrix.shard }} ${{ matrix.unit }}"
    steps:
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift
          df -h / /mnt 2>/dev/null | tail -2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: tooling
          persist-credentials: false
      - name: Swap (the compile's recorded peak over the runner's RAM)
        env:
          SWAP_GIB: ${{ matrix.swap_gib }}
        run: bash tooling/tools/gha_release_box.sh swap "$SWAP_GIB" "$RUNNER_TEMP/w/swap.txt"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.commit }}
          path: src
          persist-credentials: false
      - name: Source tree (the CPU box's file list)
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/w/mojolearn" "$RUNNER_TEMP/w/out" "$RUNNER_TEMP/w/bincache/hot"
          # shellcheck disable=SC2086
          git -C src ls-files -z -- . $EXCLUDES | tar -C src --null -T - -cf - | tar -C "$RUNNER_TEMP/w/mojolearn" -xf -
          echo "files: $(find "$RUNNER_TEMP/w/mojolearn" -type f | wc -l)"
      - name: Binding-cache map (never printed)
        id: map
        env:
          SET_INDEX: ${{ matrix.set_index }}
          SHARD: ${{ matrix.shard }}
          JPS: ${{ needs.plan.outputs.jobs_per_set }}
        run: |
          python3 tooling/tools/release_github_build.py job-map --event "$GITHUB_EVENT_PATH" \
            --dest "$RUNNER_TEMP/w/bincache/urls.tsv" --set-index "$SET_INDEX" --job "$SHARD" \
            --jobs-per-set "$JPS" --leg "${{ github.run_id }}" --github-output "$GITHUB_OUTPUT"
      - name: Hot archives from actions/cache (no R2 only)
        if: steps.map.outputs.r2 == 'false'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/w/bincache/hot
          key: rlb1-${{ matrix.arch }}-${{ matrix.unit }}-${{ inputs.commit }}
          restore-keys: |
            rlb1-${{ matrix.arch }}-${{ matrix.unit }}-
      - name: Image
        run: for i in 1 2 3; do docker pull "$IMAGE" && break; sleep 20; done
      - name: Build this shard
        id: build
        # Leave time for collection/upload after a compile-only timeout.
        timeout-minutes: ${{ inputs.compile_groups != '' && 50 || 360 }}
        env:
          COMMIT: ${{ inputs.commit }}
          ARCH: ${{ matrix.arch }}
          ONLY: ${{ matrix.only }}
          JOBS: ${{ inputs.jobs }}
          MODES: ${{ inputs.modes }}
          PRUNE: ${{ steps.map.outputs.r2 == 'false' && '1' || '0' }}
        run: |
          set -u
          docker run --rm -e MOJOLEARN_COMMIT="$COMMIT" -e GHA_BUILD_JOBS="$JOBS" -e GHA_SHARD_ONLY="$ONLY" \
            -e GHA_RELEASE_MODES="$MODES" -e GHA_PRUNE_HOT="$PRUNE" \
            -e GHA_RUNNER="$RUNNER_NAME" -e GHA_RUN="$GITHUB_RUN_ID" -e GHA_JOB="$GITHUB_JOB" \
            -v "$RUNNER_TEMP/w/mojolearn:/root/mojolearn" -v "$GITHUB_WORKSPACE/tooling:/tooling:ro" \
            -v "$RUNNER_TEMP/w/bincache:/root/.mojolearn_bincache" -v "$RUNNER_TEMP/w/out:/root/leg_out" \
            "$IMAGE" bash /tooling/tools/gha_release_box.sh shard "$ARCH"
      - name: Make completed archives readable by the cache action
        if: steps.build.outcome == 'success'
        run: sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/w/bincache"
      - name: Hot archives to actions/cache (no R2 only)
        if: steps.build.outcome == 'success' && steps.map.outputs.r2 == 'false'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/w/bincache/hot
          key: rlb1-${{ matrix.arch }}-${{ matrix.unit }}-${{ inputs.commit }}
      - name: Collect
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
          ARCH: ${{ matrix.arch }}
          VENDOR: ${{ matrix.vendor }}
        run: |
          set -u
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/w/out" "$RUNNER_TEMP/w/bincache"
          D="$RUNNER_TEMP/w/art/shard/$SHARD"
          mkdir -p "$D/report" "$D/hot"
          cp "$RUNNER_TEMP"/w/bincache/hot/*.tar.gz "$D/hot/" 2>/dev/null || true
          cp -r "$RUNNER_TEMP/w/out/GHA/." "$D/report/" 2>/dev/null || true
          cp "$RUNNER_TEMP/w/swap.txt" "$D/report/swap.txt" 2>/dev/null || true
          B="$RUNNER_TEMP/w/out/release/$VENDOR-$ARCH/release-build/build"
          cp -r "$B/bincache" "$D/report/bincache" 2>/dev/null || true
          cp -r "$B/build_logs" "$D/report/build_logs" 2>/dev/null || true
          cp "$B/compile-inputs.json" "$D/report/compile-inputs.json" 2>/dev/null || true
          { echo "### shard $VENDOR-$ARCH $SHARD"; echo '```'; cat "$D/report/shard.tsv" "$D/report/memory.txt" "$D/report/swap.txt" "$D/report/guard.jsonl" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: shard-${{ matrix.arch }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/w/art
          # the runtime closure is sets/<vendor>/<arch>/.libs/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  assemble:
    needs: [plan, shard]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.has_devices == 'true' && inputs.compile_groups == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.plan.outputs.sets) }}
    name: "assemble ${{ matrix.arch }}"
    steps:
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift
          df -h / /mnt 2>/dev/null | tail -2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: tooling
          persist-credentials: false
      - name: Swap (a build no shard delivered compiles here)
        env:
          SWAP_GIB: ${{ needs.plan.outputs.assemble_swap_gib }}
        run: bash tooling/tools/gha_release_box.sh swap "$SWAP_GIB" "$RUNNER_TEMP/w/swap.txt"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.commit }}
          path: src
          persist-credentials: false
      - name: Source tree (the CPU box's file list)
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/w/mojolearn" "$RUNNER_TEMP/w/out" "$RUNNER_TEMP/w/bincache/hot"
          # shellcheck disable=SC2086
          git -C src ls-files -z -- . $EXCLUDES | tar -C src --null -T - -cf - | tar -C "$RUNNER_TEMP/w/mojolearn" -xf -
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: shard-${{ matrix.arch }}-*
          run-id: ${{ inputs.reuse_shards_run || github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/shards
          merge-multiple: true
      - name: The shards' archives into the hot directory
        run: |
          set -u
          cp "$RUNNER_TEMP"/shards/shard/*/hot/*.tar.gz "$RUNNER_TEMP/w/bincache/hot/" 2>/dev/null || true
          echo "archives: $(ls "$RUNNER_TEMP/w/bincache/hot" | wc -l)"
      - name: Binding-cache map (never printed)
        env:
          IN_SETS: ${{ inputs.sets }}
          ARCH: ${{ matrix.arch }}
          JPS: ${{ needs.plan.outputs.jobs_per_set }}
        run: |
          set -eu
          idx=$(python3 -c 'import sys; print([s for s in sys.argv[1].split() if s != "host"].index(sys.argv[2]))' "$IN_SETS" "$ARCH")
          python3 tooling/tools/release_github_build.py job-map --event "$GITHUB_EVENT_PATH" \
            --dest "$RUNNER_TEMP/w/bincache/urls.tsv" --set-index "$idx" --job "$((JPS - 1))" \
            --jobs-per-set "$JPS" --leg "${{ github.run_id }}"
      - name: Image
        run: for i in 1 2 3; do docker pull "$IMAGE" && break; sleep 20; done
      - name: Assemble the set
        env:
          COMMIT: ${{ inputs.commit }}
          ARCH: ${{ matrix.arch }}
          JOBS: ${{ inputs.jobs }}
          MODES: ${{ inputs.modes }}
          REUSE_RUN: ${{ inputs.reuse_shards_run }}
        run: |
          set -u
          docker run --rm -e MOJOLEARN_COMMIT="$COMMIT" -e GHA_BUILD_JOBS="$JOBS" -e GHA_RELEASE_MODES="$MODES" \
            -e GHA_REUSE_SHARDS_RUN="$REUSE_RUN" \
            -e GHA_RUNNER="$RUNNER_NAME" -e GHA_RUN="$GITHUB_RUN_ID" -e GHA_JOB="$GITHUB_JOB" \
            -v "$RUNNER_TEMP/w/mojolearn:/root/mojolearn" -v "$GITHUB_WORKSPACE/tooling:/tooling:ro" \
            -v "$RUNNER_TEMP/w/bincache:/root/.mojolearn_bincache" -v "$RUNNER_TEMP/w/out:/root/leg_out" \
            "$IMAGE" bash /tooling/tools/gha_release_box.sh assemble "$ARCH"
      - name: The build leg's tree
        if: always()
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -u
          case "$ARCH" in sm_*) VENDOR=cuda ;; *) VENDOR=hip ;; esac
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/w/out" "$RUNNER_TEMP/w/bincache"
          L="$RUNNER_TEMP/w/art/leg"
          mkdir -p "$L/GHA/assemble" "$L/GHA/shards" "$L/GHA/bincache/keys"
          [ -d "$RUNNER_TEMP/w/out/release/$VENDOR-$ARCH" ] && mv "$RUNNER_TEMP/w/out/release/$VENDOR-$ARCH" "$L/$VENDOR-$ARCH"
          cp -r "$RUNNER_TEMP/w/out/GHA/." "$L/GHA/assemble/" 2>/dev/null || true
          cp "$RUNNER_TEMP/w/swap.txt" "$L/GHA/assemble/swap.txt" 2>/dev/null || true
          for f in route.txt sets.tsv overlay.txt; do cp "$RUNNER_TEMP/w/out/release/$f" "$L/GHA/assemble/" 2>/dev/null || true; done
          for d in "$RUNNER_TEMP"/shards/shard/*/; do
            [ -d "$d" ] || continue
            i=$(basename "$d"); cp -r "$d/report" "$L/GHA/shards/$i"
            cat "$d/report/bincache/uploads.tsv" >> "$L/GHA/bincache/uploads.tsv" 2>/dev/null || true
            cp "$d"/report/bincache/keys/*.json "$L/GHA/bincache/keys/" 2>/dev/null || true
            cat "$d/report/hot_sha256.tsv" >> "$L/GHA/bincache/hot_sha256.tsv" 2>/dev/null || true
          done
          B="$L/$VENDOR-$ARCH/release-build/build/bincache"
          cat "$B/uploads.tsv" >> "$L/GHA/bincache/uploads.tsv" 2>/dev/null || true
          cp "$B"/keys/*.json "$L/GHA/bincache/keys/" 2>/dev/null || true
          cat "$RUNNER_TEMP/w/out/GHA/hot_sha256.tsv" >> "$L/GHA/bincache/hot_sha256.tsv" 2>/dev/null || true
          { echo "### assemble $VENDOR-$ARCH"; echo '```'; cat "$L/GHA/assemble/outcomes.txt" "$L/GHA/assemble/memory.txt" "$L/GHA/assemble/guard.jsonl" 2>/dev/null
            grep -h . "$L/$VENDOR-$ARCH/release-build/results.tsv" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: release-${{ matrix.arch == 'gfx942' && 'hip' || 'cuda' }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/w/art
          # the runtime closure is sets/<vendor>/<arch>/.libs/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  host:
    needs: [plan, assemble]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.host == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    name: "host producer"
    steps:
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift
          df -h / /mnt 2>/dev/null | tail -2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: tooling
          persist-credentials: false
      # the host groups compile one after another; the largest group's peak plans the swap
      # (the single whole-set host compile was killed at 16 GB without swap, run 40272710760)
      - name: Swap (the host compile's recorded peak over the runner's RAM)
        env:
          SWAP_GIB: ${{ needs.plan.outputs.host_swap_gib }}
        run: bash tooling/tools/gha_release_box.sh swap "$SWAP_GIB" "$RUNNER_TEMP/w/swap.txt"
      # the producer reads committed source through git (HEAD, a clean tracked
      # tree and `git archive` of the donor's revision), so this job builds in a
      # git checkout, not the file-list copy the set jobs use
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.commit }}
          path: src
          persist-credentials: false
      - name: Donor from the dispatch (never printed)
        id: donor_url
        if: needs.plan.outputs.host_donor == 'true'
        run: |
          python3 tooling/tools/release_github_build.py donor --event "$GITHUB_EVENT_PATH" \
            --dest "$RUNNER_TEMP/w/donor" --github-output "$GITHUB_OUTPUT"
      - name: Donor set from this run
        if: needs.plan.outputs.host_donor != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ fromJSON(needs.plan.outputs.sets)[0] == 'gfx942' && 'hip' || 'cuda' }}-${{ fromJSON(needs.plan.outputs.sets)[0] }}
          path: ${{ runner.temp }}/donor-art
      - name: The donor build and its revision
        env:
          FIRST: ${{ needs.plan.outputs.host_donor != 'true' && fromJSON(needs.plan.outputs.sets)[0] || '' }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -eu
          if [ -n "$FIRST" ]; then
            case "$FIRST" in sm_*) V=cuda ;; *) V=hip ;; esac
            mkdir -p "$RUNNER_TEMP/w/donor"
            mv "$RUNNER_TEMP/donor-art/leg/$V-$FIRST/release-build/build" "$RUNNER_TEMP/w/donor/build"
            cp -r "$RUNNER_TEMP/donor-art/leg/GHA" "$RUNNER_TEMP/w/donor/GHA"
          fi
          rev=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["source_commit"])' "$RUNNER_TEMP/w/donor/build/build-provenance.json")
          echo "donor revision $rev"
          # the producer reconstructs the donor's committed source with `git archive`
          [ "$rev" = "$COMMIT" ] || git -C src fetch --depth 1 origin "$rev"
          git -C src cat-file -e "$rev^{commit}"
      - name: Image
        run: for i in 1 2 3; do docker pull "$IMAGE" && break; sleep 20; done
      - name: Build the host
        env:
          COMMIT: ${{ inputs.commit }}
          REUSE_HOST_GROUPS: ${{ inputs.reuse_host_groups }}
        run: |
          set -u
          mkdir -p "$RUNNER_TEMP/w/out"
          docker run --rm -e MOJOLEARN_COMMIT="$COMMIT" \
            -e GHA_REUSE_HOST_GROUPS="$REUSE_HOST_GROUPS" \
            -e GHA_RUNNER="$RUNNER_NAME" -e GHA_RUN="$GITHUB_RUN_ID" -e GHA_JOB="$GITHUB_JOB" \
            -v "$GITHUB_WORKSPACE/src:/root/mojolearn" -v "$GITHUB_WORKSPACE/tooling:/tooling:ro" \
            -v "$RUNNER_TEMP/w/donor:/root/donor:ro" -v "$RUNNER_TEMP/w/out:/root/leg_out" \
            "$IMAGE" bash /tooling/tools/gha_release_box.sh host host
      - name: Collect
        if: always()
        run: |
          set -u
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/w/out"
          mkdir -p "$RUNNER_TEMP/w/out/host-build/GHA"
          cp -r "$RUNNER_TEMP/w/out/GHA/." "$RUNNER_TEMP/w/out/host-build/GHA/" 2>/dev/null || true
          cp "$RUNNER_TEMP/w/swap.txt" "$RUNNER_TEMP/w/out/host-build/GHA/swap.txt" 2>/dev/null || true
          { echo "### host producer"; echo '```'; cat "$RUNNER_TEMP/w/out/GHA/host.txt" "$RUNNER_TEMP/w/out/GHA/memory.txt" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: host-build
          path: ${{ runner.temp }}/w/out/host-build
          # the staged runtime closure is set/.libs/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
