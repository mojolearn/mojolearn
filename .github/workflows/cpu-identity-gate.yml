      - "gemm/checks/gemm_backward.mojo"
      - "python/mojolearn/_training_impl.py"
      - "arima/impl/tsa/arima_common.mojo"
      - "kernel_methods/host/km_host_oracle.mojo"
      - "kernel_methods/checks/random_features.mojo"
      - "mixture/host/gmm_host_oracle.mojo"
      - "hdbscan/host/hdbscan_host_oracle.mojo"
      - "hdbscan/impl/detail/condense.mojo"
      - "hdbscan/impl/detail/extract.mojo"
      - "hdbscan/impl/detail/utils.mojo"
      - "hdbscan/impl/detail/stabilities.mojo"
      - "hdbscan/impl/condensed_hierarchy.mojo"
      - "hdbscan/checks/hdbscan_sabotage.mojo"
      - "hdbscan/checks/mutual_reachability_dense.mojo"
      - "spectral/checks/symmetric_eig_host.mojo"
      - "core/knn_host_predict.mojo"
      - "cluster/host/kmeans_oracle.mojo"
      - "bench/results/classical_host/**"
      - "tools/cpu_identity_gate_check.py"
      - "bench/results/identity_break/2026-09-13_three-columns/**"
      - "bench/results/identity_break/2026-09-14_46-lanes/**"
      - "bench/results/identity_break/2026-09-14_47-lanes/**"
      - "bench/results/identity_break/2026-09-14_136-lanes/**"
      - "bench/results/identity_break/2026-09-14_166-lanes/**"
      - "bench/results/identity_break/2026-09-14_kmeans-sqrt-fix/**"
      - "bench/results/forest_host/**"
      - ".github/workflows/cpu-identity-gate.yml"

permissions: {}

# SUPERSEDED RUNS ON ONE BRANCH ARE CANCELLED; MAIN'S NEVER ARE (2026-09-15,
# lane/cpu-training-gate-speed, approved by Andrew for superseded same-branch
# runs only). A branch push cancels that branch's older in-progress run; every
# main run sits in a group of its own, so none waits for or cancels another.
concurrency:
  group: cpu-identity-gate-${{ github.ref == 'refs/heads/main' && format('main-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # THE LISTS THIS GATE RUNS ON ARE NOT WRITTEN HERE. Since the host surface
  # manifest lane (2026-09-14) they come from python/mojolearn/host_surface.py,
  # the one declaration of the CPU surface, in the "CPU surface manifest"
  # step below, which writes to GITHUB_ENV:
  #   COVERED_LANES       the identity_break lanes with a CPU TRAINING path,
  #                       comma separated. A lane listed must read STABLE on
  #                       every fixture and IDENTICAL x4 against the three
  #                       GPU columns; a lane not listed must read REFUSED by
  #                       name. The INFERENCE-ONLY lanes (logistic,
  #                       logistic-multiclass) are deliberately not there:
  #                       their train cell refuses by name on the CPU column,
  #                       so `--require-columns 4` cannot hold on it. Their
  #                       gate is tools/classical_host_gate.py over
  #                       CLASSICAL_RECORDED, the same shape as the forest
  #                       host gate. Since workstream E (2026-09-14) the knn,
  #                       pca, pca-whiten, tsvd, ols and ridge lanes train on
  #                       the host too and sit in both lists, and dbscan
  #                       trains on the host; batch 2 adds logistic (the
  #                       binary L-BFGS arm) to the training list, and batch
  #                       3 (lane/cpu-training-batch3) adds
  #                       logistic-multiclass (the softmax loss), so no
  #                       classical lane is inference-only any more.
  #   HOST_FAMILIES       the routed (phase 1) families, space separated; each
  #                       is built by bindings/build_<family>_host.sh (a shim
  #                       over bindings/build_host_family.sh) into
  #                       MOJOLEARN_<FAMILY>_HOST_OUTDIR, read back as the CPU
  #                       column, and named in host.families.
  #   HOST_BINDINGS       the routed families' basenames, space separated.
  #   ALL_HOST_BINDINGS   every host binding basename, comma separated (the
  #                       byte LM, forest and tokenizer bindings included), the
  #                       read-back and column checks' --binding list.
  #   CLASSICAL_RECORDED  the classical host gate recordings, space separated.
  #   CLASSICAL_GPU_COLUMNS
  #                       the three 46-lane GPU columns the classical gate
  #                       compares each host identity hash against.
  #   GPU_COLUMNS         the three committed GPU columns the CPU TRAINING
  #                       column is diffed against (--require-columns 4). The
  #                       record must not lag the surface: run 34832840859 at
  #                       7bf4f4cc9 failed "27 short" because the 2026-09-13
  #                       record predates the kde and svc model cells and the
  #                       holtwinters infer cells; the manifest names the
  #                       2026-09-14 47-lane record taken at that commit.
  MOJOLEARN_HOST_SURFACE: python/mojolearn/host_surface.py

jobs:
  # WHAT THIS RUN CHECKS (2026-09-15, lane/cpu-training-gate-speed;
  # tools/cpu_identity_gate_check.py plan). FULL scope, on main, on
  # workflow_dispatch and on any branch change the plan cannot attribute to a
  # host family (python/, tools/, a recorded column, the builder, pixi, a
  # workflow change beyond trigger paths and comments): every covered lane,
  # all nine fixtures, two repeats, the batch part, seven runners. FAMILIES
  # scope, on a branch push whose changes against its merge base with main
  # fall inside host families (a .mojo file in a family binding's import
  # closure, its build shim, its manifest entry): those families' covered
  # lanes plus the smoke lanes, on fixtures base, denormal and odd, one
  # repeat, no batch part, three runners (x86-64 24.04, ARM64, macOS). A
  # branch gate is a fast screen, not the merge evidence: the full gate runs
  # on main and on a workflow_dispatch of the branch. A main push whose git
  # tree a successful FULL run already gated (a fast-forward to a dispatched
  # branch commit) is skipped and says which run gated it.
  plan:
    name: Plan (scope and skip)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.plan.outputs.SKIP }}
      scope: ${{ steps.plan.outputs.SCOPE }}
      lanes: ${{ steps.plan.outputs.LANES }}
      families: ${{ steps.plan.outputs.FAMILIES }}
      matrix: ${{ steps.plan.outputs.MATRIX }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/bench/results/*
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.ref }}" != refs/heads/main ]; then
            git fetch --no-tags --filter=blob:none origin main
          fi
          python3 tools/cpu_identity_gate_check.py plan --event "${{ github.event_name }}" --ref "${{ github.ref }}" \
            --base origin/main --repo "${{ github.repository }}" | tee plan.txt
          cat plan.txt >> "$GITHUB_OUTPUT"
          scope=$(sed -n 's/^SCOPE=//p' plan.txt)
          full='[{"runner":"ubuntu-24.04-arm","slot":"arm64","label":"ARM64 Linux (Azure Cobalt 100)"},{"runner":"macos-15","slot":"macos15","label":"Apple M1 macOS (hosted)"},{"runner":"ubuntu-24.04","slot":"x86-a","label":"x86-64 Linux draw a (24.04)"},{"runner":"ubuntu-24.04","slot":"x86-b","label":"x86-64 Linux draw b (24.04)"},{"runner":"ubuntu-24.04","slot":"x86-c","label":"x86-64 Linux draw c (24.04)"},{"runner":"ubuntu-22.04","slot":"x86-d","label":"x86-64 Linux draw d (22.04)"},{"runner":"ubuntu-22.04","slot":"x86-e","label":"x86-64 Linux draw e (22.04)"}]'
          branch='[{"runner":"ubuntu-24.04","slot":"x86-a","label":"x86-64 Linux draw a (24.04)"},{"runner":"ubuntu-24.04-arm","slot":"arm64","label":"ARM64 Linux (Azure Cobalt 100)"},{"runner":"macos-15","slot":"macos15","label":"Apple M1 macOS (hosted)"}]'
          if [ "$scope" = families ]; then echo "MATRIX=$branch" >> "$GITHUB_OUTPUT"; else echo "MATRIX=$full" >> "$GITHUB_OUTPUT"; fi
          {
            echo "### plan: scope $scope"
            sed -n 's/^REASON=/reason: /p; s/^LANES=/lanes: /p; s/^SKIP=/skip: /p' plan.txt
          } >> "$GITHUB_STEP_SUMMARY"

  gate:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    # The scope is in the job name: a main push is skipped only on a tree whose
    # seven "(full)" jobs succeeded.
    name: ${{ matrix.label }} (${{ needs.plan.outputs.scope }})
    strategy:
      fail-fast: false
      matrix:
        # GitHub does not let a workflow choose Intel or AMD for x86-64; Azure
        # assigns the host. So x86-64 runs as several independent draws on two
        # images, each report records the CPU it got, and a vendor enters the
        # certified table only from a report that names it. The list is the
        # plan job's (seven at full scope, three at families scope).
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      MOJOLEARN_COMMIT: ${{ github.sha }}
      MOJOLEARN_GATE_COMMIT: ${{ github.sha }}
      MOJOLEARN_NUMERIC_MODE: identical
      PYTHONPATH: ${{ github.workspace }}/python
      GATE_OUT: ${{ github.workspace }}/cpu-identity-gate-out
      GATE_SCOPE: ${{ needs.plan.outputs.scope }}
      PLAN_LANES: ${{ needs.plan.outputs.lanes }}
    defaults:
      run:
        shell: bash
    steps:
      # bench/results is large; only the forest host fixtures and the three
      # committed GPU columns come down.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/bench/results/*
            /bench/results/forest_host/
            /bench/results/classical_host/
            /bench/results/identity_break/
            !/bench/results/identity_break/*
            /bench/results/identity_break/2026-09-13_three-columns/
            /bench/results/identity_break/2026-09-14_46-lanes/
            /bench/results/identity_break/2026-09-14_47-lanes/
            /bench/results/identity_break/2026-09-14_136-lanes/
            /bench/results/identity_break/2026-09-14_166-lanes/
            /bench/results/identity_break/2026-09-14_kmeans-sqrt-fix/

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Runner facts
        run: |
          mkdir -p "$GATE_OUT"
          {
            uname -a
            python3 --version
            if [ "$(uname -s)" = Darwin ]; then
              sysctl -n machdep.cpu.brand_string
              sw_vers -productVersion
            else
              lscpu
              grep -m1 -E '^(flags|Features)' /proc/cpuinfo
            fi
          } 2>&1 | tee "$GATE_OUT/runner.txt"
          # The step shell is `bash -eo pipefail`, and ARM64 /proc/cpuinfo has no
          # `model name`, so every lookup here must tolerate no match.
          if [ "$(uname -s)" = Darwin ]; then
            cpu="$(sysctl -n machdep.cpu.brand_string || true)"
          else
            cpu="$( (grep -m1 -E '^model name' /proc/cpuinfo || true) | cut -d: -f2- | sed 's/^ //')"
            [ -n "$cpu" ] || cpu="$( (lscpu | grep -m1 'Model name' || true) | cut -d: -f2- | sed 's/^ *//')"
          fi
          echo "### ${{ matrix.slot }}: ${cpu:-unknown CPU} ($(uname -m))" >> "$GITHUB_STEP_SUMMARY"
          # The --target-cpu the two host build scripts pass on this runner,
          # recorded into the CPU column's host.target_cpu.
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) target=x86-64-v3 ;;
            Darwin-arm64) target=apple-m1 ;;
            *) target=none ;;
          esac
          echo "MOJOLEARN_TARGET_CPU=$target" >> "$GITHUB_ENV"
          # The covered-lanes steps split their lanes into one identity_break
          # process per CPU the runner reports (tools/cpu_identity_gate_check.py
          # run-column); the one-core rule is the developer Mac's, not CI's.
          shards="$(getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)"
          echo "GATE_SHARDS=$shards" >> "$GITHUB_ENV"
          echo "identity_break shards on this runner: $shards"
          # The runner image, part of the host binding cache key.
          echo "IMAGE_VERSION=${ImageVersion:-unknown}" >> "$GITHUB_ENV"
          python3 -m pip install --quiet numpy
          ls bench/results/forest_host/ bench/results/identity_break/2026-09-13_three-columns/

      # ONE STEP reads every list from the manifest. It runs the file by path
      # because the package cannot import yet (no binding is built on this
      # runner); `python3 -m mojolearn.host_surface` says the same thing
      # where it can. A manifest that names a recording directory that is
      # not checked out fails here, before a build is spent.
      - name: CPU surface manifest
        run: |
          set -o pipefail
          manifest=$MOJOLEARN_HOST_SURFACE
          {
            echo "COVERED_LANES=$(python3 $manifest --covered-lanes)"
            echo "HOST_FAMILIES=$(python3 $manifest --routed-families)"
            echo "HOST_BINDINGS=$(python3 $manifest --routed-bindings)"
            echo "ALL_HOST_BINDINGS=$(python3 $manifest --bindings --sep ,)"
            echo "CLASSICAL_RECORDED=$(python3 $manifest --classical-recorded)"
            echo "CLASSICAL_GPU_COLUMNS=$(python3 $manifest --classical-gpu-columns)"
            echo "GPU_COLUMNS=$(python3 $manifest --training-gpu-columns)"
            echo "RECORD_COVERED_LANES=$(python3 $manifest --record-covered-lanes)"
            echo "FIX_COVERED_LANES=$(python3 $manifest --fix-covered-lanes)"
            echo "FIX_COLUMNS=$(python3 $manifest --training-fix-columns)"
          } | tee -a "$GITHUB_ENV" | tee "$GATE_OUT/manifest.txt"
          python3 $manifest --json > "$GATE_OUT/host_surface.json"
          # What this run's covered-lanes steps run (the plan job's scope). FULL:
          # every covered lane, nine fixtures, two repeats, the batch part.
          # FAMILIES: the plan's lanes, three fixtures, one repeat, no batch.
          python3 - "$manifest" <<'PY' | tee -a "$GITHUB_ENV" | tee "$GATE_OUT/run_scope.txt"
          import importlib.util, os, sys
          spec = importlib.util.spec_from_file_location("hs", sys.argv[1]); hs = importlib.util.module_from_spec(spec); spec.loader.exec_module(hs)
          covered = hs.covered_lanes()
          if os.environ["GATE_SCOPE"] == "families":
              want = set(x for x in os.environ["PLAN_LANES"].split(",") if x)
              unknown = sorted(want - set(covered))
              if unknown:
                  sys.exit(f"the plan names lanes the manifest does not cover: {unknown}")
              lanes = [n for n in covered if n in want]
              print("RUN_ARGS=--fixtures base,denormal,odd --repeats 1 --no-batch")
              print("DIFF_ARGS=--fixtures base,denormal,odd --no-batch")
          elif os.environ["GATE_SCOPE"] == "full":
              lanes = covered
              print("RUN_ARGS=")
              print("DIFF_ARGS=")
          else:
              sys.exit(f"unknown GATE_SCOPE {os.environ['GATE_SCOPE']!r}")
          print("RUN_LANES=" + ",".join(lanes))
          print("RUN_RECORD_LANES=" + ",".join(n for n in hs.record_covered_lanes() if n in lanes))
          print("RUN_FIX_LANES=" + ",".join(n for n in hs.fix_covered_lanes() if n in lanes))
          PY
          # The host binding cache key: every tracked .mojo file, the build
          # scripts and the pixi lock, by their git blob ids (the tree the
          # bindings compile from, whatever the sparse checkout holds).
          echo "HOST_SRC_HASH=$(git ls-files -s -- '*.mojo' 'bindings/*.sh' pixi.lock pixi.toml | python3 -c 'import hashlib,sys; print(hashlib.sha256(sys.stdin.buffer.read()).hexdigest()[:32])')" | tee -a "$GITHUB_ENV"
          for d in $(python3 $manifest --classical-recorded) $(python3 $manifest --classical-gpu-columns) $(python3 $manifest --training-gpu-columns) $(python3 $manifest --training-fix-columns); do
            [ -e "$d" ] || { echo "manifest names $d, which is not in this checkout: the record lags the surface" >&2; exit 1; }
          done

      # The pixi environments (the Mojo toolchain among them), cached on
      # pixi.lock; only main writes the cache, branches read main's.
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          run-install: true
          cache: true
          cache-write: ${{ github.ref == 'refs/heads/main' }}

      # BUILT HOST BINDINGS, CACHED (2026-09-15). The key is the source tree
      # (HOST_SRC_HASH), the runner image and arch; the numeric mode is fixed
      # (identical) and the column is the CPU column, both asserted by every
      # binding and read back below. The prod set and the sabotage set have
      # different keys and directories, so a sabotage build can never be
      # restored as the prod set.
      - name: Restore the prod host set
        id: hostcache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: python/mojolearn/host
          key: cpu-host-prod-identical-${{ matrix.runner }}-${{ runner.arch }}-${{ env.IMAGE_VERSION }}-${{ env.HOST_SRC_HASH }}

      - name: Restore the sabotage host set
        id: sabcache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/host-sab
          key: cpu-host-sab-identical-${{ matrix.runner }}-${{ runner.arch }}-${{ env.IMAGE_VERSION }}-${{ env.HOST_SRC_HASH }}

      # Every host binding the manifest declares, the prod set into
      # python/mojolearn/host and the sabotage set (-D MOJOLEARN_HOST_SABOTAGE=1)
      # into host-sab, one family per process, GATE_SHARDS at a time. A set
      # restored from the cache is not rebuilt.
      - name: Build the host bindings (CPU column), prod and sabotage sets
        env:
          PROD_HIT: ${{ steps.hostcache.outputs.cache-hit }}
          SAB_HIT: ${{ steps.sabcache.outputs.cache-hit }}
        run: |
          set -o pipefail
          pixi run mojo --version | tee "$GATE_OUT/mojo_version.txt"
          echo "MOJOLEARN_MOJO_VERSION=$(pixi run mojo --version | head -1)" >> "$GITHUB_ENV"
          list="$RUNNER_TEMP/build_list.txt"; : > "$list"
          if [ "$PROD_HIT" = true ]; then echo "prod host set restored from the cache"; else
            for f in byte_lm forest tokenizer $HOST_FAMILIES; do echo "prod $f" >> "$list"; done; fi
          if [ "$SAB_HIT" = true ]; then echo "sabotage host set restored from the cache"; else
            [ -z "$COVERED_LANES" ] || for f in byte_lm forest $HOST_FAMILIES; do echo "sab $f" >> "$list"; done; fi
          [ -s "$list" ] || exit 0
          cat > "$RUNNER_TEMP/build_one.sh" <<'SH'
          set -u
          set_name=$1; fam=$2
          if [ "$set_name" = sab ]; then
            export MOJOLEARN_HOST_OUTDIR="$RUNNER_TEMP/host-sab" MOJOLEARN_BYTE_LM_HOST_OUTDIR="$RUNNER_TEMP/host-sab" \
              MOJOLEARN_FOREST_HOST_OUTDIR="$RUNNER_TEMP/host-sab" MOJOLEARN_BUILD_EXTRA_DEFINES="-D MOJOLEARN_HOST_SABOTAGE=1"
            log="$GATE_OUT/build_${fam}_host_sab.log"
          else
            log="$GATE_OUT/build_${fam}_host.log"
          fi
          start=$(date +%s)
          if MOJOLEARN_BUILD_JOBS=1 sh "bindings/build_${fam}_host.sh" > "$log" 2>&1; then
            echo "built $set_name $fam in $(( $(date +%s) - start )) s"
          else
            echo "BUILD FAILED: $set_name $fam"; tail -60 "$log"; exit 1
          fi
          SH
          xargs -P "$GATE_SHARDS" -L 1 sh "$RUNNER_TEMP/build_one.sh" < "$list"

      - name: Save the prod host set
        if: steps.hostcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: python/mojolearn/host
          key: ${{ steps.hostcache.outputs.cache-primary-key }}

      - name: Save the sabotage host set
        if: steps.sabcache.outputs.cache-hit != 'true' && env.COVERED_LANES != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/host-sab
          key: ${{ steps.sabcache.outputs.cache-primary-key }}

      # The package must take the CPU-only path on this runner, and each host
      # binding must read back as the CPU column. A binding that compiled as
      # another column does not exist (its comptime assert refuses), so this
      # is the read-back of the witness, not a second guess.
      - name: Host bindings read back the CPU column
        run: |
          set -o pipefail
          bindings=""
          for b in ${ALL_HOST_BINDINGS//,/ }; do bindings="$bindings --binding $b"; done
          python3 tools/cpu_identity_gate_check.py readback $bindings 2>&1 \
            | tee "$GATE_OUT/readback.log"

      # The metrics Python layer's ABI and refusal tests, on the CPU-only
      # install this job just built. They plant a fake `_mojolearn_metrics`
      # and send every other lookup to the real resolver, so the finiteness
      # check runs through the core host binding's `all_finite_f32`. No other
      # push-triggered job builds the core and metrics host bindings, and
      # python-tests.yml is dispatch only and has no scikit-learn, which the
      # classification module needs as its reference (it SKIPS without it,
      # so a skip fails this step).
      - name: Metrics Python tests (CPU-only install)
        run: |
          set -o pipefail
          python3 -m pip install --quiet pytest scikit-learn
          cd python
          python3 -m pytest -q -rs -p no:cacheprovider \
            mojolearn/tests/test_classification_metrics.py \
            mojolearn/tests/test_regression_metrics.py 2>&1 | tee "$GATE_OUT/pytest_metrics.log"
          if grep -E '[0-9]+ skipped' "$GATE_OUT/pytest_metrics.log"; then
            echo "a metrics test module skipped; the step must run every test" >&2
            exit 1
          fi

      # The fixture directories split by what expected.json says. Only
      # RECORDED ones are compared here; the OWED ones are the forest host
      # gate's concern (.github/workflows/forest-host-gate.yml fails on them).
      - name: Sort forest fixtures into recorded and owed
        run: |
          recorded=""; owed=""
          for d in bench/results/forest_host/*/; do
            d="${d%/}"
            [ -f "$d/fixture.json" ] || continue
            status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status",""))' "$d/expected.json" 2>/dev/null || echo MISSING)"
            if [ "$status" = RECORDED ]; then recorded="$recorded $d"; else owed="$owed $d"; fi
          done
          echo "recorded:$recorded" | tee -a "$GATE_OUT/fixtures.txt"
          echo "owed:$owed" | tee -a "$GATE_OUT/fixtures.txt"
          echo "RECORDED=$recorded" >> "$GITHUB_ENV"
          [ -n "$recorded" ] || { echo "no recorded fixture to check" >&2; exit 2; }

      - name: Forest host gate, every recorded prediction through the CPU column build
        run: |
          set -o pipefail
          python3 tools/forest_host_gate.py check $RECORDED \
            --report "$GATE_OUT/forest_gate_prod.json" 2>&1 | tee "$GATE_OUT/forest_gate_prod.log"

      - name: Build the forest sabotage binding (MOJOLEARN_FOREST_HOST_SABOTAGE)
        if: always()
        env:
          MOJOLEARN_FOREST_HOST_OUTDIR: ${{ runner.temp }}/forest-host-sab
          MOJOLEARN_BUILD_EXTRA_DEFINES: "-D MOJOLEARN_FOREST_HOST_SABOTAGE=1"
        run: |
          set -o pipefail
          MOJOLEARN_BUILD_JOBS=2 sh bindings/build_forest_host.sh 2>&1 | tee "$GATE_OUT/build_forest_sab.log"

      # A gate that cannot fail proves nothing. The sabotage build divides the
      # vote by n_trees + 1 and seeds the GBDT cursor at bias + 1, so every
      # prediction differs and the gate must say so on every recorded fixture.
      - name: Forest host gate, the sabotage build must be caught
        if: always()
        env:
          MOJOLEARN_FOREST_HOST_ALLOW_SABOTAGE: "1"
          MOJOLEARN_FOREST_HOST_BINARY: ${{ runner.temp }}/forest-host-sab/_mojolearn_forest_host.so
        run: |
          set -o pipefail
          python3 tools/forest_host_gate.py check $RECORDED --expect-mismatch \
            --report "$GATE_OUT/forest_gate_sab.json" 2>&1 | tee "$GATE_OUT/forest_gate_sab.log"

      # The classical host gate (ols, ridge, tsvd, logistic, pca; the classical
      # host inference lane, 2026-09-13): every recording made on a GPU box
      # (Apple M4, NVIDIA H100, AMD MI300X) predicts the same bits through the
      # estimators and core host bindings built above, and each identity hash
      # equals the three committed 2026-09-14 GPU infer cells.
      - name: Classical host gate, every recorded prediction through the CPU column build
        if: always()
        run: |
          set -o pipefail
          columns=""
          for c in $CLASSICAL_GPU_COLUMNS; do columns="$columns --gpu-column $c"; done
          python3 tools/classical_host_gate.py check $CLASSICAL_RECORDED $columns \
            --report "$GATE_OUT/classical_gate_prod.json" 2>&1 | tee "$GATE_OUT/classical_gate_prod.log"

      # The tool loads on this CPU and the three committed GPU columns diff
      # exactly as recorded (the 2026-09-14 166-lane record at 1eea14f80, the
      # batch part and 31 par-* lanes, AMD column MI325X): 1493 train cells
      # IDENTICAL x3 and ONE DIVERGENT, kmeans-sqrt/wide, where the H100
      # inertia stands alone (docs/lanes/BRIEF_kmeans_sqrt_wide_h100_inertia_2026-09-14.md).
      # --diff exits 1 on that cell, so the step requires exit 1 AND the exact
      # summary tokens AND that row: a second divergence, a diff that printed
      # nothing, or fewer cells changes a token and fails the step. The cell is
      # EXPLAINED AND FIXED since 9fde8f5f7 (NVIDIA's approximate sqrt in the
      # min-reduce kernels, DEVIATION 2715; that record's kmeans-sqrt labels are
      # also wrong on every column, DEVIATION 2716). These committed JSONs are
      # the 1eea14f80 bytes and keep their count; the kmeans lanes' current
      # cells are the kmeans-sqrt fix record, asserted two steps below.
      - name: identity_break --diff over the three committed GPU columns (require 3)
        if: always()
        run: |
          st=0
          python3 tools/identity_break.py --diff $GPU_COLUMNS --require-columns 3 \
            > "$GATE_OUT/diff_gpu3.txt" 2>&1 || st=$?
          cat "$GATE_OUT/diff_gpu3.txt"
          grep -F 'summary: DIVERGENT=1, IDENTICAL=1493' "$GATE_OUT/diff_gpu3.txt"
          grep -F 'summary (infer/model): IDENTICAL=1899, N/A=1089' "$GATE_OUT/diff_gpu3.txt"
          grep -F 'summary (batch): IDENTICAL=1188, N/A=306' "$GATE_OUT/diff_gpu3.txt"
          grep -E '^\| kmeans-sqrt/wide +\| DIVERGENT +\| parts differ: inertia;' "$GATE_OUT/diff_gpu3.txt"
          grep -F 'require-columns 3 over' "$GATE_OUT/diff_gpu3.txt" | grep -F ': OK'
          [ "$st" = 1 ] || { echo "expected --diff to exit 1 on the one recorded DIVERGENT cell, got $st" >&2; exit 1; }

      # The control for the step above: demanding a fourth real hash on a lane
      # no CPU column has covered must FAIL. If it passes, --require-columns
      # is not reading what it claims to.
      - name: identity_break --diff must refuse a fourth column that is not there
        if: always()
        run: |
          set -o pipefail
          if python3 tools/identity_break.py --diff $GPU_COLUMNS --require-columns 4 --lanes gemm-pinned \
               > "$GATE_OUT/diff_gpu4_control.txt" 2>&1; then
            echo "control FAIL: --require-columns 4 over three columns exited 0" >&2
            exit 1
          fi
          grep -F 'REQUIRE FAIL gemm-pinned/base train' "$GATE_OUT/diff_gpu4_control.txt"
          echo "control OK: --require-columns 4 refused three columns"

      # The kmeans lanes after the kmeans-sqrt fix (DEVIATIONS 2715 and 2716,
      # bench/results/identity_break/2026-09-14_kmeans-sqrt-fix): the three fixed
      # columns diff IDENTICAL on all 72 cells, and the unfixed columns of the
      # same boxes must still read the one NVIDIA inertia cell DIVERGENT, so the
      # record cannot pass by carrying identical files.
      - name: identity_break --diff over the kmeans-sqrt fix record (fixed IDENTICAL, unfixed DIVERGENT)
        if: always()
        run: |
          R=bench/results/identity_break/2026-09-14_kmeans-sqrt-fix
          st=0
          python3 tools/identity_break.py --diff $R/apple-m4.json $R/nvidia-h100-sm_90a.json \
            $R/amd-mi325x-gfx942.json --require-columns 3 > "$GATE_OUT/diff_kmsqrt_fixed.txt" 2>&1 || st=$?
          cat "$GATE_OUT/diff_kmsqrt_fixed.txt"
          [ "$st" = 0 ] || { echo "fixed kmeans columns: --diff exited $st" >&2; exit 1; }
          grep -F 'summary: IDENTICAL=72' "$GATE_OUT/diff_kmsqrt_fixed.txt"
          grep -F 'require-columns 3 over' "$GATE_OUT/diff_kmsqrt_fixed.txt" | grep -F ': OK'
          st=0
          python3 tools/identity_break.py --diff $R/unfixed/apple-m4.json $R/unfixed/nvidia-h100-sm_90a.json \
            $R/unfixed/amd-mi325x-gfx942.json $R/unfixed/nvidia-rtx-4090-sm_89.json --require-columns 4 \
            > "$GATE_OUT/diff_kmsqrt_unfixed.txt" 2>&1 || st=$?
          cat "$GATE_OUT/diff_kmsqrt_unfixed.txt"
          grep -F 'summary: DIVERGENT=1, IDENTICAL=8' "$GATE_OUT/diff_kmsqrt_unfixed.txt"
          grep -E '^\| kmeans-sqrt/wide +\| DIVERGENT +\| parts differ: inertia; agree: centers,labels,scales' "$GATE_OUT/diff_kmsqrt_unfixed.txt"
          [ "$st" = 1 ] || { echo "unfixed kmeans-sqrt columns: expected --diff to exit 1, got $st" >&2; exit 1; }

      # THE FOURTH COLUMN, THE PLUMBING SMOKE. Two lanes, one fixture, one
      # repeat, on this CPU, through the CPU-only package. Every cell must
      # exist and read REFUSED with the by-name sentence (or STABLE if the lane
      # is in COVERED_LANES); the vendor label must be the derived cpu-<model>;
      # the commit must be this workflow's SHA; host.column must be cpu and
      # both host bindings must appear in host.families as cpu. A JSON with no
      # cell fails.
      - name: The CPU column, plumbing smoke (two lanes, one fixture)
        if: always()
        timeout-minutes: 20
        run: |
          set -o pipefail
          # The smoke runs two lanes, so it judges only those two as covered:
          # the checker fails any --covered lane with no cell, and the full
          # COVERED_LANES list is the next step's. Both must be covered lanes.
          SMOKE_LANES=gemm-pinned,kde
          for lane in ${SMOKE_LANES//,/ }; do
            case ",$COVERED_LANES," in *",$lane,"*) ;; *) echo "smoke lane $lane is not in COVERED_LANES" >&2; exit 1 ;; esac
          done
          python3 tools/identity_break.py --lanes "$SMOKE_LANES" --fixtures base --repeats 1 \
            --json "$GATE_OUT/cpu-smoke-${{ matrix.slot }}.json" 2>&1 | tee "$GATE_OUT/cpu_smoke.log"
          python3 tools/cpu_identity_gate_check.py column "$GATE_OUT/cpu-smoke-${{ matrix.slot }}.json" \
            --covered "$SMOKE_LANES" --commit "$MOJOLEARN_COMMIT" \
            --binding "$ALL_HOST_BINDINGS" 2>&1 | tee "$GATE_OUT/cpu_smoke_check.log"

      # THE FOURTH COLUMN, THE COVERED LANES. Every fixture, two repeats, then
      # the four-way diff with --require-columns 4 on exactly those lanes.
      # The lanes run as GATE_SHARDS parallel identity_break processes joined
      # by identity_break --merge (tools/cpu_identity_gate_check.py
      # run-column, 2026-09-15): at 2cf5562b1 one process took 24 to 30
      # minutes per step and two runners hit the job's 60-minute limit (run
      # 34956243867). Every lane still runs every fixture and repeat; the
      # merge refuses parts that ran a different machine, commit, fixture set
      # or host binding bytes, and any shard exiting non-zero fails the step.
      # The diffs read
      # RECORD_COVERED_LANES against GPU_COLUMNS, and FIX_COVERED_LANES (the
      # covered lanes whose record cells predate a fix on every column,
      # kmeans-sqrt) against FIX_COLUMNS, the same boxes after the fix
      # (python/mojolearn/host_surface.py, TRAINING_FIX_LANES).
      # Empty COVERED_LANES runs nothing and says so; that is a statement about
      # phase 1, not a pass.
      - name: The CPU column, covered lanes
        if: always()
        timeout-minutes: 50
        run: |
          set -o pipefail
          if [ -z "$COVERED_LANES" ]; then
            echo "no identity_break lane has a CPU implementation yet (COVERED_LANES is empty); phase 1 of docs/lanes/BRIEF_cpu_training_2026-09-13.md adds the first (gemm-pinned). Nothing run, nothing certified." | tee "$GATE_OUT/cpu_column.log"
            exit 0
          fi
          echo "scope $GATE_SCOPE: lanes $RUN_LANES; identity_break arguments: ${RUN_ARGS:-(none: nine fixtures, two repeats, the batch part)}"
          python3 tools/cpu_identity_gate_check.py run-column --lanes "$RUN_LANES" --shards "$GATE_SHARDS" \
            --json "$GATE_OUT/cpu-${{ matrix.slot }}.json" -- $RUN_ARGS 2>&1 | tee "$GATE_OUT/cpu_column.log"
          python3 tools/cpu_identity_gate_check.py column "$GATE_OUT/cpu-${{ matrix.slot }}.json" \
            --covered "$RUN_LANES" --commit "$MOJOLEARN_COMMIT" \
            --binding "$ALL_HOST_BINDINGS" 2>&1 | tee "$GATE_OUT/cpu_column_check.log"
          python3 tools/identity_break.py --diff $GPU_COLUMNS "$GATE_OUT/cpu-${{ matrix.slot }}.json" \
            --require-columns 4 --lanes "$RUN_RECORD_LANES" $DIFF_ARGS 2>&1 | tee "$GATE_OUT/diff_four_columns.txt"
          if [ -n "$RUN_FIX_LANES" ]; then
            python3 tools/identity_break.py --diff $FIX_COLUMNS "$GATE_OUT/cpu-${{ matrix.slot }}.json" \
              --require-columns 4 --lanes "$RUN_FIX_LANES" $DIFF_ARGS 2>&1 | tee "$GATE_OUT/diff_four_columns_fix.txt"
          fi

      # The covered lanes' negative control (brief section 3.4). A gate that
      # cannot fail proves nothing, so the whole host set is built again with
      # -D MOJOLEARN_HOST_SABOTAGE=1 into its own directory (honored in
      # gemm_oracle by walking every leaf DESCENDING, which reaches every
      # lane whose host oracle folds through gemm_oracle_cell, and in
      # kde_oracle by summing every logsumexp row descending from one extra
      # unit (the tophat kernel sums exact integers), in hw_oracle
      # by splitting the SSE fused multiply-add, in smo_oracle by walking
      # its GEMM leaf descending, in linkage_oracle by walking the sorted
      # edge keys descending (the maximum spanning tree), in pcg_rng by one
      # extra draw on every keyed stream (every ExtraTrees threshold), and
      # in xorwow by one extra step before every split fraction (every
      # isolation tree, in kmeans_oracle by one extra unit in every
      # quantized centroid-sum cell, in metrics_oracle by shifting every
      # slab tree's chunk boundaries by one value (classification_oracle's
      # log loss, regression errors and KL divergence fold through it), in spectral_oracle by
      # seeding the recluster one draw off, in scaler_oracle by the same
      # shifted tree plus the min-max offset's subtraction as an addition,
      # in qn_oracle by walking the solver's dot chains descending, in
      # kpss_oracle by walking every strided series partial descending, in
      # knn_host_predict by walking the unexpanded, cosine and ball cover
      # distance chains descending (Chebyshev: the next float above the
      # maximum), in dbscan_oracle by one more neighbor or unit of weight
      # to be core, in
      # pca_full_oracle by folding every QR trailing-column dot product's
      # lanes serially descending, in
      # mlp_oracle by walking every MLP row sum descending, in
      # rf_oracle by drawing every bootstrap row from the next Philox
      # subsequence and seeding every node's column sample one off, in gpr_oracle by walking the scaled distance's
      # feature axis descending, in gbdt_oracle by adding 1.0 to the
      # Newton leaf walker's Hessian regularizer, in gbdt_oracle_rmse by
      # adding 1.0 to the searcher's leaf regularizer, in arima_oracle by
      # doubling the finite-difference step, in umap_oracle by keying
      # every negative draw one epoch late, in resample_host by shifting
      # every per-replicate and per-chunk tree's chunk boundaries by one
      # value, and in hdbscan_host_oracle by reading every core distance one
      # neighbor early; the kernel_methods and mixture host families move
      # through gemm_oracle's descending leaf);
      # each further phase 1
      # binding names the fold its arm moves), loaded through
      # MOJOLEARN_HOST_DIR with MOJOLEARN_HOST_ALLOW_SABOTAGE=1, run on the
      # lanes this run covers (sharded as above) on ONE fixture (base), one
      # repeat, no batch part, since 2026-09-15: the step only has to show
      # the gate can fail. Every cell must still be STABLE (a wrong answer,
      # not a refusal); the four-way diff on base must exit non-zero with
      # DIVERGENT; and, stricter per lane than the full-fixture step it
      # replaces (which asked for DIVERGENT anywhere in the summary),
      # `cpu_identity_gate_check.py sabotage-caught` requires EVERY lane to
      # move a train, infer or model hash off the committed columns, except
      # the lanes its SABOTAGE_BLIND names as measured blind, which must stay
      # blind. The set is built in the build step above (or restored under
      # its own cache key). Empty COVERED_LANES skips it.
      - name: The CPU column, covered lanes must diverge under MOJOLEARN_HOST_SABOTAGE
        if: always()
        timeout-minutes: 50
        run: |
          set -o pipefail
          if [ -z "$COVERED_LANES" ]; then
            echo "no covered lane, no sabotage arm to run (COVERED_LANES is empty)" | tee "$GATE_OUT/cpu_sabotage.log"
            exit 0
          fi
          # Every routed family, the byte LM and the forest binding must be in
          # the sabotage set: a missing one would load nothing and read
          # REFUSED, which the diff below would count as a catch.
          for b in _mojolearn_byte_lm_host _mojolearn_forest_host $HOST_BINDINGS; do
            [ -f "${{ runner.temp }}/host-sab/$b.so" ] || { echo "the sabotage host set lacks $b.so" >&2; exit 1; }
          done
          export MOJOLEARN_HOST_DIR="${{ runner.temp }}/host-sab" MOJOLEARN_HOST_ALLOW_SABOTAGE=1
          python3 tools/cpu_identity_gate_check.py run-column --lanes "$RUN_LANES" --shards "$GATE_SHARDS" \
            --json "$GATE_OUT/cpu-sab-${{ matrix.slot }}.json" -- --fixtures base --repeats 1 --no-batch \
            2>&1 | tee "$GATE_OUT/cpu_sabotage.log"
          python3 tools/cpu_identity_gate_check.py column "$GATE_OUT/cpu-sab-${{ matrix.slot }}.json" \
            --covered "$RUN_LANES" --commit "$MOJOLEARN_COMMIT" 2>&1 | tee "$GATE_OUT/cpu_sabotage_check.log"
          if python3 tools/identity_break.py --diff $GPU_COLUMNS "$GATE_OUT/cpu-sab-${{ matrix.slot }}.json" \
               --require-columns 4 --lanes "$RUN_RECORD_LANES" --fixtures base --no-batch \
               > "$GATE_OUT/diff_four_columns_sab.txt" 2>&1; then
            echo "SABOTAGE NOT CAUGHT: the sabotage host set diffed IDENTICAL against the GPU columns" >&2
            exit 1
          fi
          grep -E '^summary: .*DIVERGENT=' "$GATE_OUT/diff_four_columns_sab.txt"
          if [ -n "$RUN_FIX_LANES" ]; then
            if python3 tools/identity_break.py --diff $FIX_COLUMNS "$GATE_OUT/cpu-sab-${{ matrix.slot }}.json" \
                 --require-columns 4 --lanes "$RUN_FIX_LANES" --fixtures base --no-batch \
                 > "$GATE_OUT/diff_four_columns_fix_sab.txt" 2>&1; then
              echo "SABOTAGE NOT CAUGHT: the sabotage host set diffed IDENTICAL against the fix columns on $RUN_FIX_LANES" >&2
              exit 1
            fi
            grep -E '^summary: .*DIVERGENT=' "$GATE_OUT/diff_four_columns_fix_sab.txt"
          fi
          python3 tools/cpu_identity_gate_check.py sabotage-caught "$GATE_OUT/cpu-sab-${{ matrix.slot }}.json" \
            --lanes "$RUN_LANES" --against $GPU_COLUMNS $FIX_COLUMNS 2>&1 | tee "$GATE_OUT/sabotage_caught.log"
          echo "sabotage caught on every covered lane of this run"

      # The same sabotage host set (built by the step above into host-sab)
      # must make the classical gate say so on every recording.
      - name: Classical host gate, the sabotage build must be caught
        if: always()
        env:
          MOJOLEARN_HOST_DIR: ${{ runner.temp }}/host-sab
          MOJOLEARN_HOST_ALLOW_SABOTAGE: "1"
        run: |
          set -o pipefail
          [ -f "$MOJOLEARN_HOST_DIR/_mojolearn_estimators_host.so" ] || { echo "no sabotage estimators host binding under $MOJOLEARN_HOST_DIR" >&2; exit 1; }
          python3 tools/classical_host_gate.py check $CLASSICAL_RECORDED --expect-mismatch \
            --report "$GATE_OUT/classical_gate_sab.json" 2>&1 | tee "$GATE_OUT/classical_gate_sab.log"

      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cpu-identity-gate-${{ matrix.slot }}
          path: cpu-identity-gate-out/
          if-no-files-found: warn
