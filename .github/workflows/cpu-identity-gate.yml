# CPU identity gate (the CPU training lane, 2026-09-13; brief
# docs/lanes/BRIEF_cpu_training_2026-09-13.md section 3.4) on GitHub's free
# standard runners: ARM64 Linux (Azure Cobalt 100), x86-64 Linux and Apple M1
# macOS, the byte LM CPU gate's matrix. This is the FOURTH COLUMN of
# tools/identity_break.py, a CPU beside the three committed GPU columns
# python/mojolearn/host_surface.py names as TRAINING_GPU_COLUMNS (the record
# directory the GPU_COLUMNS step reads; 2026-09-13_three-columns was the
# first, it is not the one diffed now).
#
# What it proves on each runner, and nothing more. Every host binding the
# manifest declares (python/mojolearn/host_surface.py lists the families, a
# count written here went stale twice on 2026-09-14; each builds through
# bindings/build_<family>_host.sh, in ONE loop over the manifest's list, never
# a hand list: until 2026-09-15 this file named byte_lm, forest and tokenizer
# beside the routed families and missed seven bindings the wheel ships)
# ON THAT RUNNER with no accelerator target as the kernel matrix's CPU column
# (checks/kernel_matrix.mojo COLUMN_CPU; each binding asserts it at build time
# and reads it back). The checkout's package takes the CPU-only path
# (vendor() is cpu). The forest host binding reproduces every RECORDED
# forest and GBDT prediction (tools/forest_host_gate.py check) and a sabotage
# build of it is caught. tools/identity_break.py loads on the CPU, diffs the
# three committed GPU columns to IDENTICAL x3 on every train cell (the count
# the diff step greps), and, run on
# this runner, writes a CPU column whose provenance is derived (vendor
# cpu-<cpu model slug>, commit = the workflow's SHA, host.column cpu) and
# whose cells read REFUSED BY NAME for every lane without a CPU
# implementation and STABLE for every lane in COVERED_LANES.
#
# COVERED_LANES is the list of identity_break lanes that have a CPU
# implementation, and BUILD_FAMILIES every host family the gate builds
# (bindings/build_<family>_host.sh; the routed ones by _backend._HOST_MODULES,
# the rest loaded by path or through mojolearn.host_model). Both
# are READ FROM python/mojolearn/host_surface.py (the host surface manifest
# lane, 2026-09-14); a host lane adds its family and lanes there and this
# file follows. Were the list empty the "covered" steps would say so and run
# nothing; that is not a pass, it is a statement. The smoke step runs regardless and FAILS if the run
# produces no cell, a cell that is not the refusal by name, a vendor label
# that is not derived, or an empty commit.
#
# A green job enters the brief's certified table only after its uploaded
# JSON is read and its host.cpu_model names the CPU; the job summary is not
# the record.

name: CPU identity gate

on:
  # LIGHT TOUCH (Andrew, Sep 15 2026): this workflow never starts by itself. Every job
  # is skipped unless the dispatch input confirm is RUN-HEAVY, so a wrong trigger costs nothing.
  workflow_call:
    inputs:
      confirm:
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      confirm:
        description: "Heavy run on paid or queued runners. Type RUN-HEAVY to really run it; anything else skips every job"
        required: true
        default: ""
        type: string

# Superseded branch runs only. Each main run has its own group.
concurrency:
  group: cpu-identity-${{ github.event_name == 'push' && 'inference' || 'full' }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

env:
  # THE LISTS THIS GATE RUNS ON ARE NOT WRITTEN HERE. Since the host surface
  # manifest lane (2026-09-14) they come from python/mojolearn/host_surface.py,
  # the one declaration of the CPU surface, in the "CPU surface manifest"
  # step below, which writes to GITHUB_ENV:
  #   COVERED_LANES       the identity_break lanes with a CPU TRAINING path,
  #                       comma separated. A lane listed must read STABLE on
  #                       every fixture and IDENTICAL x4 against the three
  #                       GPU columns; a lane not listed must read REFUSED by
  #                       name. The INFERENCE-ONLY lanes (logistic,
  #                       logistic-multiclass) are deliberately not there:
  #                       their train cell refuses by name on the CPU column,
  #                       so `--require-columns 4` cannot hold on it. Their
  #                       gate is tools/classical_host_gate.py over
  #                       CLASSICAL_RECORDED, the same shape as the forest
  #                       host gate. Since workstream E (2026-09-14) the knn,
  #                       pca, pca-whiten, tsvd, ols and ridge lanes train on
  #                       the host too and sit in both lists, and dbscan
  #                       trains on the host; batch 2 adds logistic (the
  #                       binary L-BFGS arm) to the training list, and batch
  #                       3 (lane/cpu-training-batch3) adds
  #                       logistic-multiclass (the softmax loss), so no
  #                       classical lane is inference-only any more.
  #   BUILD_FAMILIES      every family the gate builds, space separated: the
  #                       manifest's --families on the full verification
  #                       (routed, loaded by path and inference-only alike),
  #                       --wheel-families otherwise. Each is built by
  #                       bindings/build_<family>_host.sh (a shim over
  #                       bindings/build_host_family.sh), read back as the CPU
  #                       column, and named in host.families.
  #                       SINCE 2026-09-16 THE TWO LISTS NAME THE SAME
  #                       THIRTY-TWO FAMILIES, because every family ships
  #                       (lane/ship-cpu-host-families). The branch is kept
  #                       rather than collapsed: it is the manifest that
  #                       decides, and the day a family is held back again the
  #                       routine list shrinks with it and nothing here has to
  #                       change. The routine gate now builds the whole set on
  #                       a push, which is the point, because it builds what
  #                       the wheel ships, at about seven minutes of
  #                       compiling, restored from the host-v2 cache when no
  #                       .mojo, build script or manifest moved.
  #   SABOTAGE_FAMILIES   the same list, built again with
  #                       -D MOJOLEARN_HOST_SABOTAGE=1 into host-sab.
  #   ALL_HOST_BINDINGS   the BUILD_FAMILIES basenames, comma separated, the
  #                       read-back and column checks' --binding list.
  #                       `cpu_identity_gate_check.py build-list` fails the
  #                       manifest step when any of the three lists leaves out
  #                       a binding the manifest declares.
  #   SAVED_MODEL_RECORDED
  #                       the saved-model recordings of the unrouted inference
  #                       families (forecast, mixture_infer, gp_infer,
  #                       hdbscan_infer, ivf_search, embedding_infer),
  #                       space separated, checked like CLASSICAL_RECORDED.
  #   CLASSICAL_RECORDED  the classical host gate recordings, space separated.
  #   CLASSICAL_GPU_COLUMNS
  #                       the three 46-lane GPU columns the classical gate
  #                       compares each host identity hash against.
  #   GPU_COLUMNS         the three committed GPU columns the CPU TRAINING
  #                       column is diffed against (--require-columns 4). The
  #                       record must not lag the surface: run 34832840859 at
  #                       7bf4f4cc9 failed "27 short" because the 2026-09-13
  #                       record predates the kde and svc model cells and the
  #                       holtwinters infer cells; the manifest names the
  #                       2026-09-14 47-lane record taken at that commit.
  MOJOLEARN_HOST_SURFACE: python/mojolearn/host_surface.py

jobs:
  gate:
    if: inputs.confirm == 'RUN-HEAVY'
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      # Independent architectures run together (user-approved parallelism).
      # Each job retains its two-shard cap: at most six numerical workers.
      max-parallel: 3
      matrix:
        # One CPU environment per OS/architecture. GPU release evidence is
        # separately one Apple, one AMD and one NVIDIA column.
        include:
          - runner: ubuntu-24.04-arm
            slot: arm64
            label: ARM64 Linux (Azure Cobalt 100)
          - runner: macos-15
            slot: macos15
            label: Apple silicon macOS (hosted)
          - runner: ubuntu-24.04
            slot: x86-a
            label: x86-64 Linux (24.04)
    runs-on: ${{ matrix.runner }}
    # Both full-column sweeps have their own step budgets, in addition to
    # binding builds and saved-model/property gates. The previous 90-minute
    # job cap cancelled hosted Apple run 35350125464 during its sabotage
    # sweep. Preserve the per-job two-worker shard cap;
    # allow bounded time for both arms and artifact upload instead.
    # Run 35628874036 (a503d5d6d): the covered lanes step hit its 50-minute
    # budget on all three runners with both shards still running, about
    # 6000 s of lane time measured per runner and the column unfinished (the
    # Ordered GBDT lanes alone are about 3000 s). Each full-column step now
    # has 120 minutes and the job 330, under the hosted runners' 360; the
    # two-shard cap is unchanged. A timeout is still a failure.
    timeout-minutes: 330
    permissions:
      contents: read
    env:
      MOJOLEARN_COMMIT: ${{ github.sha }}
      MOJOLEARN_GATE_COMMIT: ${{ github.sha }}
      # Pushes verify inference plus small plumbing cases. Full training
      # identity is weekly, explicitly dispatched, or called by a release.
      FULL_CPU_VERIFY: ${{ github.event_name != 'push' }}
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      MOJOLEARN_COMPILE_JOBS: "2"
      MOJOLEARN_CPU_THREADS: "1"
      MOJOLEARN_NUMERIC_MODE: identical
      PYTHONPATH: ${{ github.workspace }}/python
      GATE_OUT: ${{ github.workspace }}/cpu-identity-gate-out
    defaults:
      run:
        shell: bash
    steps:
      # bench/results is large; only the forest host fixtures and the three
      # committed GPU columns come down.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/bench/results/*
            /bench/results/forest_host/
            /bench/results/classical_host/
            /bench/results/identity_break/
            !/bench/results/identity_break/*
            /bench/results/identity_break/2026-09-13_three-columns/
            /bench/results/identity_break/2026-09-14_46-lanes/
            /bench/results/identity_break/2026-09-14_47-lanes/
            /bench/results/identity_break/2026-09-14_136-lanes/
            /bench/results/identity_break/2026-09-14_166-lanes/
            /bench/results/identity_break/2026-09-14_kmeans-sqrt-fix/
            /bench/results/identity_break/2026-09-15_embedding-sort/
            /bench/results/identity_break/2026-09-14_ivf-euclidean/
            /bench/results/identity_break/2026-09-15_gbdt-ctr-tables/

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Runner facts
        run: |
          mkdir -p "$GATE_OUT"
          {
            uname -a
            python3 --version
            if [ "$(uname -s)" = Darwin ]; then
              sysctl -n machdep.cpu.brand_string
              sw_vers -productVersion
            else
              lscpu
              grep -m1 -E '^(flags|Features)' /proc/cpuinfo
            fi
          } 2>&1 | tee "$GATE_OUT/runner.txt"
          # The step shell is `bash -eo pipefail`, and ARM64 /proc/cpuinfo has no
          # `model name`, so every lookup here must tolerate no match.
          if [ "$(uname -s)" = Darwin ]; then
            cpu="$(sysctl -n machdep.cpu.brand_string || true)"
          else
            cpu="$( (grep -m1 -E '^model name' /proc/cpuinfo || true) | cut -d: -f2- | sed 's/^ //')"
            [ -n "$cpu" ] || cpu="$( (lscpu | grep -m1 'Model name' || true) | cut -d: -f2- | sed 's/^ *//')"
          fi
          echo "### ${{ matrix.slot }}: ${cpu:-unknown CPU} ($(uname -m))" >> "$GITHUB_STEP_SUMMARY"
          # The --target-cpu the two host build scripts pass on this runner,
          # recorded into the CPU column's host.target_cpu.
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) target=x86-64-v3 ;;
            Darwin-arm64) target=apple-m1 ;;
            *) target=none ;;
          esac
          echo "MOJOLEARN_TARGET_CPU=$target" >> "$GITHUB_ENV"
          # The covered-lanes steps split their lanes into one identity_break
          # process per available CPU, capped at two; matrix jobs are serial.
          shards="$(getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)"
          [ "$shards" -le 2 ] || shards=2
          echo "GATE_SHARDS=$shards" >> "$GITHUB_ENV"
          echo "identity_break shards on this runner: $shards"
          python3 -m pip install --quiet numpy
          ls bench/results/forest_host/ bench/results/identity_break/2026-09-13_three-columns/

      # ONE STEP reads every list from the manifest. It runs the file by path
      # because the package cannot import yet (no binding is built on this
      # runner); `python3 -m mojolearn.host_surface` says the same thing
      # where it can. A manifest that names a recording directory that is
      # not checked out fails here, before a build is spent.
      - name: Gate orchestration regression tests
        run: python3 -m unittest discover -s tools -p test_cpu_identity_gate.py -v

      - name: Verification scope
        run: |
          if [ "$FULL_CPU_VERIFY" = true ]; then
            echo "### Full CPU reference certification: all training lanes and fixtures" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Routine CPU inference and plumbing checks; full training certification not run" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: CPU surface manifest
        run: |
          set -o pipefail
          manifest=$MOJOLEARN_HOST_SURFACE
          {
            echo "COVERED_LANES=$(python3 $manifest --covered-lanes)"
            if [ "$FULL_CPU_VERIFY" = true ]; then
              echo "BUILD_FAMILIES=$(python3 $manifest --families)"
              echo "SABOTAGE_FAMILIES=$(python3 $manifest --families)"
              echo "ALL_HOST_BINDINGS=$(python3 $manifest --bindings --sep ,)"
            else
              echo "BUILD_FAMILIES=$(python3 $manifest --wheel-families)"
              echo "SABOTAGE_FAMILIES=$(python3 $manifest --wheel-families)"
              echo "ALL_HOST_BINDINGS=$(python3 $manifest --wheel-bindings --sep ,)"
            fi
            echo "CLASSICAL_RECORDED=$(python3 $manifest --classical-recorded)"
            echo "SAVED_MODEL_RECORDED=$(python3 $manifest --saved-model-recorded)"
            echo "CLASSICAL_GPU_COLUMNS=$(python3 $manifest --classical-gpu-columns)"
            echo "GPU_COLUMNS=$(python3 $manifest --training-gpu-columns)"
            echo "RECORD_COVERED_LANES=$(python3 $manifest --record-covered-lanes)"
            echo "FIX_COVERED_LANES=$(python3 $manifest --fix-covered-lanes)"
            echo "FIX_COLUMNS=$(python3 $manifest --training-fix-columns)"
            # The CTR table lanes load these Metal-saved models on the CPU
            # column (CPU training refuses CTR tables by name).
            echo "MOJOLEARN_IDENTITY_GBDT_CTR_MODELS=$GITHUB_WORKSPACE/$(python3 $manifest --gbdt-ctr-models)"
          } | tee -a "$GITHUB_ENV" | tee "$GATE_OUT/manifest.txt"
          python3 $manifest --json > "$GATE_OUT/host_surface.json"
          # The build lists above must cover every binding the manifest
          # declares (tools/test_cpu_identity_gate.py BuildListTests holds the
          # negative control: the pre-2026-09-15 hand list fails here).
          scope=routine; [ "$FULL_CPU_VERIFY" = true ] && scope=full
          python3 tools/cpu_identity_gate_check.py build-list --scope "$scope" \
            --families "$(sed -n 's/^BUILD_FAMILIES=//p' "$GATE_OUT/manifest.txt")" \
            --sabotage-families "$(sed -n 's/^SABOTAGE_FAMILIES=//p' "$GATE_OUT/manifest.txt")" \
            --readback "$(sed -n 's/^ALL_HOST_BINDINGS=//p' "$GATE_OUT/manifest.txt")" \
            2>&1 | tee "$GATE_OUT/build_list.log"
          for d in $(python3 $manifest --classical-recorded) $(python3 $manifest --saved-model-recorded) $(python3 $manifest --classical-gpu-columns) $(python3 $manifest --training-gpu-columns) $(python3 $manifest --training-fix-columns) $(python3 $manifest --gbdt-ctr-models); do
            [ -e "$d" ] || { echo "manifest names $d, which is not in this checkout: the record lags the surface" >&2; exit 1; }
          done
          # The `if: always()` steps below run after an earlier failure too,
          # and then read every list above as EMPTY: an empty COVERED_LANES
          # reads as "nothing to certify" and an empty fixture list reaches
          # the tools as a usage error. They refuse unless this marker is set.
          echo "CPU_SURFACE_MANIFEST=read" >> "$GITHUB_ENV"

      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          run-install: true
          cache: true

      - name: Record toolchain and runner image
        run: |
          pixi run mojo --version | tee "$GATE_OUT/mojo_version.txt"
          echo "MOJOLEARN_MOJO_VERSION=$(pixi run mojo --version | head -1)" >> "$GITHUB_ENV"
          echo "GATE_IMAGE=${ImageOS}-${ImageVersion}" >> "$GITHUB_ENV"

      # Exact matches only. This includes every Mojo source, build scripts,
      # lockfile, target, runner image and workflow flags. No fallback keys.
      # Only production binaries enter this cache; sabotage builds stay in temp.
      - name: Cache production host bindings
        id: host-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: python/mojolearn/host/*.so
          key: host-v2-${{ env.FULL_CPU_VERIFY }}-${{ runner.os }}-${{ runner.arch }}-${{ env.GATE_IMAGE }}-${{ env.MOJOLEARN_TARGET_CPU }}-identical-${{ hashFiles('**/*.mojo', 'bindings/*.sh', 'pixi.lock', 'pixi.toml', 'python/mojolearn/host_surface.py', '.github/workflows/cpu-identity-gate.yml') }}

      # Every family in BUILD_FAMILIES, straight from the manifest: the byte
      # LM, forest, tokenizer and neural bindings loaded by path, the routed
      # (phase 1) families, and the inference-only families the wheel ships
      # (mixture_infer, gp_infer, hdbscan_infer, embedding_infer, ivf_search,
      # forecast). The manifest step's build-list check has already failed
      # if the list leaves one out, and the read-back step below fails on a
      # listed binding that did not build.
      - name: Build every host binding the manifest declares (CPU column)
        if: steps.host-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          for family in $BUILD_FAMILIES; do
            MOJOLEARN_BUILD_JOBS=2 sh "bindings/build_${family}_host.sh" 2>&1 | tee "$GATE_OUT/build_${family}_host.log"
          done

      # `python/mojolearn/_portable_math.py` dlopens the owned host math
      # library (.dylibs/libMojolearnMath.dylib on macOS, .libs/libMojolearnMath.so
      # on Linux) for sqrt, log and exp. Nothing under bindings/ builds it and
      # both directories are gitignored, so on a fresh checkout every saved
      # model whose Python side calls sqrt (the GP family first) failed with
      # OSError (run 35628874036). It is built by the tree's own recipe,
      # packaging/portable_math/stage.py build(), whose compiler flags are the
      # arithmetic contract, and it is small enough to build every run.
      - name: Build the owned host math library (libMojolearnMath)
        run: |
          set -o pipefail
          if [ "$(uname -s)" = Darwin ]; then out=python/mojolearn/.dylibs/libMojolearnMath.dylib
          else out=python/mojolearn/.libs/libMojolearnMath.so; fi
          PYTHONPATH=packaging/portable_math python3 -c \
            "import json, pathlib, sys, stage; print(json.dumps(stage.build(pathlib.Path(sys.argv[1])), indent=2))" \
            "$out" 2>&1 | tee "$GATE_OUT/portable_math.log"
          python3 -c "import ctypes, sys; lib = ctypes.CDLL(sys.argv[1]); f = lib.mojolearn_sqrt; f.argtypes = [ctypes.c_double]; f.restype = ctypes.c_double; assert f(4.0) == 2.0" "$out"

      # The package must take the CPU-only path on this runner, and each host
      # binding must read back as the CPU column. A binding that compiled as
      # another column does not exist (its comptime assert refuses), so this
      # is the read-back of the witness, not a second guess.
      - name: Host bindings read back the CPU column
        run: |
          set -o pipefail
          bindings=""
          for b in ${ALL_HOST_BINDINGS//,/ }; do bindings="$bindings --binding $b"; done
          python3 tools/cpu_identity_gate_check.py readback $bindings 2>&1 \
            | tee "$GATE_OUT/readback.log"

      # The metrics Python layer's ABI and refusal tests, on the CPU-only
      # install this job just built. They plant a fake `_mojolearn_metrics`
      # and send every other lookup to the real resolver, so the finiteness
      # check runs through the core host binding's `all_finite_f32`. No other
      # push-triggered job builds the core and metrics host bindings, and
      # python-tests.yml is dispatch only and has no scikit-learn, which the
      # classification module needs as its reference (it SKIPS without it,
      # so a skip fails this step).
      - name: Metrics Python tests (CPU-only install)
        run: |
          set -o pipefail
          python3 -m pip install --quiet pytest scikit-learn
          cd python
          python3 -m pytest -q -rs -p no:cacheprovider \
            mojolearn/tests/test_classification_metrics.py \
            mojolearn/tests/test_regression_metrics.py \
            mojolearn/tests/test_cpu_inference_boundary.py \
            mojolearn/tests/test_host_surface.py 2>&1 | tee "$GATE_OUT/pytest_metrics.log"
          if grep -E '[0-9]+ skipped' "$GATE_OUT/pytest_metrics.log"; then
            echo "a metrics test module skipped; the step must run every test" >&2
            exit 1
          fi

      # The fixture directories split by what expected.json says. Only
      # RECORDED ones are compared here; the OWED ones are the forest host
      # gate's concern (.github/workflows/forest-host-gate.yml fails on them).
      - name: Sort forest fixtures into recorded and owed
        run: |
          recorded=""; owed=""
          for d in bench/results/forest_host/*/; do
            d="${d%/}"
            [ -f "$d/fixture.json" ] || continue
            status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status",""))' "$d/expected.json" 2>/dev/null || echo MISSING)"
            if [ "$status" = RECORDED ]; then recorded="$recorded $d"; else owed="$owed $d"; fi
          done
          echo "recorded:$recorded" | tee -a "$GATE_OUT/fixtures.txt"
          echo "owed:$owed" | tee -a "$GATE_OUT/fixtures.txt"
          echo "RECORDED=$recorded" >> "$GITHUB_ENV"
          [ -n "$recorded" ] || { echo "no recorded fixture to check" >&2; exit 2; }

      - name: Forest host gate, every recorded prediction through the CPU column build
        run: |
          set -o pipefail
          python3 tools/forest_host_gate.py check $RECORDED \
            --report "$GATE_OUT/forest_gate_prod.json" 2>&1 | tee "$GATE_OUT/forest_gate_prod.log"

      - name: Build the forest sabotage binding (MOJOLEARN_FOREST_HOST_SABOTAGE)
        if: always()
        env:
          MOJOLEARN_FOREST_HOST_OUTDIR: ${{ runner.temp }}/forest-host-sab
          MOJOLEARN_BUILD_EXTRA_DEFINES: "-D MOJOLEARN_FOREST_HOST_SABOTAGE=1"
        run: |
          set -o pipefail
          command -v pixi >/dev/null || { echo "::error::pixi is not on PATH: the setup-pixi step did not run (an earlier step failed); fix the first failed step" >&2; exit 1; }
          MOJOLEARN_BUILD_JOBS=2 sh bindings/build_forest_host.sh 2>&1 | tee "$GATE_OUT/build_forest_sab.log"

      # A gate that cannot fail proves nothing. The sabotage build divides the
      # vote by n_trees + 1 and seeds the GBDT cursor at bias + 1, so every
      # prediction differs and the gate must say so on every recorded fixture.
      - name: Forest host gate, the sabotage build must be caught
        if: always()
        env:
          MOJOLEARN_FOREST_HOST_ALLOW_SABOTAGE: "1"
          MOJOLEARN_FOREST_HOST_BINARY: ${{ runner.temp }}/forest-host-sab/_mojolearn_forest_host.so
        run: |
          set -o pipefail
          [ -n "${RECORDED:-}" ] || { echo "::error::RECORDED is empty: the forest fixture sorting step did not run (an earlier step failed); fix the first failed step" >&2; exit 1; }
          python3 tools/forest_host_gate.py check $RECORDED --expect-mismatch \
            --report "$GATE_OUT/forest_gate_sab.json" 2>&1 | tee "$GATE_OUT/forest_gate_sab.log"

      # The classical host gate (ols, ridge, tsvd, logistic, pca; the classical
      # host inference lane, 2026-09-13): every recording made on a GPU box
      # (Apple M4, NVIDIA H100, AMD MI300X) predicts the same bits through the
      # estimators and core host bindings built above, and each identity hash
      # equals the three committed 2026-09-14 GPU infer cells.
      - name: Classical host gate, every recorded prediction through the CPU column build
        if: always()
        run: |
          set -o pipefail
          [ "${CPU_SURFACE_MANIFEST:-}" = read ] || { echo "::error::the CPU surface manifest step did not complete (an earlier step failed), so this step has no lists to run on; fix the first failed step" >&2; exit 1; }
          columns=""
          for c in $CLASSICAL_GPU_COLUMNS; do columns="$columns --gpu-column $c"; done
          python3 tools/classical_host_gate.py check $CLASSICAL_RECORDED $columns \
            --report "$GATE_OUT/classical_gate_prod.json" 2>&1 | tee "$GATE_OUT/classical_gate_prod.log"

      # The saved-model recordings of the unrouted inference families
      # (host_surface.saved_model_recorded(): ARIMA through forecast; GMM,
      # its samples and HDBSCAN approximate_predict through mixture_infer and
      # hdbscan_infer; the GP regressor and classifier through gp_infer; the
      # IVF-Flat index and embedding table through ivf_search and
      # embedding_infer; the isolation forest through core), recorded on the
      # M4's Metal set and predicted here through the bindings built above.
      # The neural binding has no saved-model recording: its gate is the
      # covered lanes' four-column diff below, whose mlp, transformer, mamba
      # and samba infer, batch, batchscale and ragged cells a CPU column
      # asks through the public inference classes over _mojolearn_neural_host.
      - name: Saved-model host gate (forecast, mixture, GP, HDBSCAN, IVF, embedding), every recorded prediction
        if: always()
        run: |
          set -o pipefail
          [ "${CPU_SURFACE_MANIFEST:-}" = read ] || { echo "::error::the CPU surface manifest step did not complete (an earlier step failed), so this step has no lists to run on; fix the first failed step" >&2; exit 1; }
          columns=""
          for c in $CLASSICAL_GPU_COLUMNS; do columns="$columns --gpu-column $c"; done
          python3 tools/classical_host_gate.py check $SAVED_MODEL_RECORDED $columns \
            --report "$GATE_OUT/saved_model_gate_prod.json" 2>&1 | tee "$GATE_OUT/saved_model_gate_prod.log"

      # The tool loads on this CPU and the three committed GPU columns diff
      # exactly as recorded (the 2026-09-14 166-lane record at 1eea14f80, the
      # batch part and 31 par-* lanes, AMD column MI325X): 1322 comparable train cells
      # (the revised lanes' cells excluded, see the step) IDENTICAL x3 and ONE DIVERGENT, kmeans-sqrt/wide, where the H100
      # inertia stands alone (docs/lanes/BRIEF_kmeans_sqrt_wide_h100_inertia_2026-09-14.md).
      # --diff exits 1 on that cell, so the step requires exit 1 AND the exact
      # summary tokens AND that row: a second divergence, a diff that printed
      # nothing, or fewer cells changes a token and fails the step. The cell is
      # EXPLAINED AND FIXED since 9fde8f5f7 (NVIDIA's approximate sqrt in the
      # min-reduce kernels, DEVIATION 2715; that record's kmeans-sqrt labels are
      # also wrong on every column, DEVIATION 2716). These committed JSONs are
      # the 1eea14f80 bytes and keep their count; the kmeans lanes' current
      # cells are the kmeans-sqrt fix record, asserted two steps below.
      - name: Retain saved-models checkpoint
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cpu-identity-${{ matrix.slot }}-saved-models-${{ github.run_attempt }}
          path: cpu-identity-gate-out/
          if-no-files-found: warn

      - name: identity_break --diff over the three committed GPU columns (require 3)
        if: always() && env.FULL_CPU_VERIFY == 'true'
        run: |
          [ "${CPU_SURFACE_MANIFEST:-}" = read ] || { echo "::error::the CPU surface manifest step did not complete (an earlier step failed), so this step has no lists to run on; fix the first failed step" >&2; exit 1; }
          st=0
          python3 tools/identity_break.py --diff $GPU_COLUMNS --require-columns 3 \
            > "$GATE_OUT/diff_gpu3.txt" 2>&1 || st=$?
          cat "$GATE_OUT/diff_gpu3.txt"
          # Current lane revisions invalidate 19 x 9 historical cells per
          # vendor. Assert those exclusions as well as every remaining total;
          # this record cannot certify the revised lanes by its old hashes.
          # par-arima joined LANE_REVISIONS at 4459379a4 (trend-metadata-1):
          # its 9 train, 9 infer, 9 model (N/A) and 9 batch cells left the
          # comparison, 162 -> 171 excluded, 1331 -> 1322, 1701 -> 1692,
          # 963 -> 954 and 1080 -> 1071.
          [ "$(grep -c '^NOTE: column .*its 171 cell(s) there are not compared and read as absent$' "$GATE_OUT/diff_gpu3.txt")" = 3 ]
          grep -F 'summary: DIVERGENT=1, IDENTICAL=1322' "$GATE_OUT/diff_gpu3.txt"
          grep -F 'summary (infer/model): IDENTICAL=1692, N/A=954' "$GATE_OUT/diff_gpu3.txt"
          grep -F 'summary (batch): IDENTICAL=1071, N/A=252' "$GATE_OUT/diff_gpu3.txt"
          grep -E '^\| kmeans-sqrt/wide +\| DIVERGENT +\| parts differ: inertia;' "$GATE_OUT/diff_gpu3.txt"
          grep -F 'require-columns 3 over' "$GATE_OUT/diff_gpu3.txt" | grep -F ': OK'
          [ "$st" = 1 ] || { echo "expected --diff to exit 1 on the one recorded DIVERGENT cell, got $st" >&2; exit 1; }

      # The control for the step above: demanding a fourth real hash on a lane
      # no CPU column has covered must FAIL. If it passes, --require-columns
      # is not reading what it claims to.
      - name: identity_break --diff must refuse a fourth column that is not there
        if: always() && env.FULL_CPU_VERIFY == 'true'
        run: |
          set -o pipefail
          [ "${CPU_SURFACE_MANIFEST:-}" = read ] || { echo "::error::the CPU surface manifest step did not complete (an earlier step failed), so this step has no lists to run on; fix the first failed step" >&2; exit 1; }
          if python3 tools/identity_break.py --diff $GPU_COLUMNS --require-columns 4 --lanes gemm-pinned \
               > "$GATE_OUT/diff_gpu4_control.txt" 2>&1; then
            echo "control FAIL: --require-columns 4 over three columns exited 0" >&2
            exit 1
          fi
          grep -F 'REQUIRE FAIL gemm-pinned/base train' "$GATE_OUT/diff_gpu4_control.txt"
          echo "control OK: --require-columns 4 refused three columns"

      # The kmeans lanes after the kmeans-sqrt fix (DEVIATIONS 2715 and 2716,
      # bench/results/identity_break/2026-09-14_kmeans-sqrt-fix): the three fixed
      # columns diff IDENTICAL on all 72 cells, and the unfixed columns of the
      # same boxes must still read the one NVIDIA inertia cell DIVERGENT, so the
      # record cannot pass by carrying identical files.
      - name: identity_break --diff over the kmeans-sqrt fix record (fixed IDENTICAL, unfixed DIVERGENT)
        if: always() && env.FULL_CPU_VERIFY == 'true'
        run: |
          R=bench/results/identity_break/2026-09-14_kmeans-sqrt-fix
          st=0
          python3 tools/identity_break.py --diff $R/apple-m4.json $R/nvidia-h100-sm_90a.json \
            $R/amd-mi325x-gfx942.json --require-columns 3 > "$GATE_OUT/diff_kmsqrt_fixed.txt" 2>&1 || st=$?
          cat "$GATE_OUT/diff_kmsqrt_fixed.txt"
          [ "$st" = 0 ] || { echo "fixed kmeans columns: --diff exited $st" >&2; exit 1; }
          grep -F 'summary: IDENTICAL=72' "$GATE_OUT/diff_kmsqrt_fixed.txt"
          grep -F 'require-columns 3 over' "$GATE_OUT/diff_kmsqrt_fixed.txt" | grep -F ': OK'
          st=0
          python3 tools/identity_break.py --diff $R/unfixed/apple-m4.json $R/unfixed/nvidia-h100-sm_90a.json \
            $R/unfixed/amd-mi325x-gfx942.json $R/unfixed/nvidia-rtx-4090-sm_89.json --require-columns 4 \
            > "$GATE_OUT/diff_kmsqrt_unfixed.txt" 2>&1 || st=$?
          cat "$GATE_OUT/diff_kmsqrt_unfixed.txt"
          grep -F 'summary: DIVERGENT=1, IDENTICAL=8' "$GATE_OUT/diff_kmsqrt_unfixed.txt"
          grep -E '^\| kmeans-sqrt/wide +\| DIVERGENT +\| parts differ: inertia; agree: centers,labels,scales' "$GATE_OUT/diff_kmsqrt_unfixed.txt"
          [ "$st" = 1 ] || { echo "unfixed kmeans-sqrt columns: expected --diff to exit 1, got $st" >&2; exit 1; }

      # THE FOURTH COLUMN, THE PLUMBING SMOKE. Two lanes, one fixture, one
      # repeat, on this CPU, through the CPU-only package. Every cell must
      # exist and read REFUSED with the by-name sentence (or STABLE if the lane
      # is in COVERED_LANES); the vendor label must be the derived cpu-<model>;
      # the commit must be this workflow's SHA; host.column must be cpu and
      # both host bindings must appear in host.families as cpu. A JSON with no
      # cell fails.
      - name: The CPU column, plumbing smoke (two lanes, one fixture)
        if: always()
        timeout-minutes: 20
        run: |
          set -o pipefail
          [ "${CPU_SURFACE_MANIFEST:-}" = read ] || { echo "::error::the CPU surface manifest step did not complete (an earlier step failed), so this step has no lists to run on; fix the first failed step" >&2; exit 1; }
          # The smoke runs two lanes, so it judges only those two as covered:
          # the checker fails any --covered lane with no cell, and the full
          # COVERED_LANES list is the next step's. Both must be covered lanes.
          SMOKE_LANES=gemm-pinned,kde
          for lane in ${SMOKE_LANES//,/ }; do
            case ",$COVERED_LANES," in *",$lane,"*) ;; *) echo "smoke lane $lane is not in COVERED_LANES" >&2; exit 1 ;; esac
          done
          python3 tools/identity_break.py --lanes "$SMOKE_LANES" --fixtures base --repeats 1 \
            --json "$GATE_OUT/cpu-smoke-${{ matrix.slot }}.json" 2>&1 | tee "$GATE_OUT/cpu_smoke.log"
          python3 tools/cpu_identity_gate_check.py column "$GATE_OUT/cpu-smoke-${{ matrix.slot }}.json" \
            --covered "$SMOKE_LANES" --commit "$MOJOLEARN_COMMIT" \
            --binding "$ALL_HOST_BINDINGS" 2>&1 | tee "$GATE_OUT/cpu_smoke_check.log"

      # THE FOURTH COLUMN, THE COVERED LANES. Every fixture, two repeats, then
      # the four-way diff with --require-columns 4 on exactly those lanes.
      # The lanes run as GATE_SHARDS parallel identity_break processes joined
      # by identity_break --merge (tools/cpu_identity_gate_check.py
      # run-column, 2026-09-15): at 2cf5562b1 one process took 24 to 30
      # minutes per step and two runners hit the job's 60-minute limit (run
      # 34956243867). Every lane still runs every fixture and repeat; the
      # merge refuses parts that ran a different machine, commit, fixture set
      # or host binding bytes, and any shard exiting non-zero fails the step.
      # The diffs read
      # RECORD_COVERED_LANES against GPU_COLUMNS, and FIX_COVERED_LANES (the
      # covered lanes whose record cells predate a fix on every column,
      # kmeans-sqrt) against FIX_COLUMNS, the same boxes after the fix
      # (python/mojolearn/host_surface.py, TRAINING_FIX_LANES).
      # Empty COVERED_LANES runs nothing and says so; that is a statement about
      # phase 1, not a pass.
      - name: The CPU column, covered lanes (every fixture)
        if: always() && env.FULL_CPU_VERIFY == 'true'
        timeout-minutes: 120
        run: |
          set -o pipefail
          [ "${CPU_SURFACE_MANIFEST:-}" = read ] || { echo "::error::the CPU surface manifest step did not complete (an earlier step failed), so this step has no lists to run on; fix the first failed step" >&2; exit 1; }
          if [ -z "$COVERED_LANES" ]; then
            echo "no identity_break lane has a CPU implementation yet (COVERED_LANES is empty); phase 1 of docs/lanes/BRIEF_cpu_training_2026-09-13.md adds the first (gemm-pinned). Nothing run, nothing certified." | tee "$GATE_OUT/cpu_column.log"
            exit 0
          fi
          python3 tools/cpu_identity_gate_check.py run-column --lanes "$COVERED_LANES" --shards "$GATE_SHARDS" \
            --json "$GATE_OUT/cpu-${{ matrix.slot }}.json" 2>&1 | tee "$GATE_OUT/cpu_column.log"
          python3 tools/cpu_identity_gate_check.py column "$GATE_OUT/cpu-${{ matrix.slot }}.json" \
            --covered "$COVERED_LANES" --commit "$MOJOLEARN_COMMIT" \
            --binding "$ALL_HOST_BINDINGS" 2>&1 | tee "$GATE_OUT/cpu_column_check.log"
          # OWED (lane/cpu-gate-owed-cells, 2026-09-15): GPU records are taken
          # only at PyPI releases, so a cell part no committed GPU record
          # hashes yet (absent, n/a, a lane not in the record) reads OWED xK
          # instead of failing --require-columns 4, derived by --owed-json and
          # never listed by hand. It must be STABLE on this CPU, agree with
          # every column that has it (a recorded hash that differs is still
          # DIVERGENT, a REFUSED column still fails) and move under the
          # sabotage host set (the owed check in the sabotage step).
          python3 tools/identity_break.py --diff $GPU_COLUMNS "$GATE_OUT/cpu-${{ matrix.slot }}.json" \
            --require-columns 4 --lanes "$RECORD_COVERED_LANES" --owed-json "$GATE_OUT/owed_cells.json" \
            2>&1 | tee "$GATE_OUT/diff_four_columns.txt"
          grep -E '^summary' "$GATE_OUT/diff_four_columns.txt" | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$FIX_COVERED_LANES" ]; then
            python3 tools/identity_break.py --diff $FIX_COLUMNS "$GATE_OUT/cpu-${{ matrix.slot }}.json" \
              --require-columns 4 --lanes "$FIX_COVERED_LANES" --owed-json "$GATE_OUT/owed_cells_fix.json" \
              2>&1 | tee "$GATE_OUT/diff_four_columns_fix.txt"
            grep -E '^summary' "$GATE_OUT/diff_four_columns_fix.txt" | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
          fi

      # The covered lanes' negative control (brief section 3.4). A gate that
      # cannot fail proves nothing, so the whole host set is built again with
      # -D MOJOLEARN_HOST_SABOTAGE=1 into its own directory (honored in
      # gemm_oracle by walking every leaf DESCENDING, which reaches every
      # lane whose host oracle folds through gemm_oracle_cell, and in
      # kde_oracle by summing every logsumexp row descending from one extra
      # unit (the tophat kernel sums exact integers), in hw_oracle
      # by splitting the SSE fused multiply-add, in smo_oracle by walking
      # its GEMM leaf descending, in linkage_oracle by walking the sorted
      # edge keys descending (the maximum spanning tree), in pcg_rng by one
      # extra draw on every keyed stream (every ExtraTrees threshold), and
      # in xorwow by one extra step before every split fraction (every
      # isolation tree, in kmeans_oracle by one extra unit in every
      # quantized centroid-sum cell, in metrics_oracle by shifting every
      # slab tree's chunk boundaries by one value (classification_oracle's
      # log loss, regression errors and KL divergence fold through it), in spectral_oracle by
      # seeding the recluster one draw off, in scaler_oracle by the same
      # shifted tree plus the min-max offset's subtraction as an addition,
      # in qn_oracle by walking the solver's dot chains descending, in
      # kpss_oracle by walking every strided series partial descending, in
      # knn_host_predict by walking the unexpanded, cosine and ball cover
      # distance chains descending (Chebyshev: the next float above the
      # maximum), in dbscan_oracle by one more neighbor or unit of weight
      # to be core, in
      # pca_full_oracle by folding every QR trailing-column dot product's
      # lanes serially descending, in
      # mlp_oracle by walking every MLP row sum descending, in
      # rf_oracle by drawing every bootstrap row from the next Philox
      # subsequence and seeding every node's column sample one off, in gpr_oracle by walking the scaled distance's
      # feature axis descending, in gbdt_oracle by adding 1.0 to the
      # Newton leaf walker's Hessian regularizer, in gbdt_oracle_rmse by
      # adding 1.0 to the searcher's leaf regularizer, in arima_oracle by
      # doubling the finite-difference step, in umap_oracle by keying
      # every negative draw one epoch late, in resample_host by shifting
      # every per-replicate and per-chunk tree's chunk boundaries by one
      # value, and in hdbscan_host_oracle by reading every core distance one
      # neighbor early; the kernel_methods and mixture host families move
      # through gemm_oracle's descending leaf);
      # each further phase 1
      # binding names the fold its arm moves), loaded through
      # MOJOLEARN_HOST_DIR with MOJOLEARN_HOST_ALLOW_SABOTAGE=1, run on the
      # covered lanes (all nine fixtures, two repeats in both arms;
      # sharded as above; the build is its own step since
      # 2026-09-15 so the run step's time is the lanes'), and the four-way
      # diff must exit non-zero with
      # DIVERGENT on them. Covered cells must be STABLE or carry an explicit
      # oracle failure with repeated measured bytes and native sabotage
      # readback; a refusal is never a catch. A fixture on which the moved fold is exact
      # (gemm-pinned/ties, an integer grid) stays IDENTICAL; the requirement
      # is DIVERGENT in the summary, not on every cell. Empty COVERED_LANES
      # skips it with the same statement as above.
      - name: Retain clean-column checkpoint
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cpu-identity-${{ matrix.slot }}-clean-column-${{ github.run_attempt }}
          path: cpu-identity-gate-out/
          if-no-files-found: warn

      - name: Build the sabotage host set (MOJOLEARN_HOST_SABOTAGE)
        if: always()
        timeout-minutes: 20
        env:
          MOJOLEARN_BYTE_LM_HOST_OUTDIR: ${{ runner.temp }}/host-sab
          MOJOLEARN_FOREST_HOST_OUTDIR: ${{ runner.temp }}/host-sab
          # The phase 1 build scripts read MOJOLEARN_HOST_OUTDIR when their
          # own MOJOLEARN_<FAMILY>_HOST_OUTDIR is unset.
          MOJOLEARN_HOST_OUTDIR: ${{ runner.temp }}/host-sab
        run: |
          set -o pipefail
          [ "${CPU_SURFACE_MANIFEST:-}" = read ] || { echo "::error::the CPU surface manifest step did not complete (an earlier step failed), so this step has no lists to run on; fix the first failed step" >&2; exit 1; }
          if [ -z "$COVERED_LANES" ]; then
            echo "no covered lane, no sabotage host set to build (COVERED_LANES is empty)"
            exit 0
          fi
          command -v pixi >/dev/null || { echo "::error::pixi is not on PATH: the setup-pixi step did not run (an earlier step failed); fix the first failed step" >&2; exit 1; }
          rm -rf "${{ runner.temp }}/host-sab"
          # SABOTAGE_FAMILIES is BUILD_FAMILIES (the manifest step checked
          # both). MOJOLEARN_HOST_DIR has no fallback, and a binding absent
          # from host-sab would load nothing. Each family's defines come from
          # the manifest (host_surface.sabotage_build_defines): -D
          # MOJOLEARN_HOST_SABOTAGE=1 for all, plus the tokenizer's own define
          # and the forest's CTR arm (GATE_SABOTAGE_OWN_DEFINES), which the
          # tokenizer and CTR table lanes rest on. byte_lm also carries its
          # native sabotage marker and needs its own loader opt-in below.
          for family in $SABOTAGE_FAMILIES; do
            defines="$(python3 $MOJOLEARN_HOST_SURFACE --sabotage-build-defines "$family")"
            echo "sabotage build $family: $defines"
            MOJOLEARN_BUILD_EXTRA_DEFINES="$defines" MOJOLEARN_BUILD_JOBS=2 sh "bindings/build_${family}_host.sh" 2>&1 | tee "$GATE_OUT/build_${family}_host_sab.log"
          done

      - name: The CPU column, covered lanes must diverge under MOJOLEARN_HOST_SABOTAGE
        if: always() && env.FULL_CPU_VERIFY == 'true'
        timeout-minutes: 120
        run: |
          set -o pipefail
          [ "${CPU_SURFACE_MANIFEST:-}" = read ] || { echo "::error::the CPU surface manifest step did not complete (an earlier step failed), so this step has no lists to run on; fix the first failed step" >&2; exit 1; }
          if [ -z "$COVERED_LANES" ]; then
            echo "no covered lane, no sabotage arm to run (COVERED_LANES is empty)" | tee "$GATE_OUT/cpu_sabotage.log"
            exit 0
          fi
          # Every built binding must be in the sabotage set: a missing one would
          # load nothing and read REFUSED, which the diff below would count as
          # a catch.
          for b in ${ALL_HOST_BINDINGS//,/ }; do
            [ -f "${{ runner.temp }}/host-sab/$b.so" ] || { echo "the sabotage host set lacks $b.so" >&2; exit 1; }
          done
          export MOJOLEARN_HOST_DIR="${{ runner.temp }}/host-sab" MOJOLEARN_HOST_ALLOW_SABOTAGE=1
          export MOJOLEARN_BYTE_LM_HOST_BINARY="${{ runner.temp }}/host-sab/_mojolearn_byte_lm_host.so" MOJOLEARN_BYTE_LM_HOST_ALLOW_SABOTAGE=1
          # The CTR table lanes predict through _forest_host, which loads
          # MOJOLEARN_FOREST_HOST_BINARY (else the package's production file);
          # host_record has already loaded host-sab's forest binding under the
          # same module name, so both must name that file, or the lanes'
          # binary guard refuses them.
          export MOJOLEARN_FOREST_HOST_BINARY="${{ runner.temp }}/host-sab/_mojolearn_forest_host.so" MOJOLEARN_FOREST_HOST_ALLOW_SABOTAGE=1
          # --production: a covered cell the sabotage build makes the lane
          # itself refuse (run 35636551982: rf-score-weighted's weights,
          # spectral-precomputed's k-means) counts as caught only when the
          # production column hashes that cell STABLE (caught_refusals).
          python3 tools/cpu_identity_gate_check.py run-column --sabotage --lanes "$COVERED_LANES" --shards "$GATE_SHARDS" \
            --production "$GATE_OUT/cpu-${{ matrix.slot }}.json" \
            --json "$GATE_OUT/cpu-sab-${{ matrix.slot }}.json" -- --repeats 2 2>&1 | tee "$GATE_OUT/cpu_sabotage.log"
          python3 tools/cpu_identity_gate_check.py column "$GATE_OUT/cpu-sab-${{ matrix.slot }}.json" \
            --sabotage --production "$GATE_OUT/cpu-${{ matrix.slot }}.json" \
            --covered "$COVERED_LANES" --commit "$MOJOLEARN_COMMIT" 2>&1 | tee "$GATE_OUT/cpu_sabotage_check.log"
          if python3 tools/identity_break.py --diff $GPU_COLUMNS "$GATE_OUT/cpu-sab-${{ matrix.slot }}.json" \
               --require-columns 4 --lanes "$RECORD_COVERED_LANES" > "$GATE_OUT/diff_four_columns_sab.txt" 2>&1; then
            echo "SABOTAGE NOT CAUGHT: the sabotage host set diffed IDENTICAL against the GPU columns" >&2
            exit 1
          fi
          grep -E '^summary: .*DIVERGENT=[1-9][0-9]*([[:space:],]|$)' "$GATE_OUT/diff_four_columns_sab.txt"
          if [ -n "$FIX_COVERED_LANES" ]; then
            if python3 tools/identity_break.py --diff $FIX_COLUMNS "$GATE_OUT/cpu-sab-${{ matrix.slot }}.json" \
                 --require-columns 4 --lanes "$FIX_COVERED_LANES" > "$GATE_OUT/diff_four_columns_fix_sab.txt" 2>&1; then
              echo "SABOTAGE NOT CAUGHT: the sabotage host set diffed IDENTICAL against the fix columns on $FIX_COVERED_LANES" >&2
              exit 1
            fi
            grep -E '^summary: .*DIVERGENT=[1-9][0-9]*([[:space:],]|$)' "$GATE_OUT/diff_four_columns_fix_sab.txt"
          fi
          # Every OWED cell part the production diffs listed must MOVE between
          # the production and sabotage CPU columns: no GPU hash stands behind
          # it, so the sabotage arm is its only negative control.
          for owed in "$GATE_OUT/owed_cells.json" $([ -n "$FIX_COVERED_LANES" ] && echo "$GATE_OUT/owed_cells_fix.json"); do
            python3 tools/cpu_identity_gate_check.py owed "$owed" \
              --production "$GATE_OUT/cpu-${{ matrix.slot }}.json" --sabotage "$GATE_OUT/cpu-sab-${{ matrix.slot }}.json" \
              2>&1 | tee -a "$GATE_OUT/owed_sabotage_check.log"
          done
          echo "sabotage caught on the covered lanes"

      # The same sabotage host set (built by the step above into host-sab)
      # must make the classical gate say so on every recording.
      - name: Retain fault-column checkpoint
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cpu-identity-${{ matrix.slot }}-fault-column-${{ github.run_attempt }}
          path: cpu-identity-gate-out/
          if-no-files-found: warn

      - name: Classical host gate, the sabotage build must be caught
        if: always()
        env:
          MOJOLEARN_HOST_DIR: ${{ runner.temp }}/host-sab
          MOJOLEARN_HOST_ALLOW_SABOTAGE: "1"
        run: |
          set -o pipefail
          [ "${CPU_SURFACE_MANIFEST:-}" = read ] || { echo "::error::the CPU surface manifest step did not complete (an earlier step failed), so this step has no lists to run on; fix the first failed step" >&2; exit 1; }
          [ -f "$MOJOLEARN_HOST_DIR/_mojolearn_estimators_host.so" ] || { echo "no sabotage estimators host binding under $MOJOLEARN_HOST_DIR" >&2; exit 1; }
          python3 tools/classical_host_gate.py check $CLASSICAL_RECORDED --expect-mismatch \
            --report "$GATE_OUT/classical_gate_sab.json" 2>&1 | tee "$GATE_OUT/classical_gate_sab.log"

      # The same sabotage host set must move EVERY fixture of EVERY saved-model
      # lane (--every-fixture): one moved family or fixture must not hide one
      # that did not. Until lane/ties-sabotage (2026-09-15) ivf/ties and
      # ivf-euclidean/ties stayed EQUAL (an exact integer fold), so the rule
      # was one fixture per lane; the IVF value arm moves them now.
      - name: Saved-model host gate, the sabotage build must be caught on every fixture
        if: always()
        env:
          MOJOLEARN_HOST_DIR: ${{ runner.temp }}/host-sab
          MOJOLEARN_HOST_ALLOW_SABOTAGE: "1"
        run: |
          set -o pipefail
          [ "${CPU_SURFACE_MANIFEST:-}" = read ] || { echo "::error::the CPU surface manifest step did not complete (an earlier step failed), so this step has no lists to run on; fix the first failed step" >&2; exit 1; }
          for b in _mojolearn_forecast_host _mojolearn_mixture_infer_host _mojolearn_gp_infer_host \
                   _mojolearn_hdbscan_infer_host _mojolearn_ivf_search_host _mojolearn_embedding_infer_host; do
            [ -f "$MOJOLEARN_HOST_DIR/$b.so" ] || { echo "no sabotage $b under $MOJOLEARN_HOST_DIR" >&2; exit 1; }
          done
          python3 tools/classical_host_gate.py check $SAVED_MODEL_RECORDED --expect-mismatch --every-fixture \
            --report "$GATE_OUT/saved_model_gate_sab.json" 2>&1 | tee "$GATE_OUT/saved_model_gate_sab.log"

      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cpu-identity-gate-${{ matrix.slot }}
          path: cpu-identity-gate-out/
          if-no-files-found: warn
