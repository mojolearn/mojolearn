      - "gaussian_process/host/gpr_oracle.mojo"
      - "cholesky/host/chol_oracle.mojo"
      - "gbdt/host/gbdt_oracle.mojo"
      - "gbdt/host/gbdt_oracle_rmse.mojo"
      - "gbdt/host/gbdt_oracle_depthwise.mojo"
      - "gbdt/host/gbdt_oracle_lossguide.mojo"
      - "gbdt/host/gbdt_oracle_losses.mojo"
      - "gbdt/host/gbdt_oracle_multiclass.mojo"
