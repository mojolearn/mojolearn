# CPU identity gate (the CPU training lane, 2026-09-13; brief
# docs/lanes/BRIEF_cpu_training_2026-09-13.md section 3.4) on GitHub's free
# standard runners: ARM64 Linux (Azure Cobalt 100), x86-64 Linux and Apple M1
# macOS, the byte LM CPU gate's matrix. This is the FOURTH COLUMN of
# tools/identity_break.py, a CPU beside the three committed GPU columns
# python/mojolearn/host_surface.py names as TRAINING_GPU_COLUMNS (the record
# directory the GPU_COLUMNS step reads; 2026-09-13_three-columns was the
# first, it is not the one diffed now).
#
# What it proves on each runner, and nothing more. Every host binding the
# manifest declares (python/mojolearn/host_surface.py lists the families, a
# count written here went stale twice on 2026-09-14; each builds through bindings/build_<family>_host.sh)
# ON THAT RUNNER with no accelerator target as the kernel matrix's CPU column
# (checks/kernel_matrix.mojo COLUMN_CPU; each binding asserts it at build time
# and reads it back). The checkout's package takes the CPU-only path
# (vendor() is cpu). The forest host binding reproduces every RECORDED
# forest and GBDT prediction (tools/forest_host_gate.py check) and a sabotage
# build of it is caught. tools/identity_break.py loads on the CPU, diffs the
# three committed GPU columns to IDENTICAL x3 on every train cell (the count
# the diff step greps), and, run on
# this runner, writes a CPU column whose provenance is derived (vendor
# cpu-<cpu model slug>, commit = the workflow's SHA, host.column cpu) and
# whose cells read REFUSED BY NAME for every lane without a CPU
# implementation and STABLE for every lane in COVERED_LANES.
#
# COVERED_LANES is the list of identity_break lanes that have a CPU
# implementation, and HOST_FAMILIES the phase 1 host bindings that serve them
# (bindings/build_<family>_host.sh, routed by _backend._HOST_MODULES). Both
# are READ FROM python/mojolearn/host_surface.py (the host surface manifest
# lane, 2026-09-14); a host lane adds its family and lanes there and this
# file follows. Were the list empty the "covered" steps would say so and run
# nothing; that is not a pass, it is a statement. The smoke step runs regardless and FAILS if the run
# produces no cell, a cell that is not the refusal by name, a vendor label
# that is not derived, or an empty commit.
#
# A green job enters the brief's certified table only after its uploaded
# JSON is read and its host.cpu_model names the CPU; the job summary is not
# the record.

name: CPU identity gate

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "lane/cpu-training-phase0"
      - "lane/cpu-training-*"
    paths:
      - "checks/kernel_matrix.mojo"
      - "checks/hardware_matrix.mojo"
      - "checks/numerics.mojo"
      - "bindings/_mojolearn_byte_lm_host.mojo"
      - "bindings/_mojolearn_forest_host.mojo"
      - "bindings/_mojolearn_*_host.mojo"
      - "bindings/build_host_family.sh"
      - "bindings/build_*_host.sh"
      - "python/mojolearn/host_surface.py"
      - "python/mojolearn/_metrics_impl.py"
      - "python/mojolearn/tests/test_classification_metrics.py"
      - "python/mojolearn/tests/test_regression_metrics.py"
      - "gemm/host/gemm_oracle.mojo"
      - "kde/host/kde_oracle.mojo"
      - "holtwinters/host/hw_oracle.mojo"
      - "solver/host/cd_oracle.mojo"
      - "solver/checks/profile_dot.mojo"
      - "svm/host/smo_oracle.mojo"
      - "bindings/host_helpers.mojo"
      - "bindings/hostptr.mojo"
