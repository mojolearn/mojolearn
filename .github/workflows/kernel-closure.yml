name: Kernel closure compiles without Python

# The compile proof (Andrew, 2026-10-21: "strip the python import and see if it
# compiles"). tools/kernel_closure_check.py writes one program that imports
# every kernel module (every .mojo outside bindings/, *pyapi*.mojo, *_py.mojo,
# bench/, experiments/ and checks/ that has no main), copies the tree with the
# Python-reaching shells deleted and every Python import line removed, builds
# the program for the CPU target (no accelerator), checks the binary has no
# undefined CPython symbol and no libpython dependency, and runs it once.
# The generated .mojo, the build log and summary.json are kept as an artifact.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Commit to check (default the dispatched ref)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: kernel-closure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel-closure:
    name: kernel-closure
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          run-install: true
          environments: default
      - name: Static pass tests
        run: python3 -u tools/test_kernel_closure_check.py
      - name: Build every kernel module with Python stripped (45-minute budget)
        run: |
          set -eu
          mkdir -p kernel-closure-results
          rc=0
          pixi run python tools/kernel_closure_check.py --out "$PWD/kernel-closure-results" --timeout 2700 \
            2> kernel-closure-results/controller.log || rc=$?
          tail -n 40 kernel-closure-results/controller.log >&2
          {
            echo '### kernel-closure'
            echo '```'
            head -n 1 kernel-closure-results/controller.log
            grep -E '^(kernel_closure_check: [a-z0-9]|KERNEL_CLOSURE)' kernel-closure-results/controller.log | tail -n 8
            echo '```'
            if [ -f kernel-closure-results/build.log ]; then
              echo 'First compile errors:'
              echo '```'
              grep -m 20 -A 3 'error' kernel-closure-results/build.log || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: Keep the generated program, build log and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-closure-${{ github.run_id }}
          path: |
            kernel-closure-results/kernel_closure_main.mojo
            kernel-closure-results/*.log
            kernel-closure-results/summary.json
          if-no-files-found: warn
          retention-days: 30
