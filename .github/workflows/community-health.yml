name: Community health

on:
  # LIGHT TOUCH (Andrew, Sep 15 2026): this workflow never starts by itself. Every job
  # is skipped unless the dispatch input confirm is RUN-HEAVY, so a wrong trigger costs nothing.
  workflow_dispatch:
    inputs:
      confirm:
        description: "Heavy run on paid or queued runners. Type RUN-HEAVY to really run it; anything else skips every job"
        required: true
        default: ""
        type: string

permissions: {}

jobs:
  diagnostics:
    if: inputs.confirm == 'RUN-HEAVY'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Syntax
        run: python -m py_compile python/mojolearn_diagnostics.py
      - name: Doctor works without an installed native package
        run: |
          set +e
          python python/mojolearn_diagnostics.py doctor --json > doctor.json
          status=$?
          set -e
          test "$status" -eq 1
          python -c 'import json; d=json.load(open("doctor.json")); assert d["distributions"]["mojolearn"] is None; assert d["privacy"]["policy"] == "allowlist"'
      - name: Support bundle is complete and path-safe
        run: |
          echo 'print("minimal reproducer")' > reproduce.py
          python python/mojolearn_diagnostics.py bug-report reproduce.py --output report.zip
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile("report.zip") as archive:
              names = set(archive.namelist())
              required = {
                  "mojolearn-bug-report/README.txt",
                  "mojolearn-bug-report/doctor.json",
                  "mojolearn-bug-report/doctor.txt",
                  "mojolearn-bug-report/manifest.json",
                  "mojolearn-bug-report/reproducer.py",
              }
              assert required <= names, names
              text = archive.read("mojolearn-bug-report/doctor.json").decode()
              assert "/home/runner" not in text
          PY
