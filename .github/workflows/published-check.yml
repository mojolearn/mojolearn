# Published check (post stage of a release; Andrew, 2026-11-27): ONE CPU job on a free GitHub runner that the
# release on PyPI is the tested candidate. tools/release.py step_published dispatches it after publication, waits,
# downloads the `published-check` artifact and judges its report. No GPU, nothing rented: the published bytes are
# hash-identical to the candidate the gates tested, so a GPU rerun would prove nothing new.
#
# tools/release_published_install.py check, in order: every candidate file (core, vendor and macOS wheels) listed
# by PyPI and downloaded as a file by its own platform tags, sha256 equal to the candidate's; `pip install
# mojolearn==<version>` into a fresh venv; `import mojolearn`; `python -m mojolearn verify --quick`.
#
# Dispatch by hand (normally tools/release.py does this):
#   gh workflow run published-check.yml --ref main -f version=0.9.1 -f candidates='{"<wheel>": "<sha256>", ...}'

name: Published check

on:
  workflow_dispatch:
    inputs:
      version:
        description: "the published version"
        required: true
      candidates:
        description: "JSON {wheel file name: sha256} of every candidate wheel the release published"
        required: true
      python:
        description: "Python version"
        required: false
        default: "3.12"
      token:
        description: "a label the dispatcher finds its run by"
        required: false
        default: ""

run-name: "published-check ${{ inputs.version }} ${{ inputs.token }}"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ inputs.python }}
      - name: Check the published release
        env:
          VERSION: ${{ inputs.version }}
          CANDIDATES: ${{ inputs.candidates }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '%s' "$CANDIDATES" > "$RUNNER_TEMP/candidates.json"
          python tools/release_published_install.py check --version "$VERSION" \
            --candidates "$RUNNER_TEMP/candidates.json" --python "$(command -v python)" --runner "$RUN_URL" \
            --out "$RUNNER_TEMP/published-check"
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: published-check
          path: ${{ runner.temp }}/published-check
          if-no-files-found: error
