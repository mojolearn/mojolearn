name: No host routes

# The one check that runs by itself (2026-10-02, Andrew: close the GitHub
# merge loophole; code enforcement, not rules). tools/hooks/no_host_routes.py
# --tree scans every file a GPU install runs at the checked commit and fails on
# CPU work in GPU code that is not in tools/hooks/host_routes_baseline.tsv, or
# on a baseline row that no longer matches (the baseline only shrinks). Python
# only, no build, seconds. The main ruleset requires the `no-host-routes`
# check before a PR merges; a push to main that skipped the local hook turns
# red here. The debt per class and per owner goes to the job summary.
# `gh workflow run no-host-routes.yml -f pr=N` checks an open PR that has had
# no event since the check went in and posts the result on its head commit.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to check (posts the status on its head)
        required: false
        default: ""

permissions:
  contents: read
  statuses: write

concurrency:
  group: no-host-routes-${{ github.event.pull_request.number || inputs.pr || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  no-host-routes:
    name: no-host-routes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: No CPU work in GPU code beyond the shrinking baseline
        env:
          PR: ${{ inputs.pr }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          tip=$(git rev-parse HEAD)
          if [ -n "$PR" ]; then
            git fetch -q origin "+refs/pull/$PR/head:refs/remotes/pr/$PR"
            tip=$(git rev-parse "refs/remotes/pr/$PR")
          fi
          # main's checker judges every branch: a branch that predates it, or
          # edits it, is still checked by the code on main
          git show origin/main:tools/hooks/no_host_routes.py > "$RUNNER_TEMP/no_host_routes.py"
          state=success
          python3 "$RUNNER_TEMP/no_host_routes.py" --tree "$tip" 2> nhr.log || state=failure
          cat nhr.log >&2
          { echo '### no-host-routes'; echo '```'; cat nhr.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PR" ]; then
            gh api "repos/$REPO/statuses/$tip" -f state=$state -f context=no-host-routes \
              -f description="no CPU work in GPU code beyond the baseline" \
              -f target_url="$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID" >/dev/null
          fi
          [ $state = success ]
      - name: Checker tests
        if: ${{ inputs.pr == '' }}
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@localhost
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@localhost
        run: |
          if [ -f tools/hooks/test_no_host_routes.py ]; then
            python3 tools/hooks/test_no_host_routes.py
          fi
