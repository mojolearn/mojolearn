name: Light checks

# LIGHT TOUCH (Andrew, Sep 15 2026): the ONLY workflow that runs by itself.
# One Linux runner, Python only, no Mojo build, no bindings, no matrix, a hard
# ten minute cap. Everything heavy is manual with confirm RUN-HEAVY.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: light-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  light:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Generated doc facts agree with the code
        run: python3 tools/docs_facts.py --check
      - name: Build scripts pin both CPU baselines
        run: python3 packaging/wheel_ci.py pins .
      - name: Every packaged module is reachable by import
        run: python3 packaging/wheel_ci.py inventory python/mojolearn
      - name: No source pattern that is always a bug
        run: python3 tools/source_hygiene_check.py
      - name: No fixture shrunk below its declared floor
        # A floor recorded in prose is not a floor: on 2026-09-16 one was
        # written down, overridden by the next lane and then recorded as kept
        # by a third document. --self-test runs first so a check that cannot
        # refuse anything fails here rather than passing quietly.
        run: |
          python3 tools/fixture_floors.py --self-test
          python3 tools/fixture_floors.py
      - name: Every workflow parses, and only this one starts by itself
        run: |
          python3 -m venv /tmp/yaml-venv
          /tmp/yaml-venv/bin/pip install --quiet pyyaml==6.0.2
          /tmp/yaml-venv/bin/python - <<'PY'
          import glob, sys, yaml
          bad = []
          for f in sorted(glob.glob(".github/workflows/*.yml")):
              d = yaml.safe_load(open(f))
              on = d.get(True, d.get("on"))
              auto = sorted(set(on) & {"push", "schedule"}) if isinstance(on, dict) else []
              name = f.rsplit("/", 1)[-1]
              if auto and name not in ("light-checks.yml", "issue-hygiene.yml"):
                  bad.append(f"{name} starts by itself on {auto}")
          print("\n".join(bad) or "ok: only light-checks (and the daily issue bot) start by themselves")
          sys.exit(1 if bad else 0)
          PY
      - name: Scheduler and checkpoint regressions (CPU only, no bindings)
        run: |
          /tmp/yaml-venv/bin/pip install --quiet pytest==8.3.5 numpy==2.2.6
          /tmp/yaml-venv/bin/python -m pytest -q tools/test_mac_slot.py tools/test_identity_runtime.py tools/test_algorithm_scope.py tools/test_cpu_identity_gate.py tools/test_backend_control.py tools/test_gate_scope.py tools/test_lane_select.py::test_runtime_controls_do_not_trigger_numerical_sweep tools/test_lane_select.py::test_the_selector_is_not_imported_by_what_it_selects tools/test_check_light_release.py
      - name: Every lane is accounted for, and no public algorithm is laneless
        # Three lanes added since v0.8.8 were in NEITHER the shipped table nor
        # PUBLIC_PENDING_LANES on 2026-09-20. Each mechanism refused them for
        # a correct reason and handed them to the other, so nothing failed and
        # nothing counted. The same file also counts the 70 lanes the shipped
        # verifier does not run (55 of them by prefix, which no list can see)
        # and the public algorithms with no lane at all.
        #
        # IT RUNS ON THE VENV PYTHON, NOT THE SYSTEM ONE. Two of its
        # cross-checks import the harness, which needs numpy: under a bare
        # python3 they report themselves SKIPPED and the step still passes,
        # which is a check quietly not running. --self-test runs first, for
        # the same reason it does above.
        run: |
          /tmp/yaml-venv/bin/python tools/lane_accounting.py --self-test
          /tmp/yaml-venv/bin/python tools/lane_accounting.py --check
