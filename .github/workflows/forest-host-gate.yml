# Forest host inference gate (the forest host lane, 2026-09-13) on GitHub's
# free standard runners: ARM64 Linux (Azure Cobalt 100), x86-64 Linux and
# Apple M1 macOS, the byte LM CPU gate's matrix.
#
# What it proves on each runner, and nothing more: the forest host binding
# built ON THAT RUNNER (bindings/build_forest_host.sh, no accelerator target)
# reproduces, for every RECORDED fixture under bench/results/forest_host/,
# the SHA-256 of the predictions a GPU box recorded for the same saved model
# and the same regenerated rows (tools/forest_host_gate.py check), and a build
# that divides the vote by the wrong tree count and seeds the GBDT cursor at
# bias + 1 (MOJOLEARN_FOREST_HOST_SABOTAGE) fails the same comparison. No GPU
# is used or wanted. The fixtures are forests (RF, ET) and, since the GBDT
# host lane of 2026-09-13, GradientBoosting models of all three tree shapes.
#
# THE GPU-SIDE RECORDINGS ARE OWED. Only the Apple Metal recording made on the
# lane's Mac exists today; the NVIDIA and AMD fixture directories hold an
# expected.json whose status is OWED and no model.npz. The step "Owed
# recordings must exist" runs the gate over those directories and FAILS THIS
# WORKFLOW (exit 2) until `tools/forest_host_gate.py record` has been run on
# a box of each vendor and the results committed. That failure is the point.
# Nothing here invents a hash.
#
# A green "recorded fixtures" step is evidence for the brief's certified table
# only after its uploaded report is read; the job summary is not the record.

name: Forest host gate

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "lane/forest-host-inference"
    paths:
      - "core/forest_host_predict.mojo"
      - "core/gbdt_host_predict.mojo"
      - "gbdt/gpu_data/grid_policy.mojo"
      - "gbdt/gpu_data/gpu_structures.mojo"
      - "gbdt/gpu_data/compressed_index_builder.mojo"
      - "gbdt/data/quantization.mojo"
      - "gbdt/grid_creator/binarization.mojo"
      - "gbdt/options/data_processing_options.mojo"
      - "bindings/host_helpers.mojo"
      - "bindings/hostptr.mojo"
      - "bindings/_mojolearn_forest_host.mojo"
      - "bindings/build_forest_host.sh"
      - "ensemble/decisiontree/decisiontree.mojo"
      - "ensemble/flatnode.mojo"
      - "extratrees/impl/decisiontree/flatnode.mojo"
      - "checks/numerics.mojo"
      - "python/mojolearn/_forest_host.py"
      - "python/mojolearn/_gbdt_host.py"
      - "python/mojolearn/_backend.py"
      - "python/mojolearn/_buffer.py"
      - "python/mojolearn/_labels.py"
      - "python/mojolearn/_serialize.py"
      - "python/mojolearn/_array.py"
      - "tools/forest_host_gate.py"
      - "bench/results/forest_host/**"
      - ".github/workflows/forest-host-gate.yml"

permissions: {}

jobs:
  gate:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        # One environment per CPU OS/architecture; no repeated x86 draws.
        include:
          - runner: ubuntu-24.04-arm
            slot: arm64
            label: ARM64 Linux (Azure Cobalt 100)
          - runner: macos-15
            slot: macos15
            label: Apple silicon macOS (hosted)
          - runner: ubuntu-24.04
            slot: x86-a
            label: x86-64 Linux (24.04)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      MOJOLEARN_GATE_COMMIT: ${{ github.sha }}
      GATE_OUT: ${{ github.workspace }}/forest-host-gate-out
    defaults:
      run:
        shell: bash
    steps:
      # bench/results is large; only the forest host fixtures come down.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/bench/results/*
            /bench/results/forest_host/

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Runner facts
        run: |
          mkdir -p "$GATE_OUT"
          {
            uname -a
            python3 --version
            if [ "$(uname -s)" = Darwin ]; then
              sysctl -n machdep.cpu.brand_string
              sw_vers -productVersion
            else
              lscpu
              grep -m1 -E '^(flags|Features)' /proc/cpuinfo
            fi
          } 2>&1 | tee "$GATE_OUT/runner.txt"
          # The step shell is `bash -eo pipefail`, and ARM64 /proc/cpuinfo has no
          # `model name`, so every lookup here must tolerate no match.
          if [ "$(uname -s)" = Darwin ]; then
            cpu="$(sysctl -n machdep.cpu.brand_string || true)"
          else
            cpu="$( (grep -m1 -E '^model name' /proc/cpuinfo || true) | cut -d: -f2- | sed 's/^ //')"
            [ -n "$cpu" ] || cpu="$( (lscpu | grep -m1 'Model name' || true) | cut -d: -f2- | sed 's/^ *//')"
          fi
          echo "### ${{ matrix.slot }}: ${cpu:-unknown CPU} ($(uname -m))" >> "$GITHUB_STEP_SUMMARY"
          ls bench/results/forest_host/

      # The fixture directories split by what expected.json says. A RECORDED
      # one is compared; an OWED one is run on purpose so the workflow fails
      # until the recording exists.
      - name: Sort fixtures into recorded and owed
        run: |
          recorded=""; owed=""
          for d in bench/results/forest_host/*/; do
            d="${d%/}"
            [ -f "$d/fixture.json" ] || continue
            status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status",""))' "$d/expected.json" 2>/dev/null || echo MISSING)"
            if [ "$status" = RECORDED ]; then recorded="$recorded $d"; else owed="$owed $d"; fi
          done
          echo "recorded:$recorded" | tee -a "$GATE_OUT/fixtures.txt"
          echo "owed:$owed" | tee -a "$GATE_OUT/fixtures.txt"
          echo "RECORDED=$recorded" >> "$GITHUB_ENV"
          echo "OWED=$owed" >> "$GITHUB_ENV"
          [ -n "$recorded" ] || { echo "no recorded fixture to check" >&2; exit 2; }

      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          run-install: true
          cache: true

      - name: Build the CPU binding (production)
        run: |
          set -o pipefail
          pixi run mojo --version | tee "$GATE_OUT/mojo_version.txt"
          sh bindings/build_forest_host.sh 2>&1 | tee "$GATE_OUT/build_prod.log"

      - name: Gate, production build must reproduce every recorded prediction
        run: |
          set -o pipefail
          cp python/mojolearn/host/_mojolearn_forest_host.so "$GATE_OUT/_mojolearn_forest_host.prod.so"
          python3 tools/forest_host_gate.py check $RECORDED \
            --report "$GATE_OUT/gate_prod.json" 2>&1 | tee "$GATE_OUT/gate_prod.log"

      - name: Build the sabotage binding (MOJOLEARN_FOREST_HOST_SABOTAGE)
        if: always()
        env:
          MOJOLEARN_FOREST_HOST_OUTDIR: ${{ runner.temp }}/forest-host-sab
          MOJOLEARN_BUILD_EXTRA_DEFINES: "-D MOJOLEARN_FOREST_HOST_SABOTAGE=1"
        run: |
          set -o pipefail
          sh bindings/build_forest_host.sh 2>&1 | tee "$GATE_OUT/build_sab.log"

      # A gate that cannot fail proves nothing. The sabotage build divides the
      # vote by n_trees + 1, so every prediction differs and the gate must say
      # so on every recorded fixture.
      - name: Gate, sabotage build must be caught
        if: always()
        env:
          MOJOLEARN_FOREST_HOST_ALLOW_SABOTAGE: "1"
          MOJOLEARN_FOREST_HOST_BINARY: ${{ runner.temp }}/forest-host-sab/_mojolearn_forest_host.so
        run: |
          set -o pipefail
          python3 tools/forest_host_gate.py check $RECORDED --expect-mismatch \
            --report "$GATE_OUT/gate_sab.json" 2>&1 | tee "$GATE_OUT/gate_sab.log"

      # OWED ON PURPOSE. This step fails (exit 2) until the NVIDIA and AMD
      # recordings exist. Do not remove it and do not fill the placeholders
      # with anything but a real `record` run's output.
      - name: Owed recordings must exist (fails until recorded on each GPU vendor)
        if: always()
        run: |
          set -o pipefail
          if [ -z "$OWED" ]; then
            echo "every fixture is recorded" | tee "$GATE_OUT/owed.log"
            exit 0
          fi
          python3 tools/forest_host_gate.py check $OWED 2>&1 | tee "$GATE_OUT/owed.log"

      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: forest-host-gate-${{ matrix.slot }}
          path: forest-host-gate-out/
          if-no-files-found: warn
