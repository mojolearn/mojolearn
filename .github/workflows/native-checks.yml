name: Native checks

# The native Mojo checks (checks/native_tests/, one shared runner: runner.mojo, registry.mojo, run_cpu.mojo) compiled
# and run on the free GitHub Linux runners. The integration compile (tools/release.py candidate) builds the bindings
# only, never the checks; the orchestrator dispatches this after each integration merge
# (docs/plans/TEST_MIGRATION_2026-11-14.md). GPU checks run on the rented L40S pod with
# tools/ops/native_checks_gpu_job.sh.
#
# plan: list the registered checks of the column matching `filter` from the source (registry.mojo and each check's
# register(); tools/ops/native_checks_report.py plan) and deal them into ceil(checks/25) shards (cap 20) by a stable
# hash. build: ONE compile of the column's main (`mojo build` of run_cpu.mojo with -D MOJOLEARN_COLUMN_CPU=1) for
# every check; a failed build is the row build-<column> and every planned check reads MISSING. check: each shard
# runs the prebuilt binary once per check name (`run_cpu <name>`, one process per check so a crash stays in its row)
# with a per-check timeout, keeps going after a failure and writes results/<name>.txt plus logs/<name>.log.
# summary: merges every shard into SUMMARY.md and fails the run when any check failed or never reported.
#
# host-parse (2026-11-15, tools/prebuild_check.py): every release host group the Linux CPU leg builds
# (tools/merged_bindings.py plan --dir host --layout release, 17 groups at 6153a52c7b) generated as merged_build.sh does
# and put through `mojo build --emit llvm --no-optimization` with the host set's defines and CPU: parse, type check and
# elaboration, no LLVM optimisation and no machine code. One runner per group, all in parallel (each `-j` its cores).
# It catches a host unit that does not parse even when no check imports it (f29f76bf57: `var fn` in two doors,
# native checks 166/166). `suite` picks: all (default: the checks and host-parse), checks, host-parse.
#
# MANUAL ONLY (light-checks.yml refuses any other workflow with a push or schedule trigger):
#   gh workflow run native-checks.yml --ref main -f ref=<sha|branch> [-f filter='spectral_*,gbdt_*'] [-f suite=host-parse]
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "commit or branch to check out and run"
        required: true
      column:
        description: "column to build and run (the GitHub runners have no GPU: cpu)"
        required: false
        default: "cpu"
      filter:
        description: "comma separated globs over check names"
        required: false
        default: "*"
      timeout:
        description: "seconds per check before TIMEOUT (rc 124)"
        required: false
        default: "900"
      suite:
        description: "all (the checks and host-parse), checks, or host-parse (every release host group parsed)"
        required: false
        default: "all"

run-name: "native-checks ${{ inputs.ref }} ${{ inputs.suite || 'all' }} ${{ inputs.column }} ${{ inputs.filter }}"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      sha: ${{ steps.plan.outputs.sha }}
      host_matrix: ${{ steps.plan.outputs.host_matrix }}
      host_count: ${{ steps.plan.outputs.host_count }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false
      - name: List and shard the matching checks
        id: plan
        env:
          IN_FILTER: ${{ inputs.filter }}
          IN_COLUMN: ${{ inputs.column }}
          IN_SUITE: ${{ inputs.suite || 'all' }}
        run: |
          set -euo pipefail
          case "$IN_SUITE" in all|checks|host-parse) ;; *) echo "suite must be all, checks or host-parse" >&2; exit 2 ;; esac
          if [ "$IN_SUITE" = host-parse ]; then
            echo '{"count": 0, "shards": 0, "matrix": {"include": []}}' > plan.json; : > planned.txt
          else
            python3 tools/ops/native_checks_report.py plan --column "$IN_COLUMN" --filter "$IN_FILTER" \
              --tasks-out planned.txt > plan.json
          fi
          if [ "$IN_SUITE" = checks ]; then
            echo '[]' > host.json
          else
            # the release host groups, the plan bindings/merged_build.sh host builds on Linux (byte LM off on Linux)
            python3 tools/merged_bindings.py plan --dir host --platform linux --byte-lm 0 --layout release \
              | python3 -c 'import json,sys; print(json.dumps([dict(stem=l.split()[0], members=l.split()[2]) for l in sys.stdin if l.strip()]))' > host.json
          fi
          echo "host_matrix=$(cat host.json)" >> "$GITHUB_OUTPUT"
          echo "host_count=$(python3 -c 'import json;print(len(json.load(open("host.json"))))')" >> "$GITHUB_OUTPUT"
          python3 -c 'import json;print(len(json.load(open("host.json"))),"host groups to parse")'
          echo "count=$(python3 -c 'import json;print(json.load(open("plan.json"))["count"])')" >> "$GITHUB_OUTPUT"
          echo "matrix=$(python3 -c 'import json;print(json.dumps(json.load(open("plan.json"))["matrix"]))')" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 -c 'import json;p=json.load(open("plan.json"));print(p["count"],"checks in",p["shards"],"shards")'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-checks-plan
          path: |
            plan.json
            planned.txt
            host.json

  host-parse:
    needs: plan
    if: needs.plan.outputs.host_count != '0' && needs.plan.outputs.host_count != ''
    name: host-parse ${{ matrix.stem }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.host_matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      # Elaboration of the largest group is held in memory; the whole-set host compile was killed at 16 GB without
      # swap (release-linux-build.yml, run 40272710760). The same swap helper, sized for one group.
      - name: Swap
        run: bash tools/gha_release_box.sh swap 16 "$RUNNER_TEMP/swap.txt" || echo "no swap added"
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          run-install: true
          cache: true
          cache-write: false
          environments: default
      - name: Parse and elaborate ${{ matrix.stem }} (mojo build --emit llvm --no-optimization)
        env:
          STEM: ${{ matrix.stem }}
          MEMBERS: ${{ matrix.members }}
        run: |
          set +e -u
          mkdir -p out
          # bindings/merged_build.sh host: the host set's defines and the wheel's x86-64-v3 baseline
          target="--target-cpu x86-64-v3 --target-features +avx,+avx2,+bmi,+bmi2,+cx16,+f16c,+fma,+lzcnt,+movbe,+popcnt,+sahf,+sse3,+sse4.1,+sse4.2,+ssse3,+xsave"
          [ "$(uname -m)" = x86_64 ] || target=""
          python3 tools/generated_sources.py prepare --repo "$PWD" < /dev/null > out/generated-sources.log 2>&1 \
            || { tail -n 20 out/generated-sources.log; exit 1; }
          python3 tools/merged_bindings.py root --stem "$STEM" --members "$MEMBERS" --out "out/$STEM.mojo" < /dev/null || exit 1
          start=$(date +%s)
          pixi run mojo build -j "$(nproc)" --emit llvm --no-optimization -D MOJOLEARN_NUMERIC_IDENTICAL=1 -D MOJOLEARN_COLUMN_CPU \
            $target -I . -I bindings "out/$STEM.mojo" -o "out/$STEM.ll" > "out/$STEM.log" 2>&1
          rc=$?
          rm -f "out/$STEM.ll"
          echo "host-parse $STEM rc=$rc seconds=$(( $(date +%s) - start )) members=$MEMBERS" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -m 20 -E 'error:' "out/$STEM.log"
          tail -n 5 "out/$STEM.log"
          exit "$rc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: host-parse-${{ matrix.stem }}
          path: out/*.log

  build:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      # The one cache writer: the shard jobs restore the environment this saves (keyed by the pixi.lock hash)
      # instead of every shard solving at once (the cross-compile-check.yml pattern, same Mojo pin from pixi.lock).
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          run-install: true
          cache: true
          cache-write: true
          environments: default
      - name: Build the column's main once
        env:
          IN_COLUMN: ${{ inputs.column }}
        run: |
          set +e -u
          mkdir -p out/results out/logs bin
          defines="-D MOJOLEARN_NUMERIC_IDENTICAL=1"
          [ "$IN_COLUMN" = cpu ] && defines="$defines -D MOJOLEARN_COLUMN_CPU=1"
          # The wheel's Linux x86-64 baseline (bindings/build_mamba.sh TARGET_FLAGS). Without it `mojo build`
          # targets the build runner's own chip, and the shards that land on an older runner trap on its first
          # instruction: at 6906a59111 (run 43722561124) shards 0 and 4 SIGILLed on all 49 of their checks (rc 132,
          # 0-1 s, same main+0x7b06) while the other four shards passed every check.
          target="--target-cpu x86-64-v3 --target-features +avx,+avx2,+bmi,+bmi2,+cx16,+f16c,+fma,+lzcnt,+movbe,+popcnt,+sahf,+sse3,+sse4.1,+sse4.2,+ssse3,+xsave"
          [ "$(uname -m)" = x86_64 ] || target=""
          pixi run mojo --version > out/compiler-version.log 2>&1
          start=$(date +%s)
          # The gitignored generated modules (the archive Unicode table the archive_* checks import, the tokenizer
          # table), written exactly as the binding builds write them (bindings/merged_build.sh).
          python3 tools/generated_sources.py prepare --repo "$PWD" < /dev/null > "out/logs/generated-sources.log" 2>&1
          rc=$?
          if [ "$rc" = 0 ]; then
            pixi run mojo build $defines $target -I . -o "bin/run_$IN_COLUMN" "checks/native_tests/run_$IN_COLUMN.mojo" \
              > "out/logs/build-$IN_COLUMN.log" 2>&1
            rc=$?
          else
            cp "out/logs/generated-sources.log" "out/logs/build-$IN_COLUMN.log"
          fi
          python3 tools/ops/native_checks_report.py result "build-$IN_COLUMN" --log "out/logs/build-$IN_COLUMN.log" \
            --rc "$rc" --seconds "$(( $(date +%s) - start ))" --out-dir out/results
          echo "build rc=$rc"
          exit "$rc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-checks-build
          path: out/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-binary-${{ inputs.column }}
          path: bin/

  check:
    needs: [plan, build]
    if: needs.plan.outputs.count != '0'
    name: shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          run-install: true
          cache: true
          cache-write: false
          environments: default
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-binary-${{ inputs.column }}
          path: bin
      - name: Run the shard's checks with the prebuilt binary
        env:
          TASKS: ${{ matrix.tasks }}
          IN_TIMEOUT: ${{ inputs.timeout }}
          IN_COLUMN: ${{ inputs.column }}
        run: |
          set +e -u  # GitHub's default bash runs with -e: a failing check must not end the shard
          mkdir -p out/results out/logs
          bin="./bin/run_$IN_COLUMN"
          chmod +x "$bin"
          for name in $TASKS; do
            start=$(date +%s)
            timeout -k 30 "${IN_TIMEOUT:-900}" pixi run "$bin" "$name" > "out/logs/$name.log" 2>&1
            rc=$?
            python3 tools/ops/native_checks_report.py result "$name" --log "out/logs/$name.log" --rc "$rc" \
              --seconds "$(( $(date +%s) - start ))" --out-dir out/results
            echo "$name rc=$rc"
          done
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-checks-${{ matrix.shard }}
          path: out/

  summary:
    needs: [plan, build, check]
    if: always() && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: native-checks-*
          path: merged
          merge-multiple: true
      - name: Merge into SUMMARY.md
        run: |
          set +e -u
          printf 'source: %s\n' "${{ needs.plan.outputs.sha }}" > notes.txt
          python3 tools/ops/native_checks_report.py summary merged/results --planned merged/planned.txt \
            --notes notes.txt --out SUMMARY.md
          rc=$?
          cat SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          python3 tools/ops/native_checks_report.py report merged/results > REPORT.txt || true
          head -n 60 REPORT.txt
          exit "$rc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-checks-summary
          path: |
            SUMMARY.md
            REPORT.txt
