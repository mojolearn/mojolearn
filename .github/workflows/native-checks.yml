name: Native checks

# The native Mojo checks (checks/native_tests/, one shared runner: runner.mojo, registry.mojo, run_cpu.mojo) compiled
# and run on the free GitHub Linux runners. The integration compile (tools/release.py candidate) builds the bindings
# only, never the checks; the orchestrator dispatches this after each integration merge
# (docs/plans/TEST_MIGRATION_2026-11-14.md). GPU checks run on the rented L40S pod with
# tools/ops/native_checks_gpu_job.sh.
#
# plan: list the registered checks of the column matching `filter` from the source (registry.mojo and each check's
# register(); tools/ops/native_checks_report.py plan) and deal them into ceil(checks/25) shards (cap 20) by a stable
# hash. build: ONE compile of the column's main (`mojo build` of run_cpu.mojo with -D MOJOLEARN_COLUMN_CPU=1) for
# every check; a failed build is the row build-<column> and every planned check reads MISSING. check: each shard
# runs the prebuilt binary once per check name (`run_cpu <name>`, one process per check so a crash stays in its row)
# with a per-check timeout, keeps going after a failure and writes results/<name>.txt plus logs/<name>.log.
# summary: merges every shard into SUMMARY.md and fails the run when any check failed or never reported.
#
# MANUAL ONLY (light-checks.yml refuses any other workflow with a push or schedule trigger):
#   gh workflow run native-checks.yml --ref main -f ref=<sha|branch> [-f filter='spectral_*,gbdt_*']
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "commit or branch to check out and run"
        required: true
      column:
        description: "column to build and run (the GitHub runners have no GPU: cpu)"
        required: false
        default: "cpu"
      filter:
        description: "comma separated globs over check names"
        required: false
        default: "*"
      timeout:
        description: "seconds per check before TIMEOUT (rc 124)"
        required: false
        default: "900"

run-name: "native-checks ${{ inputs.ref }} ${{ inputs.column }} ${{ inputs.filter }}"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false
      - name: List and shard the matching checks
        id: plan
        env:
          IN_FILTER: ${{ inputs.filter }}
          IN_COLUMN: ${{ inputs.column }}
        run: |
          set -euo pipefail
          python3 tools/ops/native_checks_report.py plan --column "$IN_COLUMN" --filter "$IN_FILTER" \
            --tasks-out planned.txt > plan.json
          echo "count=$(python3 -c 'import json;print(json.load(open("plan.json"))["count"])')" >> "$GITHUB_OUTPUT"
          echo "matrix=$(python3 -c 'import json;print(json.dumps(json.load(open("plan.json"))["matrix"]))')" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 -c 'import json;p=json.load(open("plan.json"));print(p["count"],"checks in",p["shards"],"shards")'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-checks-plan
          path: |
            plan.json
            planned.txt

  build:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      # The one cache writer: the shard jobs restore the environment this saves (keyed by the pixi.lock hash)
      # instead of every shard solving at once (the cross-compile-check.yml pattern, same Mojo pin from pixi.lock).
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          run-install: true
          cache: true
          cache-write: true
          environments: default
      - name: Build the column's main once
        env:
          IN_COLUMN: ${{ inputs.column }}
        run: |
          set +e -u
          mkdir -p out/results out/logs bin
          defines="-D MOJOLEARN_NUMERIC_IDENTICAL=1"
          [ "$IN_COLUMN" = cpu ] && defines="$defines -D MOJOLEARN_COLUMN_CPU=1"
          pixi run mojo --version > out/compiler-version.log 2>&1
          start=$(date +%s)
          pixi run mojo build $defines -I . -o "bin/run_$IN_COLUMN" "checks/native_tests/run_$IN_COLUMN.mojo" \
            > "out/logs/build-$IN_COLUMN.log" 2>&1
          rc=$?
          python3 tools/ops/native_checks_report.py result "build-$IN_COLUMN" --log "out/logs/build-$IN_COLUMN.log" \
            --rc "$rc" --seconds "$(( $(date +%s) - start ))" --out-dir out/results
          echo "build rc=$rc"
          exit "$rc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-checks-build
          path: out/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-binary-${{ inputs.column }}
          path: bin/

  check:
    needs: [plan, build]
    if: needs.plan.outputs.count != '0'
    name: shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          run-install: true
          cache: true
          cache-write: false
          environments: default
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-binary-${{ inputs.column }}
          path: bin
      - name: Run the shard's checks with the prebuilt binary
        env:
          TASKS: ${{ matrix.tasks }}
          IN_TIMEOUT: ${{ inputs.timeout }}
          IN_COLUMN: ${{ inputs.column }}
        run: |
          set +e -u  # GitHub's default bash runs with -e: a failing check must not end the shard
          mkdir -p out/results out/logs
          bin="./bin/run_$IN_COLUMN"
          chmod +x "$bin"
          for name in $TASKS; do
            start=$(date +%s)
            timeout -k 30 "${IN_TIMEOUT:-900}" pixi run "$bin" "$name" > "out/logs/$name.log" 2>&1
            rc=$?
            python3 tools/ops/native_checks_report.py result "$name" --log "out/logs/$name.log" --rc "$rc" \
              --seconds "$(( $(date +%s) - start ))" --out-dir out/results
            echo "$name rc=$rc"
          done
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-checks-${{ matrix.shard }}
          path: out/

  summary:
    needs: [plan, build, check]
    if: always() && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: native-checks-*
          path: merged
          merge-multiple: true
      - name: Merge into SUMMARY.md
        run: |
          set +e -u
          printf 'source: %s\n' "${{ needs.plan.outputs.sha }}" > notes.txt
          python3 tools/ops/native_checks_report.py summary merged/results --planned merged/planned.txt \
            --notes notes.txt --out SUMMARY.md
          rc=$?
          cat SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          python3 tools/ops/native_checks_report.py report merged/results > REPORT.txt || true
          head -n 60 REPORT.txt
          exit "$rc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-checks-summary
          path: |
            SUMMARY.md
            REPORT.txt
