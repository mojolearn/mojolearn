name: Native checks

# The native Mojo checks (`check-native-*` pixi tasks, checks/native_tests/) compiled and run on the free GitHub
# Linux runners. The integration compile (tools/release.py candidate) builds the bindings only, never the checks;
# the orchestrator dispatches this after each integration merge (docs/plans/TEST_MIGRATION_2026-11-14.md). GPU
# checks run on the rented L40S pod with tools/ops/native_checks_gpu_job.sh.
#
# plan: enumerate the pixi tasks matching `filter` and deal them into ceil(tasks/12) shards (cap 20) by a stable
# hash (tools/ops/native_checks_report.py plan). check: each shard runs its tasks one at a time (a 4 vCPU runner
# holds one mojo compile at a time) with `timeout 900 pixi run <task>`, exactly as pixi.toml writes the task, keeps
# going after a failure and writes results/<task>.txt (rc + first error lines) plus logs/<task>.log. summary: merges
# every shard into SUMMARY.md and fails the run when any task failed or never reported.
#
# MANUAL ONLY (light-checks.yml refuses any other workflow with a push or schedule trigger):
#   gh workflow run native-checks.yml --ref main -f ref=<sha|branch> -f filter='check-native-*-cpu'
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "commit or branch to check out and run"
        required: true
      filter:
        description: "comma separated globs over pixi task names"
        required: false
        default: "check-native-*-cpu"
      timeout:
        description: "seconds per task before TIMEOUT (rc 124)"
        required: false
        default: "900"

run-name: "native-checks ${{ inputs.ref }} ${{ inputs.filter }}"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false
      - name: Enumerate and shard the matching tasks
        id: plan
        env:
          IN_FILTER: ${{ inputs.filter }}
        run: |
          set -euo pipefail
          python3 tools/ops/native_checks_report.py plan --filter "$IN_FILTER" --tasks-out planned.txt > plan.json
          echo "count=$(python3 -c 'import json;print(json.load(open("plan.json"))["count"])')" >> "$GITHUB_OUTPUT"
          echo "matrix=$(python3 -c 'import json;print(json.dumps(json.load(open("plan.json"))["matrix"]))')" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 -c 'import json;p=json.load(open("plan.json"));print(p["count"],"tasks in",p["shards"],"shards")'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-checks-plan
          path: |
            plan.json
            planned.txt
      # The one cache writer: the shard jobs restore the environment this saves (keyed by the pixi.lock hash)
      # instead of every shard solving at once (the cross-compile-check.yml pattern, same Mojo pin from pixi.lock).
      - uses: prefix-dev/setup-pixi@v0.10.1
        if: steps.plan.outputs.count != '0'
        with:
          run-install: true
          cache: true
          cache-write: true
          environments: default

  check:
    needs: plan
    if: needs.plan.outputs.count != '0'
    name: shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          run-install: true
          cache: true
          cache-write: false
          environments: default
      - name: Run the shard's tasks
        env:
          TASKS: ${{ matrix.tasks }}
          IN_TIMEOUT: ${{ inputs.timeout }}
        run: |
          set +e -u  # GitHub's default bash runs with -e: a failing task must not end the shard
          mkdir -p out/results out/logs
          pixi run mojo --version > out/compiler-version.log 2>&1 || true
          for task in $TASKS; do
            start=$(date +%s)
            timeout -k 30 "${IN_TIMEOUT:-900}" pixi run "$task" > "out/logs/$task.log" 2>&1
            rc=$?
            {
              echo "task: $task"
              echo "rc: $rc"
              echo "seconds: $(( $(date +%s) - start ))"
              echo "--- first error ---"
              grep -m5 -B2 -A8 'error:' "out/logs/$task.log" || tail -n 15 "out/logs/$task.log"
            } > "out/results/$task.txt"
            echo "$task rc=$rc"
          done
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-checks-${{ matrix.shard }}
          path: out/

  summary:
    needs: [plan, check]
    if: always() && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: native-checks-*
          path: merged
          merge-multiple: true
      - name: Merge into SUMMARY.md
        run: |
          set +e -u
          printf 'source: %s\n' "${{ needs.plan.outputs.sha }}" > notes.txt
          python3 tools/ops/native_checks_report.py summary merged/results --planned merged/planned.txt \
            --notes notes.txt --out SUMMARY.md
          rc=$?
          cat SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          python3 tools/ops/native_checks_report.py report merged/results > REPORT.txt || true
          head -n 60 REPORT.txt
          exit "$rc"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-checks-summary
          path: |
            SUMMARY.md
            REPORT.txt
