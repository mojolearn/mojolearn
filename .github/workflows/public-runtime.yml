name: Public runtime

# The measure of the public runtime migration (docs/plans/PUBLIC_RUNTIME_MIGRATION.md).
# tools/public_runtime_inventory.py reads the Python call path of every public
# endpoint (every public method, dunder, property and constructor) and follows
# it THROUGH its native door into the Mojo it reaches (tools/mojo_door_sites.py):
# native, glue-heavy (Python-object loops) or python-on-path (calls into Python
# code). The job fails on any increase over tools/hooks/public_runtime_door_baseline.tsv
# (debt may only go down) and on prohibited/unresolved endpoints. Static, python3
# only: nothing is built or imported.
on:
  push:
    paths:
      - "python/mojolearn/**"
      - "packaging/native_only/**"
      - "tools/public_runtime_inventory.py"
      - "tools/hooks/public_runtime_door_baseline.tsv"
      - "tools/mojo_door_sites.py"
      - "tools/tests/test_mojo_door_sites.py"
      - "bindings/**"
      - "providers/python/**"
      - "tools/tests/test_public_runtime_inventory.py"
      - ".github/workflows/public-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-runtime:
    name: public-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Tool tests (fake package)
        run: python3 -u tools/tests/test_public_runtime_inventory.py > tool-tests.log 2>&1 || { tail -n 40 tool-tests.log; exit 1; }
      - name: Non-native public methods do not grow
        run: |
          state=0
          python3 tools/public_runtime_inventory.py --check > check.log 2>&1 || state=$?
          cat check.log
          { echo '### public runtime (native / orchestrated / python per family)'; echo '```'; cat check.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $state
      - name: Door classifier tests
        run: python3 -u tools/tests/test_mojo_door_sites.py > door-tests.log 2>&1 || { tail -n 40 door-tests.log; exit 1; }
      - name: Debt through the native door does not grow
        run: |
          state=0
          python3 tools/public_runtime_inventory.py --door-check > door-check.log 2>&1 || state=$?
          tail -n 80 door-check.log
          { echo '### public runtime through the native door'; echo '```'; tail -n 80 door-check.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $state
      - name: Public lifecycle and option inventory (static, unqualified)
        run: python3 tools/public_runtime_inventory.py --endpoints-json public-endpoints.json > endpoints.log 2>&1
      - name: Retain the inventory and full checker logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-runtime-${{ github.sha }}
          path: |
            public-endpoints.json
            endpoints.log
            tool-tests.log
            check.log
            door-check.log
            door-tests.log
