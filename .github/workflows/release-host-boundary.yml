name: Release host boundary
run-name: "release-host-boundary ${{ inputs.version }}"
on:
  workflow_dispatch:
    inputs:
      version:
        required: true
      bundle_url:
        description: Short-lived private wheel bundle URL
        required: true
      bundle_sha256:
        required: true
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download exact candidate wheels
        env:
          BUNDLE_URL: ${{ inputs.bundle_url }}
          BUNDLE_SHA: ${{ inputs.bundle_sha256 }}
        run: |
          echo "::add-mask::$BUNDLE_URL"
          curl --fail --silent --show-error --retry 3 "$BUNDLE_URL" -o "$RUNNER_TEMP/wheels.tgz"
          echo "$BUNDLE_SHA  $RUNNER_TEMP/wheels.tgz" | sha256sum --check
          mkdir "$RUNNER_TEMP/wheels"
          tar -xzf "$RUNNER_TEMP/wheels.tgz" -C "$RUNNER_TEMP/wheels"
      - name: Test final installed host boundary
        run: |
          python3 tools/qualify_release_host_boundary.py --bundle "$RUNNER_TEMP/wheels" \
            --out "$RUNNER_TEMP/host-boundary" > "$RUNNER_TEMP/host-boundary-controller.log" 2>&1
      - name: Retain logs and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-host-boundary
          path: |
            ${{ runner.temp }}/host-boundary-controller.log
            ${{ runner.temp }}/host-boundary/*.log
            ${{ runner.temp }}/host-boundary/*.exit
            ${{ runner.temp }}/host-boundary/*.json
            ${{ runner.temp }}/host-boundary/*.xml
            ${{ runner.temp }}/host-boundary/test_parallel_forest_first_call.py
