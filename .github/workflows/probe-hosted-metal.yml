# Does Metal compute work on a GitHub-HOSTED macOS runner?
#
# This decides the whole release story. If it does, `release-provenance.yml`
# can build and test the wheel on `macos-15` and publish through the trusted
# publisher already configured on PyPI and TestPyPI -- no self-hosted machine,
# nothing tied to one laptop. If it does not, the wheel has to be built
# somewhere with a real GPU and the release path is different.
#
# Hosted macOS runners are real Apple silicon, but they are VIRTUALIZED, and
# whether a VM exposes the GPU to Metal compute is a fact about the runner
# rather than something to infer from the chip. So it is measured.
#
# Delete this workflow once the answer is recorded in the release workflow.

name: Probe hosted Metal

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    name: Metal compute on a hosted runner
    runs-on: macos-15
    timeout-minutes: 30
    # Deny-by-default at the workflow level, so each job adds back exactly
    # what it needs. This job needs to read the repository and nothing else.
    # Omitting it entirely is what made the first run fail: checkout got no
    # token, and a private repo with no token reports "Repository not found"
    # rather than "permission denied", which reads like the wrong URL.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Runner facts
        run: |
          sysctl -n machdep.cpu.brand_string || true
          sw_vers
          xcodebuild -version || true
          xcrun --find metal || echo "no metal compiler"
          system_profiler SPDisplaysDataType 2>/dev/null | head -20 || true

      - name: Install pixi
        uses: prefix-dev/setup-pixi@14c8aabd75893f83f4ab30c03e7cf853c8208961 # v0.8.10
        with:
          # MUST MATCH OR EXCEED THE PIXI THAT WROTE pixi.lock. The lock file
          # is version 7 and pixi v0.49.0 reads up to 6, so the pinned
          # version from mojotrees failed with "lock file version is 7". The
          # local toolchain is 0.76.2; pinning to it means CI resolves the
          # same environment every recorded result was produced under, which
          # is the whole reason the lock file is committed.
          pixi-version: v0.76.2
          cache: false

      # THE TARGET IS NAMED EXPLICITLY, and that is the finding this probe
      # already produced. A bare `mojo build` on this runner fails with
      # "constraint failed: Unknown GPU architecture detected" -- at COMPILE
      # time, not at run time -- because the hosted runner's virtualized GPU
      # is not one Mojo recognizes. Naming the accelerator removes the need
      # to detect one, which means a hosted runner CAN build a wheel even if
      # it cannot run the result. The baseline matches bindings/build.sh.
      - name: Build the probe
        run: |
          pixi run mojo build -I . \
            --target-cpu apple-m1 --target-accelerator metal:1 \
            tools/hosted_gpu_probe.mojo -o hosted_gpu_probe

      # SEPARATE STEP, AND ALLOWED TO FAIL. Building and running are two
      # different questions and this workflow exists to answer both
      # independently. If the build passes and this fails, the release
      # workflow can build on a hosted runner and must verify the wheel
      # somewhere with a real GPU.
      - name: Can it also RUN here?
        continue-on-error: true
        run: ./hosted_gpu_probe

