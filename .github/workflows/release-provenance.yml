# Build the wheel and publish it to TestPyPI or PyPI through a Trusted
# Publisher. No API token exists anywhere in this repository and none should.
#
# REWRITTEN 2026-08-20. This file was a verbatim copy of mojotrees' and could
# never have run here: it globbed `python/dist/mojotrees-*.whl`, called
# `packaging/macos/build_release_wheel.sh` before that script existed, and ran
# on `[self-hosted, macos, arm64, metal]` while this repository has zero
# registered runners. Its header also stated "The environments exist", which
# was true of mojotrees and false here -- `testpypi` and `pypi` were created
# on 2026-08-20 and were absent until then, which alone would have made every
# OIDC claim unacceptable.
#
# WHERE IT RUNS, AND WHY IT IS NOT A HOSTED RUNNER.
#
# This built on `macos-15` for exactly one release and that release was
# BROKEN. GitHub's hosted macOS runner compiles the host half of the extension
# and silently emits no Metal shader code at all -- `mojo build` exits 0. Same
# commit, two machines:
#
#                              local (M4)     hosted runner
#     __TEXT/__const            692,543 B          49,039 B
#     AIR / metallib markers           98                 0
#
# TestPyPI 0.1.0a2 was that wheel. It passed every gate, published, installed
# cleanly from the index, and died on the first fit with "Failed to create
# Metal function". packaging/macos/check_gpu_embedded.py now refuses such a
# build, but refusing is not producing: a release needs a machine with a real
# Apple GPU.
#
# So the build job runs on a SELF-HOSTED, EPHEMERAL runner labelled
# `real-gpu`. Ephemeral means it accepts one job and exits, so nothing is left
# listening on anyone's laptop; start it deliberately before dispatching a
# release. That is a real cost -- a release now depends on someone's machine
# being awake -- and it is the cost of shipping a wheel that works.
#
# BECAUSE IT HAS A GPU, THIS WORKFLOW VERIFIES THAT THE WHEEL COMPUTES.
# verify_wheel.sh runs with no flag, so every interpreter installs the wheel
# into a clean venv and runs real fits. The hosted-runner version of this file
# could only check that it imported.
#
# TRIGGERING. workflow_dispatch only. There is deliberately no `push` and no
# `pull_request`: a pull request must never reach a job holding
# `id-token: write`.

name: Release provenance

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Where to publish. Build only unless changed.
        required: true
        default: none
        type: choice
        options:
          - none
          - testpypi
          - pypi

# Deny by default. Every job adds back exactly what it needs, so a step that
# starts wanting a token has to say so in a diff.
permissions: {}

# One release at a time. Two concurrent runs could publish two different
# wheels under one version.
concurrency:
  group: release-provenance
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify the wheel
    # Self-hosted and ephemeral. See the header: a hosted runner produces a
    # wheel with no GPU kernels in it.
    runs-on: [self-hosted, macos, arm64, metal, real-gpu]
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      wheel_name: ${{ steps.digest.outputs.wheel_name }}
      wheel_sha256: ${{ steps.digest.outputs.wheel_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Runner facts
        run: |
          echo "chip:  $(sysctl -n machdep.cpu.brand_string)"
          echo "macOS: $(sw_vers -productVersion)"

      # NOT setup-pixi. This runner is a developer machine that already has
      # pixi, and the action refuses with "Destination file path
      # /Users/<user>/.pixi/bin/pixi already exists" rather than using it.
      # The self-hosted runner is the one place pixi is guaranteed present,
      # so the step verifies rather than installs -- and fails loudly if the
      # version predates the lock file, which is the actual requirement.
      - name: Use the machine's pixi
        run: |
          export PATH="$HOME/.pixi/bin:$PATH"
          echo "$HOME/.pixi/bin" >> "$GITHUB_PATH"
          command -v pixi || { echo "::error::pixi not on this runner"; exit 1; }
          pixi --version
          have=$(pixi --version | awk '{print $2}')
          need=0.76.2
          [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" = "$need" ] || {
            echo "::error::pixi $have predates the lock file (need >= $need)"
            exit 1
          }

      - name: Install python 3.10 through 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.14

      # Builds at --target-cpu apple-m1 --target-accelerator metal:1, stages
      # the MAX runtime dylibs, re-signs, checks the binary's minos against
      # the wheel tag, and runs the ISA disassembly. Each of those refuses to
      # continue rather than warning.
      - name: Build the wheel
        run: ./packaging/macos/build_release_wheel.sh

      # NO --no-gpu. This runner has a real Apple GPU, so every interpreter
      # installs the wheel into a clean venv and runs actual fits: planted
      # clusters that must be recovered, and a point that must be its own
      # nearest neighbor. This is the check TestPyPI 0.1.0a2 would have failed.
      - name: Install and RUN on every claimed interpreter
        run: ./packaging/macos/verify_wheel.sh

      - name: No interpreter may be skipped
        run: |
          out=$(./packaging/macos/verify_wheel.sh)
          echo "$out"
          echo "$out" | grep -q '^SKIP' && {
            echo "::error::an interpreter the package claims was not tested"
            exit 1
          }
          for v in 3.10 3.11 3.12 3.13 3.14; do
            echo "$out" | grep -q "PASS python$v" || {
              echo "::error::python$v is claimed but did not pass"; exit 1; }
          done
          exit 0

      - name: Metadata check
        run: pixi run -e pkg twine check python/dist/*.whl

      # The digest is recorded so the artifact that gets published can be
      # matched against the one that was built, by anyone, later.
      - name: Digest
        id: digest
        run: |
          WHEEL=$(ls python/dist/mojolearn-*.whl)
          echo "wheel_name=$(basename "$WHEEL")" >> "$GITHUB_OUTPUT"
          echo "wheel_sha256=$(shasum -a 256 "$WHEEL" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          shasum -a 256 "$WHEEL"

      - name: Upload the wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mojolearn-wheel
          path: python/dist/*.whl
          if-no-files-found: error

      - name: Say plainly what was not verified
        run: |
          {
            echo "### ${{ steps.digest.outputs.wheel_name }}"
            echo ""
            echo "\`${{ steps.digest.outputs.wheel_sha256 }}\`"
            echo ""
            echo "Verified on a real Apple GPU: portable-baseline build, ISA"
            echo "disassembly, minos/tag agreement, GPU kernels embedded, twine"
            echo "metadata, and real fits on every claimed interpreter."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish to ${{ inputs.publish }}
    needs: build
    if: inputs.publish != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The environment name is what the Trusted Publisher on PyPI and TestPyPI
    # was configured against, and it is also where a required reviewer can be
    # attached. Both `testpypi` and `pypi` exist on this repository as of
    # 2026-08-20; they did not before, and a publisher whose environment does
    # not exist rejects every claim.
    environment:
      name: ${{ inputs.publish }}
      url: ${{ inputs.publish == 'pypi' && 'https://pypi.org/p/mojolearn' || 'https://test.pypi.org/project/mojolearn/' }}
    permissions:
      # THE ONLY JOB IN THIS FILE WITH THIS PERMISSION. It mints the OIDC
      # token the Trusted Publisher checks; there is no API token anywhere.
      id-token: write
    steps:
      - name: Download the wheel that was built
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mojolearn-wheel
          path: dist

      - name: What is about to be published
        run: |
          ls -la dist
          shasum -a 256 dist/*.whl
          echo "expected: ${{ needs.build.outputs.wheel_sha256 }}"
          test "$(shasum -a 256 dist/*.whl | cut -d' ' -f1)" \
             = "${{ needs.build.outputs.wheel_sha256 }}" || {
            echo "::error::artifact digest does not match the built wheel"
            exit 1
          }

      - name: Publish
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          repository-url: ${{ inputs.publish == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
          print-hash: true
