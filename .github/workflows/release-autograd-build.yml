name: Release autograd build
run-name: "release-autograd-build ${{ inputs.vendors }} @ ${{ inputs.commit }} [${{ inputs.tag }}]"

# Manual source-frozen compilation only. The orchestrator downloads and retains
# these executables before scheduling their runtime gate on the actual GPUs.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Frozen source commit (40 hex), with all eight autograd artifacts invalidated"
        required: true
      vendors:
        description: "Build both in parallel, or retry only the failed vendor"
        type: choice
        options: [both, nvidia, amd]
        default: both
        required: true
      tag:
        description: "Dispatcher label"
        required: false
        default: ""

permissions:
  contents: read

env:
  IMAGE: rocm/dev-ubuntu-22.04@sha256:a3850e6638c6c390436ef1aacd72fd1359af36083ac823d5136818206998c484

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - vendor: nvidia
            target: sm_89
            workers: 2
          - vendor: amd
            target: gfx942
            workers: 8
    name: "autograd ${{ matrix.vendor }}-${{ matrix.target }}"
    steps:
      - name: Select vendor and validate source
        id: select
        env:
          SOURCE: ${{ inputs.commit }}
          VENDORS: ${{ inputs.vendors }}
          VENDOR: ${{ matrix.vendor }}
        run: |
          set -euo pipefail
          [[ "$SOURCE" =~ ^[0-9a-f]{40}$ ]] || { echo 'commit must be 40 hex'; exit 2; }
          case "$VENDORS" in both|nvidia|amd) ;; *) exit 2 ;; esac
          if [[ "$VENDORS" = both || "$VENDORS" = "$VENDOR" ]]; then
            echo 'selected=true' >> "$GITHUB_OUTPUT"
            mkdir -p "$RUNNER_TEMP/autograd/out/GHA"
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.select.outputs.selected == 'true'
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.select.outputs.selected == 'true'
        with:
          ref: ${{ inputs.commit }}
          path: src
          persist-credentials: false
      - name: Free disk and add bounded swap
        if: steps.select.outputs.selected == 'true'
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift
          # The existing release helper caps swap to available disk and records
          # actual allocation. This is compile capacity, not GPU emulation.
          bash tooling/tools/gha_release_box.sh swap 32 "$RUNNER_TEMP/autograd/out/GHA/swap.txt"
      - name: Pinned compiler image
        if: steps.select.outputs.selected == 'true'
        run: |
          set -euo pipefail
          ready=0
          for attempt in 1 2 3; do
            echo "image attempt=$attempt" >> "$RUNNER_TEMP/autograd/out/GHA/image-pull.log"
            if docker pull "$IMAGE" >> "$RUNNER_TEMP/autograd/out/GHA/image-pull.log" 2>&1; then ready=1; break; fi
            sleep 20
          done
          [[ "$ready" = 1 ]]
          docker image inspect "$IMAGE" > "$RUNNER_TEMP/autograd/out/GHA/image.json"
      - name: Compile eight artifacts from the clean source checkout
        if: steps.select.outputs.selected == 'true'
        timeout-minutes: 325
        env:
          SOURCE: ${{ inputs.commit }}
          VENDOR: ${{ matrix.vendor }}
          TARGET: ${{ matrix.target }}
          WORKERS: ${{ matrix.workers }}
        run: |
          set -euo pipefail
          # Bound setup + compilation below the job deadline, leaving time to
          # archive partial results on failure. No GPU devices are mounted.
          code=0
          timeout --signal=TERM --kill-after=60s 320m docker run --rm --name "autograd-${GITHUB_RUN_ID}-${VENDOR}" \
            -e MOJOLEARN_COMMIT="$SOURCE" -e GHA_IMAGE="$IMAGE" \
            -e GHA_RUNNER="$RUNNER_NAME" -e GHA_RUN="$GITHUB_RUN_ID" -e GHA_JOB="$GITHUB_JOB" \
            -v "$GITHUB_WORKSPACE/src:/root/mojolearn" -v "$GITHUB_WORKSPACE/tooling:/tooling:ro" \
            -v "$RUNNER_TEMP/autograd/out:/root/results-autograd" \
            "$IMAGE" bash /tooling/tools/gha_autograd_box.sh "$VENDOR" "$TARGET" "$WORKERS" \
            > "$RUNNER_TEMP/autograd/out/GHA/container.log" 2>&1 || code=$?
          echo "$code" > "$RUNNER_TEMP/autograd/out/GHA/container.exit"
          # Ensure a timed-out docker client cannot leave its compile running
          # while collection reads the files. This container belongs to this job.
          docker rm -f "autograd-${GITHUB_RUN_ID}-${VENDOR}" >/dev/null 2>&1 || true
          exit "$code"
      - name: Retain binaries, permissions, receipts and complete logs
        if: always() && steps.select.outputs.selected == 'true'
        env:
          VENDOR: ${{ matrix.vendor }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/autograd/out"
          # A tar preserves executable bits that upload-artifact alone drops.
          tar -czf "$RUNNER_TEMP/autograd/autograd-${VENDOR}-${TARGET}.tar.gz" -C "$RUNNER_TEMP/autograd/out" .
          cd "$RUNNER_TEMP/autograd"
          sha256sum "autograd-${VENDOR}-${TARGET}.tar.gz" > "autograd-${VENDOR}-${TARGET}.tar.gz.sha256"
          { echo 'Compilation only; runtime gates remain pending.'
            cat out/GHA/status.txt 2>/dev/null || true
            cat out/summary.json 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.select.outputs.selected == 'true'
        with:
          name: autograd-${{ matrix.vendor }}-${{ matrix.target }}-${{ inputs.commit }}
          path: |
            ${{ runner.temp }}/autograd/autograd-*.tar.gz
            ${{ runner.temp }}/autograd/autograd-*.tar.gz.sha256
          retention-days: 14
          if-no-files-found: error
