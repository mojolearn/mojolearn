name: Feature proposal
description: Propose an estimator, hardware column, API, or identity-profile extension
title: "[proposal] "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe what becomes possible; a proposed implementation alone is not the problem statement.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope and boundaries
    validations:
      required: true
  - type: textarea
    id: upstream
    attributes:
      label: Relevant upstream implementation or specification
      description: Include source, version/commit and license when applicable.
  - type: dropdown
    id: help
    attributes:
      label: Would you like to help implement or maintain this?
      options:
        - Yes, implementation and ongoing maintenance
        - Yes, implementation or testing
        - Yes, design/review only
        - Not currently
    validations:
      required: true
